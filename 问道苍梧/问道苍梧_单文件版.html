<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="问道苍梧">
<title>问道苍梧 · 修仙模拟器</title>
<style>
/* ============================================================
   问道苍梧 · 水墨纸墨主题（重制版）
   基调：墨色纸面 + 远山剪影 + 细笔触纹理；去模板感、去满屏发光、去胶囊标签
   兼容全部既有类名（ui.js 引用不变）
   ============================================================ */
:root{
  --bg0:#0c1015; --bg1:#11161e; --bg2:#161d28; --bg3:#1b2330;
  --ink:#d8d2c4; --ink-dim:#8b8577; --ink-faint:#5b564c;
  --gold:#b9984a; --gold-bright:#e0cd94; --gold-dim:#6f5a2c;
  --jade:#5aa98a; --jade-dim:#3d7a62;
  --blood:#b5503e; --blood-bright:#cf5f4a;
  --line:rgba(224,214,186,.14); --line-dim:rgba(224,214,186,.08);
  --card:rgba(21,27,38,.88); --card-hover:rgba(28,37,51,.94);
  --shadow:0 12px 32px rgba(0,0,0,.42);
  --radius:10px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
html{background:#0c1015;}
body{
  font-family:"Noto Serif SC","Source Han Serif SC","STKaiti","KaiTi","SimSun",serif;
  color:var(--ink); min-height:100vh; overflow-x:hidden; position:relative;
  /* 墨色底 + 淡月晕 + 山间薄雾（刻意克制，不发光不花哨） */
  background:
    radial-gradient(1100px 520px at 80% -6%, rgba(130,160,190,.07), transparent 62%),
    radial-gradient(950px 500px at -6% 106%, rgba(90,150,130,.055), transparent 62%),
    linear-gradient(178deg, #0d1116 0%, #10151d 46%, #0a0e13 100%);
}
/* 远山剪影（固定底层，水墨画意） */
body::before{
  content:""; position:fixed; left:0; right:0; bottom:0; height:38vh; z-index:0;
  pointer-events:none; opacity:.55;
  background-repeat:no-repeat; background-position:bottom center; background-size:cover;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 300' preserveAspectRatio='none'><path d='M0 300 L0 236 Q140 118 300 206 Q430 262 530 178 Q650 88 770 196 Q890 276 990 208 Q1100 128 1200 226 L1200 300 Z' fill='%23131a24'/><path d='M0 300 L0 268 Q210 168 390 250 Q570 312 730 232 Q900 142 1200 252 L1200 300 Z' fill='%230e141c'/></svg>");
}
/* 纸面暗角（让正文聚焦，非纯色） */
body::after{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(130% 130% at 50% 38%, transparent 58%, rgba(4,6,9,.34) 100%);
}
#app{max-width:980px; margin:0 auto; min-height:100vh; position:relative; z-index:1;}
.hidden{display:none !important;}
button{font-family:inherit; cursor:pointer;}

/* ---------- 通用按钮（平实，不发光） ---------- */
.btn{
  background:linear-gradient(180deg, #1c2432, #161d29);
  border:1px solid var(--line); color:var(--ink); border-radius:var(--radius);
  padding:11px 20px; font-size:15px; letter-spacing:2px; transition:.16s;
}
.btn:hover{color:var(--gold-bright); border-color:rgba(185,152,74,.42); background:linear-gradient(180deg,#222b3b,#1a2230);}
.btn:active{transform:translateY(1px);}
.btn-primary{background:linear-gradient(180deg,#c9a75a,#a5863f); color:#1a1508; border-color:rgba(201,167,90,.6);}
.btn-primary:hover{color:#0d0b05; background:linear-gradient(180deg,#d4b46c,#b08f46);}
.btn-big{width:100%; padding:15px; font-size:18px; margin-top:16px;}
.btn:disabled{opacity:.35; cursor:not-allowed; transform:none;}
.mini-btn{background:transparent; border:1px solid var(--line-dim); color:var(--ink-dim); border-radius:7px; padding:3px 11px; font-size:13px; transition:.14s;}
.mini-btn:hover{color:var(--gold-bright); border-color:var(--line); background:rgba(224,214,186,.05);}

/* ---------- 开始界面 ---------- */
.screen{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px 16px; animation:fadeIn .5s;}
@keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
.title-wrap{text-align:center; margin-bottom:36px;}
.title-deco{font-size:30px; color:var(--gold-dim); opacity:.85; margin-bottom:10px;}
.game-title{font-size:54px; letter-spacing:16px; color:#e8e1cd; font-weight:700; text-shadow:0 1px 0 rgba(0,0,0,.5);}
@media(max-width:600px){.game-title{font-size:36px; letter-spacing:8px;}}
.game-sub{color:var(--jade); letter-spacing:8px; margin-top:12px; font-size:14px;}
.game-desc{color:var(--ink-dim); line-height:2; margin-top:18px; font-size:15px; max-width:560px;}
.start-btns{display:flex; flex-direction:column; gap:10px; width:min(320px, 88vw);}
.hint{color:var(--jade-dim); margin-top:14px; font-size:14px; min-height:20px;}
.foot-note{color:var(--ink-faint); font-size:12px; margin-top:26px;}

/* ---------- 创建角色 ---------- */
.panel-title{color:var(--ink); letter-spacing:8px; font-size:22px; margin-bottom:20px; text-align:center;}
.create-block{margin-bottom:20px; width:min(640px, 94vw);}
.c-label{display:block; color:var(--ink); margin-bottom:8px; letter-spacing:2px; font-size:15px;}
.c-tip{color:var(--ink-faint); font-size:12px; margin-left:6px;}
#inp-name{width:100%; background:var(--bg2); border:1px solid var(--line-dim); color:var(--ink); padding:12px 14px; font-size:18px; border-radius:var(--radius); letter-spacing:4px; font-family:inherit;}
#inp-name:focus{outline:none; border-color:var(--line);}
.card-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media(max-width:600px){.card-grid{grid-template-columns:1fr;}}
.origin-card{background:var(--card); border:1px solid var(--line-dim); border-radius:var(--radius); padding:12px 14px; cursor:pointer; transition:.16s; position:relative;}
.origin-card:hover{border-color:var(--line); transform:translateY(-1px);}
.origin-card.sel{border-color:rgba(185,152,74,.5); background:linear-gradient(180deg, rgba(185,152,74,.10), rgba(21,27,38,.9));}
.origin-card .oc-name{color:var(--gold-bright); font-size:17px; letter-spacing:2px;}
.origin-card .oc-tag{font-size:11px; color:var(--jade); border:1px solid rgba(90,169,138,.4); border-radius:4px; padding:0 6px; margin-left:6px;}
.origin-card .oc-desc{color:var(--ink-dim); font-size:13px; line-height:1.7; margin-top:6px;}
.origin-card .oc-lock{position:absolute; top:8px; right:10px; font-size:11px; color:var(--ink-faint);}
.chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.chip{background:var(--bg2); border:1px solid var(--line-dim); color:var(--ink-dim); border-radius:8px; padding:7px 14px; font-size:14px; transition:.14s;}
.chip:hover{border-color:var(--line); color:var(--ink);}
.chip.sel{background:rgba(185,152,74,.12); border-color:rgba(185,152,74,.5); color:var(--gold-bright);}
.chip.locked{opacity:.4; cursor:not-allowed;}
.temper-row{display:flex; gap:12px; flex-wrap:wrap;}
.temper-cell{flex:1; min-width:150px; background:var(--card); border:1px solid var(--line-dim); border-radius:var(--radius); padding:10px 12px; text-align:center;}
.temper-cell b{display:block; color:var(--gold-bright); font-size:22px; margin:4px 0;}
.temper-cell .t-axis{color:var(--ink-dim); font-size:13px;}

/* ---------- 顶栏（图标导航，扁平） ---------- */
#topbar{position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:7px 12px; background:rgba(12,16,21,.9); border-bottom:1px solid var(--line-dim); backdrop-filter:blur(8px);}
.tb-loc{color:var(--jade); font-size:13px; letter-spacing:2px; white-space:nowrap;}
.topbar-right{display:flex; gap:2px; flex-wrap:wrap; justify-content:flex-end;}
.tb-btn{display:inline-flex; align-items:center; gap:6px; background:transparent; border:1px solid transparent; color:var(--ink-dim); padding:6px 9px; border-radius:8px; font-size:13px; transition:.14s;}
.tb-btn .tb-ico{width:15px; height:15px; flex:none; opacity:.85;}
.tb-btn:hover{color:var(--gold-bright); background:rgba(224,214,186,.05);}
.tb-btn.active{color:var(--gold-bright); background:rgba(185,152,74,.10); border-color:rgba(185,152,74,.22);}
@media(max-width:560px){#topbar{padding:5px 8px;} .tb-btn{padding:5px 7px;} .tb-btn .tb-label{display:none;} .tb-loc{font-size:11px;}}

/* ---------- 剧情区 ---------- */
#story-area{max-width:760px; margin:0 auto; padding:28px 20px 96px; position:relative;}
#scene-meta{display:flex; gap:10px; align-items:center; margin-bottom:10px;}
.chapter-label{color:var(--jade); font-size:12px; letter-spacing:3px;}
.loc-label{color:var(--ink-faint); font-size:12px; border:1px solid var(--line-dim); border-radius:4px; padding:1px 8px;}
#scene-title{color:var(--ink); font-size:25px; letter-spacing:5px; margin-bottom:18px; font-weight:700;}
#scene-text{line-height:2.05; font-size:17px; color:var(--ink); white-space:pre-wrap; min-height:120px;}
#scene-text .spk{color:var(--gold);}
#scene-text .spk-wulao{color:var(--jade);}
#scene-text .em{color:var(--blood-bright);}
#scene-text .dim{color:var(--ink-dim);}
/* 说话人头像名牌 */
.speaker-chip{display:inline-flex; align-items:center; gap:7px; margin:2px 0 8px; background:rgba(224,214,186,.05); border:1px solid var(--line-dim); border-radius:9px; padding:3px 10px 3px 3px; vertical-align:middle;}
.speaker-chip img.avatar{width:40px; height:40px; border-radius:7px; image-rendering:pixelated; border:1px solid var(--line-dim); background:#0d1116; flex:none;}
.speaker-chip b{font-size:13px; letter-spacing:2px; color:var(--gold-bright);}
.caret{color:var(--gold); animation:blink .8s steps(1) infinite; display:inline;}
@keyframes blink{50%{opacity:0;}}
#choices{margin-top:28px; display:flex; flex-direction:column; gap:10px;}
.choice-btn{text-align:left; background:rgba(21,27,38,.72); border:1px solid var(--line-dim); border-left:3px solid var(--line-dim); color:var(--ink); padding:13px 16px; border-radius:8px; font-size:15px; line-height:1.8; transition:.16s; animation:btnRise .3s ease both;}
@keyframes btnRise{from{opacity:0;} to{opacity:1;}}
.choice-btn:hover{border-color:var(--line); border-left-color:var(--gold); color:var(--gold-bright); background:rgba(28,37,51,.9); transform:translateX(3px);}
.choice-btn .cb-hint{display:inline-block; margin-left:8px; font-size:12px; color:var(--blood); border:1px solid rgba(181,80,62,.5); border-radius:4px; padding:0 6px; vertical-align:middle;}
.choice-btn .cb-effect{display:block; font-size:12px; color:var(--jade-dim); margin-top:4px;}
.choice-btn:disabled{opacity:.4; cursor:default; transform:none;}

/* ---------- 底部状态栏 ---------- */
#status-bar{position:fixed; bottom:0; left:0; right:0; z-index:40; display:flex; gap:16px; justify-content:center; padding:8px 12px; background:rgba(12,16,21,.94); border-top:1px solid var(--line-dim); font-size:13px; color:var(--ink-dim); flex-wrap:wrap;}
#status-bar span{letter-spacing:1px;}
.sb-save{color:var(--jade-dim);}

/* ---------- 面板（侧滑，纸感） ---------- */
.panel{position:fixed; top:52px; right:10px; width:min(400px, calc(100vw - 20px)); bottom:44px; z-index:60; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; overflow-y:auto; animation:slideIn .2s;}
@keyframes slideIn{from{opacity:0; transform:translateX(20px);} to{opacity:1; transform:none;}}
@media(max-width:760px){.panel{top:0; right:0; bottom:0; width:100vw; border-radius:0; padding-top:54px;}}
.panel-backdrop{position:fixed; inset:0; z-index:55; background:rgba(0,0,0,.5);}
.panel h3{color:var(--ink); letter-spacing:3px; margin-bottom:12px; font-size:17px; border-bottom:1px solid var(--line-dim); padding-bottom:8px; display:flex; align-items:center; justify-content:space-between;}
.panel .p-close{background:none; border:none; color:var(--ink-faint); font-size:15px; padding:2px 6px; display:inline-flex;}
.panel .p-close:hover{color:var(--blood-bright);}
.p-close svg{width:15px; height:15px;}
.p-close:before{content:"";}

/* 状态面板 */
.char-card{display:flex; gap:12px; align-items:center; background:var(--bg2); border:1px solid var(--line-dim); border-radius:var(--radius); padding:12px; margin-bottom:12px;}
.char-card .avatar{width:84px; height:84px; flex:none; border-radius:8px; border:1px solid var(--line-dim); image-rendering:pixelated; background:#0d1116;}
.cc-info b{color:var(--gold-bright); font-size:19px; letter-spacing:2px;}
.cc-info .cc-title{color:var(--ink-dim); font-size:13px; margin:3px 0 6px;}
.cc-info .cc-root{color:var(--jade); font-size:13px; letter-spacing:1px; margin-bottom:8px;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.stat-cell{background:var(--bg2); border:1px solid var(--line-dim); border-radius:8px; padding:8px 10px;}
.stat-cell .s-name{color:var(--ink-faint); font-size:12px;}
.stat-cell .s-val{color:var(--ink); font-size:16px; margin-top:2px;}
.stat-cell .s-val.gold{color:var(--gold-bright);}
.stat-cell .s-val.jade{color:var(--jade);}
.equip-line{background:var(--bg2); border:1px solid var(--line-dim); border-radius:8px; padding:8px 12px; font-size:13px; color:var(--ink-dim); line-height:1.8;}
.bar{height:8px; background:#0c1116; border:1px solid var(--line-dim); border-radius:4px; overflow:hidden; margin-top:5px;}
.bar i{display:block; height:100%; background:linear-gradient(90deg, var(--jade-dim), var(--jade)); transition:width .5s;}
.bar.gold i{background:linear-gradient(90deg, #6f5a2c, var(--gold-bright));}

/* 背包 */
.inv-group{margin-bottom:14px;}
.inv-group h4{color:var(--jade); font-size:14px; letter-spacing:2px; margin-bottom:6px;}
.inv-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(104px,1fr)); gap:8px;}
.inv-item{background:var(--bg2); border:1px solid var(--line-dim); border-radius:8px; padding:8px; text-align:center; cursor:pointer; transition:.14s; position:relative;}
.inv-item:hover{border-color:var(--line); transform:translateY(-1px);}
.inv-item .ii-name{font-size:13px; color:var(--ink); line-height:1.5;}
.inv-item .ii-count{font-size:12px; color:var(--gold-bright);}
.inv-item .ii-tier{font-size:10px; color:var(--ink-faint);}
.tier-1{color:var(--ink-dim);} .tier-2{color:#6fae8f;} .tier-3{color:#6f9fc4;} .tier-4{color:#9a7fc0;} .tier-5{color:#c49a5a;} .tier-6{color:#c06a5a;}

/* 关系 */
.rel-card{display:flex; gap:10px; align-items:center; background:var(--bg2); border:1px solid var(--line-dim); border-radius:8px; padding:10px; margin-bottom:8px;}
.rel-card .avatar{width:50px; height:50px; flex:none; border-radius:6px; image-rendering:pixelated; border:1px solid var(--line-dim);}
.rel-card .rc-name{color:var(--gold-bright); font-size:15px;}
.rel-card .rc-status{font-size:12px; color:var(--jade); margin-left:6px;}
.rel-card .rc-rel{font-size:12px; color:var(--ink-dim);}
.rel-card .rc-likes{font-size:12px; color:var(--ink-faint); margin-top:2px;}
.rel-card .rc-secret{font-size:12px; color:var(--jade); margin-top:3px; line-height:1.7;}
.rel-card .rc-gift{margin-left:auto; font-size:12px; align-self:center;}

/* 地图 */
#map-box{position:relative; width:100%; aspect-ratio:4/3; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:#0b0f14;}
.region-label{position:absolute; font-size:13px; letter-spacing:4px; color:rgba(224,214,186,.13); pointer-events:none;}
.loc-dot{position:absolute; width:14px; height:14px; border-radius:50%; transform:translate(-50%,-50%); border:2px solid var(--gold-dim); background:rgba(185,152,74,.22); cursor:pointer; transition:.16s; z-index:3;}
.loc-dot:hover{transform:translate(-50%,-50%) scale(1.35); background:rgba(185,152,74,.4);}
.loc-dot.locked{background:rgba(90,88,78,.16); border-color:var(--ink-faint); cursor:default;}
.loc-dot.current{box-shadow:0 0 0 3px rgba(185,152,74,.18); animation:pulse 2s infinite;}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(185,152,74,.08);}}
.loc-label-map{position:absolute; transform:translate(-50%,10px); font-size:11px; color:var(--ink-dim); white-space:nowrap; z-index:3; pointer-events:none; text-shadow:0 1px 2px #000;}
#map-fog{position:absolute; inset:0; z-index:5; background:#05070a; transition:opacity .8s;}
.map-loc-info{position:absolute; left:50%; bottom:8px; transform:translateX(-50%); z-index:6; background:rgba(12,16,21,.94); border:1px solid var(--line); border-radius:8px; padding:8px 14px; font-size:13px; max-width:92%; text-align:center;}
.map-loc-info b{color:var(--gold-bright);}

/* 图鉴（分段式标签，非胶囊） */
.best-prog{background:var(--bg2); border:1px solid var(--line-dim); border-radius:8px; padding:10px 12px; margin-bottom:12px; font-size:13px; color:var(--ink-dim);}
.best-tabs{display:flex; gap:2px; margin-bottom:12px; background:rgba(0,0,0,.28); border:1px solid var(--line-dim); padding:3px; border-radius:8px; flex-wrap:wrap;}
.best-tab{background:transparent; border:none; color:var(--ink-dim); padding:6px 14px; border-radius:6px; font-size:13px; transition:.14s;}
.best-tab:hover{color:var(--ink);}
.best-tab.sel{background:var(--bg3); color:var(--gold-bright);}
.best-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:8px;}
.best-card{background:var(--bg2); border:1px solid var(--line-dim); border-radius:8px; padding:8px; font-size:12px; text-align:center;}
.best-card b{color:var(--ink);}
.best-card .bk{color:var(--ink-faint);}
.best-card.lit{border-color:var(--line);}
.best-card.lit b{color:var(--gold-bright);}

/* 功法 */
.skill-card{background:var(--bg2); border:1px solid var(--line-dim); border-radius:8px; padding:10px 12px; margin-bottom:8px;}
.skill-card b{color:var(--gold-bright);}
.skill-card .sk-tier{font-size:11px; color:var(--jade); margin-left:6px;}
.skill-card .sk-desc{color:var(--ink-dim); font-size:13px; line-height:1.8; margin-top:4px;}

/* 存档 */
.slot-card{background:var(--bg2); border:1px solid var(--line-dim); border-radius:8px; padding:10px 12px; margin-bottom:8px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.slot-card b{color:var(--gold-bright); font-size:15px;}
.slot-card .sl-meta{color:var(--ink-dim); font-size:12px; flex:1; min-width:120px;}
.slot-card button{font-size:12px;}
.export-box{width:100%; min-height:88px; background:#0b0f14; border:1px solid var(--line-dim); color:var(--ink); border-radius:8px; padding:8px; font-size:11px; font-family:monospace; resize:vertical;}

/* 设置 */
.set-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line-dim);}
.set-row label{color:var(--ink); font-size:15px;}
.toggle{position:relative; width:44px; height:23px; background:#0b0f14; border:1px solid var(--line-dim); border-radius:12px; cursor:pointer; transition:.2s;}
.toggle.on{background:rgba(90,169,138,.3); border-color:var(--jade-dim);}
.toggle i{position:absolute; top:2px; left:2px; width:17px; height:17px; border-radius:50%; background:var(--ink-faint); transition:.2s;}
.toggle.on i{left:23px; background:var(--jade);}

/* ---------- 战斗 ---------- */
.combat-panel{position:fixed; inset:0; z-index:70; background:rgba(8,11,15,.97); padding:18px; overflow-y:auto; animation:fadeIn .3s;}
.combat-inner{max-width:640px; margin:0 auto; display:flex; flex-direction:column; min-height:100%;}
.combat-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
.combat-head span{color:var(--blood-bright); font-size:19px; letter-spacing:4px;}
.cb-enemy,.cb-player{background:var(--bg2); border:1px solid var(--line-dim); border-radius:10px; padding:10px 14px; margin-bottom:10px;}
.cb-enemy b{color:var(--blood); font-size:17px;}
.cb-player b{color:var(--jade); font-size:17px;}
.hp-bar{height:10px; background:#0b0f14; border:1px solid var(--line-dim); border-radius:5px; overflow:hidden; margin-top:6px;}
.hp-bar i{display:block; height:100%; transition:width .4s;}
.cb-enemy .hp-bar i{background:linear-gradient(90deg,#7a2a20,var(--blood-bright));}
.cb-player .hp-bar i{background:linear-gradient(90deg,var(--jade-dim),var(--jade));}
.cb-log{background:#0b0f14; border:1px solid var(--line-dim); border-radius:8px; padding:8px 12px; min-height:110px; max-height:34vh; overflow-y:auto; font-size:14px; line-height:1.9; color:var(--ink-dim); margin-bottom:12px;}
.cb-log .hit{color:var(--blood);}
.cb-log .heal{color:var(--jade);}
.cb-options{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:8px; margin-top:auto;}
.cb-opt{background:var(--card); border:1px solid var(--line-dim); border-left:3px solid var(--jade-dim); color:var(--ink); padding:11px 14px; border-radius:8px; font-size:15px; text-align:left; transition:.14s;}
.cb-opt:hover{border-color:var(--line); border-left-color:var(--gold); color:var(--gold-bright);}
.cb-opt:disabled{opacity:.35; cursor:default;}
@media(max-width:600px){.combat-panel{padding:12px;} .cb-options{grid-template-columns:1fr;}}

/* ---------- 弹层 / 通知 ---------- */
.modal{position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.62); animation:fadeIn .2s;}
#modal-body{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); max-width:min(460px, 92vw); width:100%; padding:20px; max-height:80vh; overflow-y:auto;}
#modal-body h3{color:var(--gold-bright); letter-spacing:2px; margin-bottom:8px;}
#modal-body p{color:var(--ink); line-height:1.9; font-size:15px;}
#modal-body .m-dim{color:var(--ink-dim); font-size:13px;}
#modal-body .m-btns{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}
#toasts{position:fixed; top:58px; left:50%; transform:translateX(-50%); z-index:90; display:flex; flex-direction:column; gap:6px; align-items:center; pointer-events:none;}
.toast{background:rgba(21,27,38,.95); border:1px solid var(--line); color:var(--gold-bright); padding:8px 18px; border-radius:8px; font-size:14px; box-shadow:var(--shadow); animation:toastIn .3s, toastOut .4s 2.6s forwards;}
@keyframes toastIn{from{opacity:0; transform:translateY(-10px);} to{opacity:1; transform:none;}}
@keyframes toastOut{to{opacity:0; transform:translateY(-6px);}}

/* 结局卡 */
.ending-card{background:linear-gradient(180deg, rgba(185,152,74,.09), rgba(21,27,38,.75)); border:1px solid rgba(185,152,74,.4); border-radius:var(--radius); padding:24px; text-align:center; margin-top:20px;}
.ending-card h3{color:var(--gold-bright); font-size:21px; letter-spacing:6px;}
.ending-card p{color:var(--ink); line-height:2; margin-top:10px; font-size:15px;}
/* 章节转场卡（克制，无光晕） */
.chapter-card{position:fixed; top:20%; left:50%; transform:translateX(-50%); z-index:150; text-align:center; color:var(--gold-bright); letter-spacing:5px; font-size:19px; background:rgba(12,16,21,.95); border:1px solid var(--line); border-radius:10px; padding:15px 30px; pointer-events:none; animation:chapIn 2.5s ease both;}
.chapter-card b{display:block; font-size:14px; color:var(--ink-dim); margin-top:6px; letter-spacing:3px; font-weight:normal;}
@keyframes chapIn{0%{opacity:0; transform:translateX(-50%) translateY(-8px);} 10%{opacity:1;} 82%{opacity:1;} 100%{opacity:0; transform:translateX(-50%) translateY(0);}}
/* 突破金光（柔化） */
.break-flash{position:fixed; inset:0; z-index:200; pointer-events:none; background:radial-gradient(circle at 50% 50%, rgba(224,205,148,.22), transparent 66%); animation:breakFade .95s ease-out;}
@keyframes breakFade{from{opacity:1;} to{opacity:0;}}

/* 滚动条 */
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:rgba(185,152,74,.22); border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}

</style>

'临江城，沈家正堂。\n\n时值深秋，檐角的铜铃被风撞得叮当作响。正堂里高悬着十八盏大红灯笼，烛火摇曳，映得满堂喜气——今日是沈家嫡子{name}的成人礼。\n\n宾客们衣冠楚楚，分坐两列，正低声谈笑。香案上供着沈家列祖的牌位，袅袅青烟盘旋而上，混着茶香与脂粉气，在堂中久久不散。\n\n没人注意到，堂外起了风，吹得门帘微微鼓起，像谁轻轻叹了口气。\n\n慕容家家主慕容昭端坐上首，慢条斯理地吹了吹茶盏上的浮沫，这才抬眼扫过堂下。他今日穿一身靛蓝锦袍，袖口绣着金线云纹——是慕容家出门"办事"的行头。\n\n他放下茶盏，瓷盏磕在案上，发出一声清脆的响：\n\n@慕容昭@「沈家贤侄三年前灵根被废，与我慕容家的婚约，便到此为止吧。」\n\n满堂哗然。\n\n有宾客失手碰翻了茶盏，瓷片碎了一地；有人交头接耳，目光在你与慕容雪之间来回逡巡。你看见旁支的沈天虎嘴角勾起一丝幸灾乐祸的笑，看见慕容烈在人群里肆无忌惮地嗤笑出声，看见几个平日巴结慕容家的商贾悄悄挪了挪屁股，离沈家远了些。\n\n你看见父亲@沈伯渊@的指节捏得发白，手背上的青筋一根根暴起，却只换来慕容昭一声不咸不淡的叹息：\n\n@慕容昭@「退婚书已备好。沈家若肯痛快签下，慕容家愿赠丹药十瓶，全了两家的体面。」\n\n~体面。~ 你在心里咀嚼这两个字，忽然觉得有些好笑。三年前那场"意外"之后，这世间何曾给过沈家体面？\n\n慕容雪站在父亲身侧。她今日穿了一件月白流仙裙，腰间坠着白玉佩，鬓边簪着并蒂海棠——还是你们定亲那年她最爱的样式。她眉目清冷，看你的眼神像在看一件蒙尘的旧物，又像在躲着什么。\n\n@慕容雪@「{name}，你我自小定亲，我也曾真心待过你。」她顿了顿，声音轻柔，却字字如刀，「可你如今……连炼气一层都修不回来，让我如何嫁你？」\n\n~如何嫁我。~ 你低头看着自己的手。三年了，这双手连一枚最普通的聚气丹都炼不出来，握剑都会抖。可就是这双手，曾在三年前的测灵台上，引来满城金光，惊得慕容昭亲自登门提亲。\n\n那一夜之后，一切都变了。\n\n你听见母亲在身后绞紧了帕子，听见父亲压抑的喘息，听见满堂宾客屏息凝神，等着看沈家的笑话。烛火噼啪一响，在你眼底跳了一下。\n\n你的手垂在身侧，指尖微微发抖——可没有人注意到。三年前测灵台上那个意气风发的少年，如今在他们眼里，不过是一块等待被丢弃的旧布。\n\n~奇怪的是，今晨你路过祠堂时，那面祖传的铜镜……似乎动了一下。~\n\n像一颗石子，投入了死水。\n\n~而我，要在这水里，站直了。~',
  choices: [
    { text:'缓缓上前，接过退婚书，一笔一划签下名字。', effects:{ temper:{ gongli:1 }, flags:{ sign_divorce:true }, rel:{ murong_xue:-3, shen_bo:-2, shen_mu:-1 } }, goto:'v1n_01a' },
    { text:'当众质问慕容雪：「三年前那晚，你真的一无所知吗？」', danger:true, effects:{ temper:{ xiayi:1 }, flags:{ question_public:true }, rel:{ murong_xue:-8, shen_bo:2, shen_mu:1 } }, goto:'v1n_01a' },
    { text:'一言不发，只是死死盯住慕容雪，将这一幕刻进心里。', effects:{ temper:{ henla:1 }, flags:{ remember_face:true }, rel:{ murong_xue:-5 } }, goto:'v1n_01a' }
  ]
};

    { cond:{ flag:'sign_divorce' }, text:'你上前，从慕容昭手中接过退婚书。纸上墨迹已干，只有落款处留着一方空白。\n\n你提笔，一笔一划，写下自己的名字——笔尖压得很稳。\n\n满堂哗然。有人松了口气，有人交头接耳："沈家小子倒是干脆。"慕容昭眯起眼，点了点头："识时务。"慕容雪站在他身侧，别过脸，你没有看清她的表情。\n\n你放下笔，把退婚书推回去，转身离开正堂——没再看任何人一眼。父亲沈伯渊张了张嘴，终究什么也没说。\n\n夜里，你独自跪在祠堂的列祖牌位前。白日里那笔墨的触感还留在指尖。你低头，看着自己这双"废了三年"的手。\n\n~三年前，这双手曾在测灵台上引来满城金光。~\n\n~今晚，它签下的，是一纸到此为止。~\n\n祠堂里只剩一灯如豆。你正要起身——怀中的古镜，忽然轻轻一颤。' },
    { cond:{ flag:'question_public' }, text:'你上前一步，声音不大，却让满堂霎时一静：\n\n@你@「慕容雪，三年前那晚，你真的一无所知吗？」\n\n慕容雪的脸色白了一瞬。她垂下眼，指尖绞紧袖口，指节发白——却终究没有回答。\n\n慕容昭的脸色沉了下来：「沈家小子，慎言！这退婚书，你签是不签？」\n\n满堂宾客面面相觑，议论声像潮水，涌起又退下。父亲沈伯渊上前，压着声音拉住你的手腕：「……够了。」\n\n你看了慕容雪最后一眼，她没有抬头。\n\n夜里，你独自走进祠堂。白日里那句没能得到回答的质问，还堵在胸口。你跪在列祖牌位前，烛火在风里晃了晃。\n\n~三年前那晚，到底发生了什么？~\n\n你正要起身——怀中的古镜，忽然轻轻一颤。' },

  location: 'loc_shenjia',
  text:
'当晚，沈家祠堂。\n\n白日的喧嚣早已散尽，祠堂里只剩一灯如豆。窗外风声呜咽，霜气顺着门缝渗进来，冻得人指尖发麻。\n\n退婚宴上的烛火仿佛还在眼前烧——慕容昭那声"到此为止"、满堂宾客屏息的目光、慕容雪垂下的眼睫。你在祠堂里跪了许久，直到烛芯"哔剥"爆出一声轻响，才恍然回神。\n\n~三年前，就是从这面镜子开始，一切都不对了。~\n\n~今晚，就从这面镜子开始，把一切都讨回来。~\n\n你跪在列祖牌位前，手里握着那面祖传铜镜。铜镜冰凉，镜面斑驳，照出一张失意的脸——眉目间依稀还有三年前那个意气风发的少年的影子，只是眼底的光，早就熄了。\n\n~三年前，就是这面镜子，在你测出天灵根的那一夜，裂过一道细纹。~ 你一直以为那是错觉。\n\n可此刻，镜面忽然泛起一层幽光。那光很淡，像深水里浮起的一粒萤火，却让整间祠堂的烛火都晃了一晃。\n\n一个苍老却中气十足的声音在你脑海中炸开：\n\n#梧老#「嘿，小子，憋了三年的话，老夫总算能说了——你可知你怀里这面镜子，是什么来头？」\n\n你猛地站起，铜镜险些脱手，撞得供桌上的香炉"当"地一声响。\n\n#梧老#「别摔！摔了老夫可就没地方住了！……啧，看你吓的。放心，老夫是残魂，不吃人。就是在这破镜子里困了不知多少年，闷得慌。」\n\n镜面里浮现一张模糊的老脸：白眉，高颧骨，嘴角噙着一抹看起来相当欠揍的笑意，正上上下下打量你，像打量一件刚出土的宝贝。\n\n#梧老#「先给你个好消息：你的灵根，**根本没废**。」\n\n你瞳孔骤缩，呼吸都停了一瞬。\n\n#梧老#「三年前那晚，有人用「抽灵血祭」之术，把你的五行灵根**换**成了另一种东西——一种连老夫都要咂舌的上古灵根。只是那东西一直沉睡着，寻常功法唤不醒它。」\n\n~上古灵根……换？~ 你声音发干，喉头滚动：「是谁做的？」\n\n#梧老#「问得好，老夫也想知道。但现在的你，就算知道真相，也是死路一条。」老脸咧嘴一笑，「所以——**拜师吧，小子。**」\n\n镜光一闪，一段玄奥的口诀涌入你脑海：《苍梧引气诀》——引气入体，以雷为媒，唤醒沉睡的灵根。口诀共九层，每层都像一把钥匙，咔哒一声，打开一扇门。\n\n#梧老#「练成了，你就是这苍梧界头一号「废柴」——能把那些踩过你脸的人，一个个踩回去的那种。」\n\n~废柴。~ 你在心里默念这两个字，忽然觉得，也没那么难听。\n\n烛火在风里晃了晃，镜面上的老脸打了个哈欠：「行了，今日先到这儿。明日开始，老夫教你引气。记住了——**这世上能靠得住的，只有你自己手里的剑。**」\n\n窗外风声依旧，你握着铜镜的手，第一次不抖了。\n\n你把它放进怀里，贴着心口。镜面冰凉，却像揣着一团小小的火。',

  text:
'接下来的三天，你白天赶路、夜里打坐，把那晚梧老教的口诀一遍遍在经脉里运转——第一缕气感来得比想象中快。三日后，青州官道。\n\n正是秋高气爽的时节，官道两旁的白桦林叶子黄了大半，风一吹，簌簌地往下落，落在行人的肩上、驴车的板沿上，又被扬起的尘土盖住。\n\n玄清宗三年一度的收徒大会在即，通往青云山的官道上一眼望不到头：有骑马佩剑的世家公子，有背着药篓的乡野少年，还有牵着一头瘦驴、驮着半扇猪肉的猎户——人人脸上都写着同一个念头：仙缘。\n\n你背着包袱，混在人流里。怀里揣着父亲塞的路引——沈家在玄清宗还有几分薄面，路引上盖着家主的印，纸张被摩挲得起了毛边。\n\n~灵根的事，你没有告诉任何人。~ 梧老说，在你筑基之前，这件事越少人知道越好。\n\n前方官道忽然喧哗起来，行人纷纷避让。\n\n一个铁塔般的黑脸汉子正与一伙山匪缠斗，以一敌七，虎虎生风。他刀法大开大合，刀刀劈向要害，嘴里还骂骂咧咧，中气十足：\n\n@邢烈@「直娘贼！连爷爷的干粮也敢抢？今天不把你们揍出屎来，爷爷跟你们姓！」\n\n山匪头子狞笑：「狂徒！兄弟们一起上，剁了他！」\n\n那汉子左支右绌，肩膀被划了一刀，血染了半片衣襟，眼看要吃亏。\n\n你怀中的苍梧镜微微一烫。\n\n#梧老#「唔，那小子根骨不错，刀法有几分真章，是个可交之人。你看着办。」\n\n你站在原地，看着那汉子被七个山匪围在中间，刀光里夹杂着血珠。他左肩已经挨了一刀，却一步不退，刀刀拼命。\n\n~帮，还是不帮？~\n\n你捏了捏怀里那张盖着家主印的路引。三年前，你也是这样站在人群外，看着父亲被人当街折辱——那一次，没有人站出来。\n\n风从官道上掠过，卷起几片枯叶。你听见自己的心跳，一下，又一下。',

'恶斗半柱香，山匪作鸟兽散，连滚带爬地消失在林子里，扔下一地刀枪、两双破鞋、还有半袋抢来的干粮。\n\n黑脸汉子把刀往肩上一扛，袖口还在往下滴血，却咧开大嘴，露出一口白牙，冲你竖了个大拇指：\n\n@邢烈@「好小子！有几分本事！在下邢烈，青州散修一个。今日这份情，爷爷记下了！」\n\n你收剑入鞘，拱手：「{name}。」\n\n@邢烈@「{name}……咦，这名字耳熟。」他歪着头想了想，忽然一拍大腿，「三年前临江城那个天灵根？啧，可惜了。不过——」他上下打量你，目光在你握剑的手上停了停，忽然大笑，一巴掌拍在你肩上，拍得你一个趔趄，「能跟爷爷并肩砍人的，管他什么灵根！走，前面苍梧城喝一盅，我请你！爷爷请客，绝不赖账！」\n\n你正要答话，前方忽然传来一阵喝骂，还夹着鞭子抽在皮肉上的脆响——一声比一声狠。\n\n官道边，一个锦衣华服的年轻修士正用鞭子抽打一个卖糖葫芦的老汉，只因老汉的摊子"挡了他的道"。老汉蜷在地上，护着头，肩头的衣衫已经被抽裂了，渗出血来。\n\n@陈玄@「老东西，滚开！本公子赶着去玄清宗报名，耽误了时辰，你赔得起？」\n\n老汉吓得跪地求饶，额头磕在青石板上，咚咚作响：「大爷饶命！老汉这就收摊……这就收……」\n\n锦衣修士却抬手又是一鞭，鞭梢卷着风，"啪"地抽在老汉背上。\n\n邢烈眼中凶光一闪，手按刀柄，一字一句：「嘿，爷爷最看不惯这种货色。」',

/* ================= 第四幕 · 青云会武 ================= */
S.v1n_04 = {
  id: 'v1n_04', chapter: '卷一 · 第三幕 · 青云会武', title: '青云会武',
  location: 'loc_xuanqing',
  text:
'晨光初破，你终于站在了青云山下。\n\n**青云山，玄清宗。**\n\n山门高耸入云，九十九级青石阶上覆着薄薄的晨露，被初升的日头照得亮晶晶的。山门两侧古松参天，松涛声里混着隐隐的钟鸣——这就是青州第一宗门的气象。\n\n广场上人山人海，无数少年男女排成长龙，等候测灵。有人紧张得攥拳，有人兴奋得垫脚张望，空气里弥漫着汗味、脂粉味和灵药的清香，混成一股独属于"仙缘"的味道。\n\n你排在队伍中。邢烈抱着胳膊，看什么都新鲜，一会儿戳戳人家的测灵牌，一会儿仰头数山门上的匾额笔画。\n\n测灵台上，一块丈许高的测灵石泛着温润的微光。执事长老声音古井无波，依次报出结果：\n\n「木土双灵根，中品。」\n「水灵根，下品。」\n「金火双灵根，上品！」\n\n每报出一个上品，人群里就传来一阵艳羡的骚动。\n\n轮到你了。\n\n你走上前，将手按上测灵石。石面冰凉，掌心传来一阵细微的嗡鸣。你闭眼，耳边响起梧老的嘀咕：\n\n#梧老#「放松，让那东西自己醒。」\n\n**轰——！**\n\n测灵石骤然亮起刺目雷光！紫电在石面游走，噼啪作响，连石台上方的云气都被绞成一团漩涡！整座广场的气流都为之一滞，有人被气浪推得踉跄后退。\n\n执事长老霍然起身，手里的名册"啪"地掉在地上，声音发颤：\n\n「雷……雷灵根？！**变异灵根——**」\n\n全场死寂。随即，哗然炸开。\n\n无数目光落在你身上——有惊疑、有艳羡、有嫉妒，还有几道几乎要杀人的目光。队伍前方，一身锦衣的陈玄脸色铁青，死死盯着你，握鞭的手背青筋暴起。\n\n~三年前，我是天灵根。三年后，我是雷灵根。~ 你无声地弯了弯嘴角。\n\n~这还只是开始。~\n\n一个娇俏的少女不知何时挤到你身边，杏眼弯弯，好奇地戳了戳你的袖子，指尖带着一点桂花糖的甜香：\n\n@苏小满@「师兄师兄！你好厉害！我叫苏小满，外门的！你叫什么呀？」',
  textVariants: [
    { cond:{ flag:'taunt_chenxuan' }, text:'~你朝陈玄的方向微微颔首，像是在说"好久不见"。~ 他的脸，绿了。' },
    { cond:{ flag:'skip_xinglie' }, text:'~没有邢烈在旁，你独自一人穿过人群。~ 一道目光追着你——队伍另一头，陈玄眯起了眼。' },
    { cond: function(s){ return s.flags.origin === 'poor'; }, text:'你一身粗布衣裳，站在一群锦衣少年中间，显得格格不入。可当测灵石亮起雷光的那一刻，全场安静得能听见松针落地。执事长老打量你良久，叹道：「寒门出贵子，不易。」' },
    { cond: function(s){ return s.flags.origin === 'demon'; }, text:'你低着头混在人群里，心跳如鼓——直到雷光亮起，全场哗然。几道探究的目光落在你身上，你垂着眼，握紧怀中碎镜。~越是显眼，越安全。~' },
    { cond: function(s){ return s.flags.origin === 'merchant'; }, text:'慕容烈瞪大眼睛看着测灵石上的雷光，脸色精彩至极。你慢悠悠冲他拱了拱手：「承让承让。看来明日那声"大哥"，你是叫定了。」' }
  ],
  choices: [

    { text:'点头致意，大步走向测灵台（先办正事）。', effects:{ temper:{ gongli:1 }, rel:{ xiaoman:3 }, flags:{ meet_xiaoman:true } }, goto:'v1n_04b' },
    { text:'扫了陈玄一眼，冲他勾了勾嘴角（无声宣战）。', effects:{ temper:{ henla:1 }, rel:{ chenxuan:-5, xiaoman:3 }, flags:{ meet_xiaoman:true, taunt_chenxuan:true } }, goto:'v1n_04b' }

  id: 'v1n_05', chapter: '卷一 · 少年意气 · 第五幕', title: '择师',
  location: 'loc_xuanqing',
  text:
'内门，青石大殿。\n\n大殿穹顶极高，梁柱粗得一人环抱不过来，上面刻满繁复的符文，在幽暗中隐隐泛光。殿中香炉青烟袅袅，一股淡淡的檀香混着陈年铁器的气味——那是大殿里挂着的历代祖师佩剑散发的。\n\n几位长老分坐两侧，目光各异地看着你。当中一位白衣剑修，眉目清冷，气度如霜，正是名震青州的柳长风长老——他手边搁着一柄连鞘长剑，剑未出鞘，你却莫名觉得后背发凉。\n\n执事长老展开名册，声音在空旷的大殿里回荡：「{name}，雷灵根，上上品。按规矩，可自择一师。」\n\n他一一介绍：剑道柳长风、丹道孙伯符、符道林清音、体修洪烈。\n\n孙伯符是个圆脸胖老头，笑眯眯地捋着胡须，闻到药材味儿就眯眼；林清音一袭素衣，指尖悬着一道未完成的符箓，笔走龙蛇；洪烈端坐如铁塔，蒲扇似的大手搁在膝上，压得座椅吱呀作响。\n\n你感觉到怀中的苍梧镜微微一热。\n\n#梧老#「剑道堂皇，丹道生财，符道灵动，体修皮糙肉厚。小子，选哪条，看你自己——不过老夫私心说一句：**剑者，心也。**」\n\n穿堂风拂过殿内的烛火，光影在你脸上明明灭灭。你听见自己的心跳，一下，又一下。\n\n~这一拜下去，往后数年，道途便定了。~\n\n~柳长风的剑、孙伯符的丹、林清音的符、洪烈的肉身——哪一条，才是我的道？~',

    { text:'拜入孙伯符门下，修《丹经要略》（丹道）。', effects:{ skills:{ add:['danjing'] }, rel:{ sun_bo:10 }, flags:{ teacher:2 } }, goto:'v1n_05a' },
    { text:'拜入林清音门下，修《太清符箓》（符道）。', effects:{ skills:{ add:['fulu'] }, rel:{ lin_qingyin:10 }, flags:{ teacher:3 } }, goto:'v1n_05a' },
    { text:'拜入洪烈门下，修《淬体真诀》（体修）。', effects:{ skills:{ add:['tixiu'] }, rel:{ hong_lie:10 }, flags:{ teacher:4 } }, goto:'v1n_05a' }
  ]

    { cond: function(s){ return s.flags.teacher === 1; }, text:'你上前三步，在柳长风面前站定，郑重一拜：\n\n@你@「弟子{name}，愿随师父修剑。」\n\n柳长风看着你，没有立刻说话。他手边的剑"铮"地轻响了一声，像是在回应什么。半晌，他开口，声线清冷：「剑道一途，苦寒且长。你既选了，便不许回头。」\n\n他抬手，一柄青锋剑凭空出现，落在你面前：「此剑名「青锋」。三年后，你若能持它斩断自己的心结，便算出师。」\n\n你握住剑柄，入手微凉，剑身却在你掌心轻轻一颤，像是认了主。\n\n拜师礼毕，柳长风负手走在前头：「随我来——先去看看你的剑冢。」' },
    { cond: function(s){ return s.flags.teacher === 2; }, text:'你上前三步，在孙伯符面前站定，郑重一拜：\n\n@你@「弟子{name}，愿随师父习丹。」\n\n孙伯符眯着眼打量你，捋着胡须笑了：「丹道养人，也耗人。小子，你可想好了？炼丹炼到三更半夜、废寝忘食，可不是享福的差事。」\n\n话是这么说，他还是从怀里掏出一本泛黄的册子塞给你：「拿着，《百草录》，先背熟再说。丹道入门，先认药，后认火。」\n\n你翻开册子，墨香混着药香扑面而来。孙伯符背着手，慢悠悠地往丹房走：「走，先带你认认我的药园——记住了，园里的灵草，一根都不许乱碰！」' },
    { cond: function(s){ return s.flags.teacher === 3; }, text:'你上前三步，在林清音面前站定，郑重一拜：\n\n@你@「弟子{name}，愿随师父习符。」\n\n林清音抬眼看了你一眼，指尖那道未完成的符箓缓缓散去：「符道，修的是笔力，更是定力。你选这条路，就要耐得住寂寞。」\n\n她递给你一支狼毫笔：「这支笔，跟着我画了十年符。送你了——画歪了，可别怪我没提醒。」\n\n你接过笔，笔杆温润，笔尖的毫毛被朱砂染成暗红。林清音转身，衣袂带风：「随我来。符堂的规矩，第一条：笔不离手。」' },
    { cond: function(s){ return s.flags.teacher === 4; }, text:'你上前三步，在洪烈面前站定，郑重一拜：\n\n@你@「弟子{name}，愿随师父淬体。」\n\n洪烈咧开嘴，蒲扇大的手掌拍在你肩上，差点把你拍个趔趄：「好小子，有眼光！什么灵根、什么功法，都不如一副好皮囊来得实在！」\n\n他从背后拎起一口半人高的石锁，往地上一墩，尘土飞扬：「先试试这个——举起来，绕着演武场走三圈。走完了，你就是我洪烈的徒弟！」\n\n你二话不说，弯腰去抱石锁。洪烈抱着胳膊看你，眼里带着一丝"看你能撑多久"的兴致。' }

  location: 'loc_xuanqing',
  text:
'拜师礼成，你正式成为玄清宗内门弟子，搬进了半山腰的独院。\n\n独院不大，一床一桌一椅，推开窗能看到漫山竹海，风过时沙沙作响，像海潮。晨光从窗棂漏进来，落在青石地面上，照出一格一格的光影。\n\n第二日清晨，你还没醒透，就被同门拽着去听第一课。\n\n拽你的黑脸汉子人如其名——石磊，洪烈长老门下，铁塔似的身板，说话像敲钟，嗓门大得能把屋檐上的麻雀震下来：\n\n@石磊@「沈师弟！走，上课去！迟了师父要骂人的！」\n\n旁边一个瘦猴似的少年凑过来，挤眉弄眼，动作活像只成了精的松鼠：「我叫林小乙，外门的，消息灵通——你听说了吗，咱们这一届，就你一个变异灵根！还有，那个陈玄，中州陈家来的，花钱买的资格，可记仇了！你小心点！」\n\n一个圆滚滚的胖子从后面挤进来，手里捏着几枚灵石，擦得锃亮：「钱多多。师弟，买消息不？十块灵石一条，包打听，童叟无欺！」\n\n石磊一巴掌拍在钱多多脑袋上，把他拍得一个趔趄：「滚！别教坏我师弟！」\n\n三人打打闹闹，一路把你拥进讲堂。\n\n山路上，晨雾还没散尽。远远能看见练武场里有人已经练上了——一个白衣师姐剑光如练，一个体修汉子在扛石锁，呼喝声隔着半个山头都听得见。晨钟"嗡"地响了一声，惊起林间一片飞鸟。\n\n讲堂里已坐满了人，晨光透过高窗，照见浮尘在光柱里缓缓打转。新入门的弟子们三三两两地交头接耳，有人兴奋地比划着测灵台上的事，有人偷偷打量你。\n\n你按例选了座，把佩剑搁在膝上，背挺得笔直。\n\n怀里的苍梧镜微微一震：\n\n#梧老#「哼，乌烟瘴气的。小子，记住——修行是自己的事，热闹是别人的。别被这些迷了眼。」',
  textVariants: [
    { cond: function(s){ return s.flags.teacher === 1; }, text:'柳长风负手立于堂前，目光扫过众人，最后落在你身上：「剑者，心也。心不正，剑不诚。」他随手一指，一缕剑气在虚空中划出一道笔直的银线，「今日讲剑意。」' },
    { cond: function(s){ return s.flags.teacher === 2; }, text:'孙伯符笑眯眯地摆开一排草药：「今日讲药性。百灵草，性平，和百药——但记住了，药性如人性，看着温和的，未必不伤人。」' },
    { cond: function(s){ return s.flags.teacher === 3; }, text:'林清音冷冷道：「符者，天地之文。一笔错，万法空。」她指尖悬空画了一道符，符光一闪而逝，「今日讲笔力。」' },
    { cond: function(s){ return s.flags.teacher === 4; }, text:'洪烈拍了拍自己的胸膛，声若洪钟：「体修之道，以身为炉！什么灵根、什么功法，都比不上这副皮囊硬！今日先跑一百圈！」' }
  ],
  choices: [
    { text:'正襟危坐，一字不落地记下师父讲的每一个字。', effects:{ temper:{ gongli:1 }, stats:{ wuxing:1 }, rel:{ shilei:3, lin_xiaoji:2, qian_duoduo:2 } }, goto:'v1n_07b' },
    { text:'一边听课，一边暗暗运转《苍梧引气诀》试探雷灵力。', effects:{ temper:{ henla:1 }, stats:{ xiwei:60 }, flags:{ sneak_cultivate:true } }, goto:'v1n_07b' },
    { text:'先与石磊、林小乙、钱多多打成一片，课后一起去膳堂。', effects:{ temper:{ xiayi:1 }, rel:{ shilei:6, lin_xiaoji:5, qian_duoduo:5 }, flags:{ make_friends:true } }, goto:'v1n_07b' }
  ]
};

  location: 'loc_xuanqing',
  text:
'午饭后的练功场，秋阳正好，晒得人身上发暖。你正对着木桩熟悉剑招，剑锋在阳光下划出一道道清亮的光弧——\n\n忽然，背后一股大力撞来，你一个趔趄，剑尖"叮"地磕在地上。\n\n你稳住身形回头，只见陈玄抱臂而立，嘴角噙着笑。他今日换了身簇新的锦衣，腰间挂着一枚羊脂玉佩，身后还跟着一个獐头鼠目的锦衣青年——慕容家旁支的慕容烈。\n\n@慕容烈@「哟，这不是那个被退婚的废物吗？听说你灵根又「回来」了？啧，不会又是测灵石出了毛病吧？」\n\n陈玄慢悠悠地补刀，声音不高不低，恰好让练功场里的人都听见：「慕容兄，慎言。人家现在可是「变异雷灵根」，上上品——万一明天又「废」了呢？」\n\n练功场的弟子们纷纷停下动作，有人凑过来，有人远远围观，交头接耳，幸灾乐祸的目光在你身上打转。秋阳还暖，空气却仿佛冷了几分。\n\n你攥紧剑柄，指节发白。\n\n~三年前，也是这样的午后。测灵台上金光散尽的那一刻，满场的目光也是这样落在我身上——惊疑、怜悯、幸灾乐祸。~\n\n~三年了。这目光，我见过太多了。~\n\n怀中的苍梧镜烫得发手，梧老的声音带着一股子看戏的兴致：\n\n#梧老#「两个跳梁小丑。不过小子，老夫提醒你一句——**这练功场上，动手就要立规矩。要么不打，要打，就打到他这辈子都记得你。**」',
  textVariants: [
    { cond:{ flag:'make_friends' }, text:'石磊第一个窜过来，挡在你身前，瓮声瓮气：「干什么干什么！欺负我师弟？」林小乙躲在石磊身后探出半个头：「就……就是！」钱多多不知何时溜到了人群里，开始悄咪咪兜售"独家消息"。' }
  ],
  choices: [

    { text:'缓缓拔出剑，指向慕容烈：「想立规矩？来，我陪你练练。」', danger:true, effects:{ temper:{ xiayi:1 }, rel:{ chenxuan:-6, murong_lie:-10 } }, goto:'v1n_08b' },
    { text:'转身对练功场外拱手：「朱尘师兄，有人扰乱练功秩序，该当何罪？」', effects:{ temper:{ henla:1 }, rel:{ zhu_chen:6, chenxuan:-3 }, flags:{ call_zhu_chen:true } }, goto:'v1n_08a' }
  ]

  text:
'夜里，独院。\n\n月光透过窗纸洒进来，在地面上铺了一层银白，像一层薄霜。窗外竹海沙沙，风穿过院子，带着山间草木的清气，拂过案上那盏将熄的油灯，灯花轻轻跳了跳。\n\n你盘膝而坐，双手结印，《苍梧引气诀》运转三个周天。\n\n第一周天，灵气如涓涓细流，顺着经脉缓缓汇入丹田——你能清晰地"看见"它们在体内流淌，像一条温顺的溪流。\n\n第二周天，溪流渐成江河，灵气裹着细微的电光，冲刷着经脉壁。酥麻的感觉从骨髓深处泛起，像有无数只蚂蚁在啃噬，却又带着一种说不出的畅快。\n\n第三周天——丹田深处，那缕沉睡的上古灵根忽然轻轻一颤。你仿佛看见一条蛰伏的雷龙，在黑暗中翻了个身，鳞片上闪过一道电弧。\n\n额角沁出细汗，顺着下颌滑落，砸在青石地面上，洇开一个深色的圆点。可你却觉得前所未有的畅快——像蒙尘多年的刀，被人拭去了一层锈。\n\n梧老的声音难得带着几分正经，没有平日那股子吊儿郎当的劲儿：\n\n#梧老#「雷灵根，至刚至阳，最忌急躁，也最忌萎靡。修炼之法，因人而异——你选一条路，老夫给你把把关。」\n\n他顿了顿，又补了一句：「不过小子，修行如逆水行舟。今晚这三分进境，明日不练，就还回去了。」',

'修行渐入佳境，你体内的修为已蓄到瓶颈——只差临门一脚。梧老建议你下山逛逛，换些丹药材料，权当散心。\n\n苍梧城。\n\n城门洞开，人流如织。挑着灵材担子的药农、牵着灵兽车的商贩、腰间挂剑的散修、抱着药箱的医女——各色人等摩肩接踵，叫卖声、讨价还价声混成一片。城墙上贴着万宝阁的招贴，墨迹还新。\n\n万宝阁，三层高楼，飞檐翘角，檐下金漆招牌在日光下闪闪发亮。推开雕花木门，一股灵药与檀木混合的香气扑面而来，货架上摆满了玉瓶、锦盒、灵剑，看得人眼花缭乱。柜台前围着一圈人，有人捧着灵石，有人拿着药方，吵吵嚷嚷。\n\n三楼雅间，一个杏黄罗裙的少女正百无聊赖地拨弄着算盘，珠子拨得噼啪响。见你进来，她眼睛一亮，放下算盘，撑着脸打量你：\n\n@云裳@「哟，新面孔！内门弟子？来买东西还是卖东西？——先说好，本小姐这儿不赊账，看人下菜，童叟无欺！」\n\n她自称云裳，万宝阁大小姐。说话时杏眼弯弯，三句话不离生意，可那股子机灵劲儿，却莫名让人觉得亲近——像只拨拉算盘的狐狸，精明，但不讨厌。\n\n楼下忽然传来一阵喧哗。\n\n陈玄正带着慕容烈在柜台前耀武扬威，指着一株百年灵芝，嗓门大得整个一层楼都听得见：「本公子出两百灵石！谁跟本公子抢？」\n\n柜台后，白芷一袭白衣，静静守着丹铺。她正在给一枚丹药封蜡，闻言眉头微蹙，却没抬头——像是懒得理会这种人。药香在她身周淡淡氤氲，衬得那张素净的脸格外安宁。',

'回到宗门，外门执事的木牌前围了一圈人，里三层外三层。\n\n木牌上墨迹未干，字迹粗犷：\n\n~「青云山外围青岩狼群泛滥，袭击采药弟子。猎杀青岩狼十头，赏灵石五十。可组队，生死自负。」~\n\n有人摇头：「青岩狼倒好说，就怕惹出狼王来。」有人跃跃欲试：「五十灵石！够买一瓶凝气丹了！」\n\n你正踌躇，身后忽然传来一阵熟悉的脚步声——刀鞘磕在青石板上，叮当作响，带着一股子肆意的劲儿。\n\n你回头，正是邢烈。他不知何时也混进了玄清宗的外门，一身的江湖气在宗门里格外扎眼，衣衫半敞，露出胸口的刀疤，咧着大嘴：\n\n@邢烈@「兄弟！听说你现在混得不错？走，陪哥哥干一票！狼皮剥了还能换酒钱！」\n\n他拍了拍腰间的酒葫芦，又补了一句：「上次苍梧城那顿酒还欠着，这回哥哥请你喝个够！」',
  textVariants: [
    { cond:{ flag:'skip_xinglie' }, text:'~你独自站在任务榜前，想起官道上那个绕道而行的午后。~ 若是当时出手，此刻或许能多个并肩之人。' },
    { cond: function(s){ return s.flags.help_xinglie || s.flags.wait_xinglie; }, text:'@邢烈@「兄弟，上次并肩砍人的情分哥哥记着呢！这次带上我！」' },
    { cond:{ flag:'price_fight' }, text:'~坊市那一手竞价，让陈玄彻底记恨上了你。~ 任务榜前，你注意到陈玄远远瞥了你一眼，眼神阴冷。' }
  ],
  choices: [

  ]
};

'寅时，天还没亮。\n\n青州乡下，三间茅屋缩在薄雾里，屋脊上覆着一层白霜。檐下挂着半串干辣椒，在风里轻轻晃，是这户人家仅剩的几分颜色。\n\n油灯如豆。你蹲在门槛上，把最后一捧干粮塞进包袱——那是你娘熬了三个通宵，用半袋陈米烙的饼，边角还烙糊了一块。饼很硬，硌手，可闻着香。\n\n屋里传来压低的咳嗽声，一声接一声，像老旧的纺车在夜半吱呀。\n\n你娘披着旧袄倚在门框上，袄子洗得发白，肩头磨出了毛边。她鬓角的白发在灯火里晃得刺眼，比去年又多了几根：\n\n@沈母@「儿啊，真要去？青云山那么远，咱家……连盘缠都是东拼西凑的。」\n\n她没说出口的话，你懂。三年前你爹进山采药，再没回来。村里人都说，是让妖兽叼了去；也有人说，是让修真的人随手碾死了——他们说话时压着嗓子，像怕隔墙有耳。\n\n你攥紧怀里那枚传家旧玉。玉身温温的，像还带着爹的体温。你爹临走前，蹲在门口看了你很久，最后只说了句：\n\n~「这玉，祖上传下来的。护身的。别弄丢了。」~\n\n那是他说的最后一句话。\n\n你站起身，把包袱甩上肩，冲她咧嘴一笑——笑得有点用力：\n\n「娘，等我成了仙人，接你去青云山住。那里的灵气，能治你的咳疾。」\n\n她别过脸，用袖子擦了擦眼角，又转回来，从怀里摸出一样东西塞给你：三枚铜钱，一枚磨得发亮的平安符。\n\n「路上……买个热汤喝。」她说。\n\n晨雾里，第一声鸡叫响起来了。你背起包袱，大步走进雾里，没敢回头。',

S.v1p_02 = {
  id: 'v1p_02', chapter: '卷一 · 少年意气 · 第二幕', title: '旧玉惊变',
  location: 'loc_linjiang',
  text:
'赶了三天路，你在青云山脚下一座破庙里歇脚。\n\n庙很破，山神像断了半个脑袋，供桌歪着，桌角结着蛛网，蛛网上还挂着一只干瘪的虫壳。檐外山风呜呜地灌进来，吹得香炉里的冷灰打着旋儿。\n\n你裹着单薄的衣衫，缩在供桌下避风，把旧玉攥在手心取暖。玉身温温的，像揣着一团小小的火——\n\n忽然，玉面泛起一层幽光！那光极淡，却照得你掌心的纹路纤毫毕现，烫得你差点脱手！\n\n一个苍老的声音在你脑海里炸开，中气十足，带着一股子"终于等到你"的得意：\n\n#梧老#「哎哟喂，可算醒了！小子，你可知你攥着的这块「旧玉」，是什么来头？」\n\n你惊得跳起来，后脑勺"咚"地撞上供桌：「谁？谁在说话？！」\n\n#梧老#「老夫梧老，寄居在这面……嗯，姑且叫它苍梧镜的碎片里。你爹——啧，或者你爹的爹，倒是捡了个天大的便宜，可惜不识货。」\n\n镜光里浮现一张模糊的老脸：白眉耷拉，高颧骨，嘴角噙着一抹欠揍的笑，正上上下下打量你，像打量一头会走路的宝贝。\n\n#梧老#「根骨尚可，悟性不错，就是穷了点。不过老夫困在此地多年，等的就是有缘人——**小子，拜师吧。**」\n\n不等你答应，一段玄奥口诀已涌入脑海：《苍梧引气诀》，引气入体，雷动九霄。口诀入脑的刹那，你体内仿佛有什么"咔"地响了一声——像一把生锈的锁，被钥匙轻轻拨动。\n\n#梧老#「练成它，你就有本钱去那青云山上，跟那些世家子弟争一争仙缘。到时候，老夫再教你几手，保管让他们哭爹喊娘。」',
  choices: [

    { text:'「前辈为何选我？这玉……真是我爹留给我的？」', effects:{ temper:{ gongli:1 }, rel:{ wulao:5 }, skills:{ add:['cangwu_yinqi'] }, flags:{ ask_jade:true } }, goto:'v1p_03' },

  ]

  text:

    { text:'不争辩，默默绕开他，排在队尾。~忍一时，是为了走得远。~', effects:{ temper:{ gongli:1 }, flags:{ endure_poor:true } }, goto:'v1p_04' },
    { text:'抬眼直直盯着他，一字一句：「今日你笑我穷酸，他日我让你高攀不起。」', effects:{ temper:{ henla:1 }, rel:{ murong_lie:-8 }, flags:{ swear_poor:true } }, goto:'v1p_04' }

  id: 'v1p_04', chapter: '卷一 · 少年意气 · 第三幕', title: '夜宿山门',
  location: 'loc_linjiang',
  text:
'入夜，报完名的少年们三三两两散去，明日在山门前测灵。\n\n你找了棵老松树，靠着树干坐下，就着凉水啃干粮。饼很硬，硌牙，你掰碎了泡进水里，一口一口咽下去。\n\n头顶星河低垂，星子亮得像要坠下来。山风里隐约传来钟声，一声，又一声——那是玄清宗晚课的钟，隔着一座山，仍震得人心头发颤。\n\n一个瘦猴似的少年凑过来，自来熟地递过一壶水：「兄弟，我叫林小乙，外门跑腿的！你也是来测灵的？我跟你说，明日那测灵石，可玄乎了——听说摸上去又凉又麻，测出灵根的人，石头会发光！」\n\n他压低声音，神秘兮兮：「我听说，三年前有个天灵根，测灵时整块石头金光大放，连山门上的钟都自己响了九下！」\n\n你接过水，道了声谢。远处，华服少年慕容烈正与几个同伙高声谈笑，笑声在夜色里格外刺耳。\n\n你低头，摩挲着那枚旧玉。玉身温热，像一颗跳动的心。\n\n~明日，就是见真章的时候了。~\n\n~爹，你在天上看着吗？~',
  choices: [
    { text:'闭目运转《苍梧引气诀》，一夜修行，静待天亮。', effects:{ stats:{ xiwei:60 }, flags:{ night_cultivate:true } }, goto:'v1n_04' },
    { text:'与林小乙攀谈，打听玄清宗的门道与测灵的规矩。', effects:{ rel:{ lin_xiaoji:6 }, stats:{ wuxing:1 }, flags:{ ask_lin_xiaoji:true } }, goto:'v1n_04' },
    { text:'独自走到崖边，望着山下万家灯火，一夜无眠。', effects:{ temper:{ henla:1 }, stats:{ xinjing:8 }, flags:{ night_alone:true } }, goto:'v1n_04' }
  ]
};

/* ================= 魔道遗孤出身 ================= */
S.v1d_01 = {
  id: 'v1d_01', chapter: '卷一 · 少年意气 · 第一幕', title: '雪夜遗孤',
  location: 'loc_linjiang',
  text:
'青州边陲，一间破败的山神庙。\n\n大雪封山，天地间白茫茫一片，只有这座庙还露着几片黑瓦。庙门缺了半扇，风裹着雪沫灌进来，在地面积成一层薄薄的雪毯。\n\n庙里生着一堆将熄的火，火光忽明忽暗，映得神像的影子在墙上张牙舞爪。\n\n一个身形佝偻的老人靠在墙边，身上裹着一条补了又补的旧棉被。他咳得撕心裂肺，喉间有呼噜呼噜的痰音，枯瘦的手却死死攥着你的手腕，力道大得不像一个将死之人。\n\n他把你养大，十六年，从没说过你的来历。可此刻他浑浊的眼睛里，有泪光，也有一种如释重负的平静：\n\n@养父@「孩子……听爹说，你本不姓……算了，来不及了。这个，拿好。」\n\n他把一枚碎了一半的铜镜塞进你手里。镜面斑驳，断口处却光滑如新——像是被人特意磨过。他又从怀里摸出一封染血的信，纸张早已发脆，血迹暗沉发黑：\n\n@养父@「这镜子，是你……是你亲爹娘留下的。这封信，等你筑基之后再看。记住——」他猛咳一阵，指节攥得发白，「**正魔两道，都在找你。别信任何人。隐姓埋名，活下去。**」\n\n他的声音越来越低，握着你的手，缓缓松开。\n\n窗外风雪呜咽，像在为谁送葬。\n\n你跪在雪地里，把那枚碎镜贴在胸口。镜面冰凉，可你分明感觉到，它在轻轻跳动——一下，又一下，像一颗藏在冰壳下的心脏。\n\n养父的眼睛还睁着，望着庙门的方向，仿佛在等什么人。你伸手，替他合上眼帘。',
  choices: [
    { text:'把养父葬在山神庙后，立誓：「此仇此恩，我必还报。」', effects:{ temper:{ henla:1 }, flags:{ swear_revenge:true } }, goto:'v1d_02' },
    { text:'跪在坟前磕了三个头，泣不成声：「爹，你还没告诉我，我叫什么……」', effects:{ temper:{ xiayi:1 }, rel:{ shen_mu:3 }, flags:{ mourn_father:true } }, goto:'v1d_02' },
    { text:'连夜翻出那封信，就着火光辨认字迹——字是血写的，落款处只有一个模糊的印记。', effects:{ temper:{ gongli:1 }, flags:{ read_letter:true } }, goto:'v1d_02' }
  ]
};

S.v1d_02 = {
  id: 'v1d_02', chapter: '卷一 · 少年意气 · 第二幕', title: '夜奔',
  location: 'loc_linjiang',
  text:
'当夜，三道黑影如鬼魅般掠入山神庙。\n\n为首者披着血纹黑袍，声音沙哑得像砂纸刮过铁皮：「那老东西死了？啧，慢了一步。搜！那件东西一定在他身上——那孩子，活要见人，死要见尸！」\n\n火堆被一脚踢散，火星四溅。你在庙后的枯井里，屏住呼吸，冻僵的手指死死抠着井壁。脚步声越来越近，井口投下一道黑影——\n\n忽然，你怀中的碎镜骤然亮起！一股无形的气浪轰然荡开，井口的积雪被震得簌簌而落！\n\n井外传来闷哼声，有人被震得倒飞出去，撞翻神像，哗啦啦一阵乱响。\n\n#梧老#「聒噪！大半夜的，还让不让人睡了？」\n\n黑袍人惊疑不定，声音都变了调：「宝、宝物护主？！走！」\n\n脚步声仓皇远去，很快消失在风雪里。\n\n你瘫坐井底，冷汗浸透了衣衫，呼出的白气在井壁结了一层霜。镜面上那张模糊的老脸似乎叹了口气：\n\n#梧老#「小子，你麻烦大了。那伙人是血魔宗的爪牙——他们找的东西，多半就是老夫这面镜子。」\n\n他顿了顿，语气里难得带上一丝认真：\n\n#梧老#「不过嘛……既然躲不过，不如杀回去。老夫困在此处多年，等的就是这口气。**《苍梧引气诀》**，想学吗？」\n\n雪夜里，井底很黑，可那枚碎镜的光，把方寸之地照得亮堂堂的。',
  choices: [
    { text:'「学！从今夜起，我不要再逃。」', effects:{ temper:{ henla:1 }, rel:{ wulao:12 }, skills:{ add:['cangwu_yinqi'] }, flags:{ learn_demon:true } }, goto:'v1d_03' },
    { text:'「前辈救我一命，大恩不言谢。只是……我究竟是谁？」', effects:{ temper:{ gongli:1 }, rel:{ wulao:6 }, skills:{ add:['cangwu_yinqi'] }, flags:{ ask_who:true } }, goto:'v1d_03' },
    { text:'沉默着握紧碎镜，在雪地里练了一夜引气诀。', effects:{ temper:{ xiayi:1 }, rel:{ wulao:8 }, skills:{ add:['cangwu_yinqi'] }, stats:{ xiwei:40 }, flags:{ train_demon:true } }, goto:'v1d_03' }
  ]
};

S.v1d_03 = {
  id: 'v1d_03', chapter: '卷一 · 少年意气 · 第三幕', title: '隐姓埋名',
  location: 'loc_linjiang',
  text:
'你一路向北，混进逃荒的流民里，改名换姓——从今往后，你叫{name}，一个无父无母、来历干净的孤儿。\n\n流民队伍很长，有抱着孩子的妇人，有推着独轮车的老人，人人脸上都是尘土与疲惫。你走在队伍里，低着头，跟着人群一步一步挪向苍梧城。\n\n城门口，你听说青云山玄清宗正在收徒，三年一次，不限出身。\n\n~光明正大地拜入名门正派，藏身于最显眼处——这大概是最安全的躲法。~\n\n你在城门口的小摊上买干粮，摊主是个眯眼的老头，找零时多看了你一眼：「小兄弟，外地来的？青云山收徒，可热闹了。」\n\n你正要答话，忽然察觉一道目光。\n\n不远处，一个紫衣少女斜倚着城墙，眉眼慵懒，正似笑非笑地看着你。她腰间悬着一枚血色铃铛，风一吹，叮当作响——那声音清脆，却莫名让人脊背发凉。\n\n她没有说话，只是看了你一眼，像在确认什么，随即转身没入人流。\n\n你莫名觉得后背发凉——那眼神，像是在看一件早就知道底细的物什。\n\n#梧老#「……那丫头，不简单。血魔宗的人。小子，她好像认得你。」',
  choices: [
    { text:'若无其事地买完干粮，混入人流消失——记住那张脸。', effects:{ temper:{ gongli:1 }, rel:{ liuli:3 }, flags:{ note_liuli:true } }, goto:'v1d_04' },
    { text:'悄悄跟上去，想探清她的虚实。', danger:true, effects:{ temper:{ henla:1 }, rel:{ liuli:6 }, flags:{ follow_liuli:true } }, goto:'v1d_04' },
    { text:'低头快步离开，直奔青云山。~离是非越远越好。~', effects:{ temper:{ xiayi:1 }, flags:{ flee_liuli:true } }, goto:'v1d_04' }
  ]
};

  text:
'青云山门高耸入云，九十九级青石阶在晨光里泛着水光。山门两侧古松参天，松涛声里混着隐隐的钟鸣，一声一声，敲在人心上。\n\n你排在长长的队伍里，一身粗布衣裳，毫不起眼——正如你所愿。\n\n旁边一个锦衣少年正大声吹嘘家世：「我爹说了，只要测出灵根，天材地宝管够！」引来阵阵艳羡。你垂着眼，握紧怀中碎镜。\n\n#梧老#「放心，老夫替你压着气息，那测灵石测不出你真正的根脚。不过——」他顿了顿，语气难得正经，「一旦踏上这山门，你就再也不是那个躲躲藏藏的孤儿了。想好了？」\n\n你抬头，望向云雾缭绕的山巅。阳光破开云层，洒在九十九级石阶上，亮得刺眼。\n\n~想好了。~\n\n~从今天起，我要光明正大地，活在这苍梧界。~\n\n~也让那些追杀我的人，亲眼看看——我到底是谁。~',
  choices: [

    { text:'握紧碎镜：「梧老，从今往后，你我并肩。」', effects:{ rel:{ wulao:6 }, flags:{ vow_wulao:true } }, goto:'v1n_04' }

/* ================= 商贾之子出身 ================= */

  text:
'临江城，万金商会。\n\n这是青州最大的商号，门脸三进三出，朱漆大门上钉着黄铜门钉，门前两只石狮子威风凛凛。可你知道，这排场在修真者眼里，什么都不是。\n\n你是万家独子，打小在账房和灵石堆里长大。你爹常说，有钱能使鬼推磨——可你三年前亲眼见过，你爹被一个筑基修士当街扇了一巴掌，只因为"挡了仙人的路"。\n\n那一巴掌，你记到今天。你爹的右脸颊上，到现在还有一道淡淡的印子。\n\n今日，你站在商会门口，身后是十二个护院、三辆装灵石的马车，还有你爹红肿着眼眶塞给你的一句话：\n\n@万金@「儿啊，爹这辈子就这样了。你带着这些灵石去青云山，砸也给我砸出个前程来！灵石没了可以再挣，爹就你一个儿子——」\n\n话音未落，一匹枣红骏马直冲而来，马蹄踏得石板路"嗒嗒"作响！马上一个锦衣青年扬鞭呵斥：「滚开！好狗不挡道！」\n\n鞭梢卷着劲风，直抽向你面门——\n\n护院们惊叫着扑来，却慢了一步。阳光下，鞭影在你瞳孔里越放越大。',

    { text:'侧身避开，冷冷道：「万家商队，拦路的另有其人——你最好想清楚。」', effects:{ temper:{ xiayi:1 }, rel:{ murong_lie:-5 }, flags:{ stand_merchant:true } }, goto:'v1m_02' },

S.v1m_04 = {
  id: 'v1m_04', chapter: '卷一 · 少年意气 · 第三幕', title: '有钱的烦恼',
  location: 'loc_linjiang',
  text:
'青云山脚下，你雇的脚夫帮你挑着两箱行礼——里面除了灵石，还有你娘塞的几件冬衣、你爹的账本，以及一坛陈年好酒。\n\n测灵报名的队伍排成长龙，从山门一直排到官道上。你刚站定，身后就传来嗤笑：\n\n@慕容烈@「呵，又来个土财主！以为背着两箱灵石就能修仙？笑死人了，灵根那玩意儿，是钱能买来的吗？」\n\n他身边的华服少年们哄笑成一片，声音大得引来过路人的侧目。\n\n你却不恼，反而笑眯眯地拱手，声音不高不低，恰好让周围人都听见：\n\n「这位兄台说得对，灵根确实买不来。不过——」你慢悠悠地拍了拍箱子，故意拖长了调子，「万一我的灵根，比兄台的好呢？那多尴尬。」\n\n慕容烈脸色一僵，笑容凝固在脸上。\n\n#梧老#「哈哈哈！好小子，有你爹当年做生意的风范！老夫忽然觉得，跟着你，不亏！」',
  choices: [
    { text:'不与他纠缠，踱到队尾排队——明日的测灵台上，自会见真章。', effects:{ temper:{ gongli:1 }, rel:{ murong_lie:-4 }, flags:{ calm_merchant:true } }, goto:'v1n_04' },
    { text:'「兄台若是不服，不如打个赌：明日我灵根若比你强，你当众叫我一声大哥。」', effects:{ temper:{ henla:1 }, rel:{ murong_lie:-8 }, flags:{ bet_murong:true } }, goto:'v1n_04' },
    { text:'转头对脚夫道：「把酒送到山门前，明晚请诸位同门喝一杯。」', effects:{ temper:{ xiayi:1 }, rel:{ lin_xiaoji:4 }, flags:{ treat_wine:true } }, goto:'v1n_04' }
  ]
};

/* ================= 第八幕 · 青云秘境 ================= */
S.v1n_13 = {
  id: 'v1n_13', chapter: '卷一 · 少年意气 · 第八幕', title: '秘境召集',
  location: 'loc_xuanqing',
  text:
'三月转瞬即过。\n\n这三个月里，你在玄清宗站稳了脚跟。晨钟暮鼓，修炼不辍——雷灵根的天赋让你进境一日千里，体内的雷灵力日渐充盈，隐隐有了"满溢"的迹象。梧老偶尔指点两句，大多时候在镜子里打盹，偶尔冒出一句毒舌，把你刚升起的一点得意浇得透心凉。\n\n这一日清晨，宗门钟声九响，一声比一声急促——**青云秘境，三日后开启！**\n\n青云秘境三年一开，是青州最大的机缘之地。内藏灵药、妖兽、前人遗泽，也藏着要命的凶险。消息一出，各峰弟子纷纷奔走组队：有人急着凑人头，有人忙着翻秘境图册，连膳堂里的饭都扒得比平时快了三倍。整个宗门都躁动起来。\n\n你刚走出讲堂，就被一道身影拦住了。\n\n苏小满踮着脚，杏眼亮晶晶，像揣着两只小灯笼：\n\n@苏小满@「师兄师兄！带我一起进秘境好不好？我保证不拖后腿！我还带了糖葫芦，路上分你一半！」\n\n她说着，还真从袖子里摸出一串糖葫芦，红艳艳的，在晨光里泛着糖光。她另一只手背在身后，隐约还攥着什么东西，却没有拿出来。\n\n不远处，邢烈扛着刀靠在廊柱上，咧着嘴冲你扬了扬下巴——那意思不言自明：兄弟，组队算我一个。温如玉则站在檐下，微笑不语，手里转着一枚黑玉棋子，指尖泛着温润的光。\n\n~这秘境，看来是场大热闹。~',
  textVariants: [
    { cond: function(s){ return s.rel.xiaoman >= 15; }, text:'~她拉着你的袖子晃啊晃，像只撒娇的小雀。~ 你想起入宗第一天她挤到你身边的样子，心里一软。' },
    { cond:{ flag:'phase_secret' }, text:'~这三个月，你暗中查那玉简的线索，只查到一句模糊的话：九渊之下，苍梧为钥。~ 或许秘境里，会有答案。' }
  ],
  choices: [
    { text:'「好，一起进。邢烈也来，咱们仨一个队。」', effects:{ rel:{ xiaoman:4, xinglie:3 }, flags:{ party_friends:true } }, goto:'v1n_13b' },
    { text:'走向温如玉：「温师兄，可愿同行？」', effects:{ rel:{ wenyu:6 }, flags:{ party_wenyu:true } }, goto:'v1n_13b' },
    { text:'婉拒众人，独自入秘境——机缘，自己拿。', effects:{ temper:{ henla:1 }, flags:{ party_solo:true } }, goto:'v1n_13b' }
  ]

  location: 'loc_mijing',
  text:
'秘境入口是一道悬在半空的裂痕，宽丈许，流光溢彩，像天地撕开的一道伤口，边缘的虚空在轻轻颤动。踏入的瞬间，天旋地转，耳边掠过一阵尖锐的风声——再站稳时，你已经落在一片浓雾笼罩的密林里。\n\n雾是活的，翻涌如潮，像有什么东西在雾里游动。视线不足三尺，脚下的腐叶踩上去"吱嘎"作响，空气中弥漫着草木腐烂的甜腥气，混着不知从哪儿飘来的一丝血腥。\n\n耳畔传来窸窣声——若有若无，忽左忽右，像有东西在绕着你们转圈。你凝神细听，只觉无数双幽绿的眼睛在雾中明灭，像鬼火，又像垂涎的兽瞳。\n\n怀中的苍梧镜微微发烫，梧老的声音压得很低：\n\n#梧老#「雾隐蛇。二阶妖兽，藏雾行凶，最爱偷袭落单的修士。小心脚下——它在你左后方三尺！」\n\n话音未落，一道黑影破雾而出！獠牙森然，寒光一闪，直取你咽喉！',
  textVariants: [

    { cond:{ flag:'party_wenyu' }, text:'温如玉指尖棋子一闪，淡淡道：「雾中行兽，喜热怕雷——沈师弟，正好是你的主场。」' }
  ],
  combat: {

    winGoto: 'v1n_14b', loseGoto: 'v1n_14b', maxRounds: 5, shengwang: 5,

S.v1n_15 = {
  id: 'v1n_15', chapter: '卷一 · 少年意气 · 第八幕', title: '灵药谷',
  location: 'loc_mijing',
  text:
'穿过雾林，眼前豁然开朗。\n\n这是一处灵气氤氲的山谷，草木蓊郁得像是要把天都染绿。溪水从石缝间渗出，潺潺流淌，水面上浮着几片不知名的花瓣，打着旋儿。几只灵蝶在花丛间翻飞，翅膀上泛着荧光。\n\n空气中浮着浓郁的灵药香气，谷底遍地灵草——百灵草、灵荒草、还有叫不出名字的紫色小花，在阳光下舒展着叶片，每一株都泛着淡淡的灵光，像铺了一地的星星。\n\n最中央，一株**百年灵芝**亭亭而立。菌盖如华盖，边缘泛着一圈金红色的光晕，药香浓郁得几乎凝成实质——光是闻一口，都觉得丹田微微发热。\n\n可灵芝旁，一头石甲龟正慢悠悠地打着盹。它比磨盘还大，甲壳上布满青苔与藤蔓，像一块活着的巨石。它的呼吸很慢，每吸一口气，甲壳便微微起伏一次，仿佛连带着整片山谷都跟着它一呼一吸。\n\n#梧老#「石甲龟，三阶妖兽，防御惊人。它守着那灵芝，少说百年了——硬碰硬，够你喝一壶的。」\n\n他顿了顿，语气里带上一丝狡黠：\n\n#梧老#「不过……嘿嘿，有些事，不一定非要硬碰硬。它睡得沉，你若能神不知鬼不觉地……那就另说了。」',
  choices: [
    { text:'硬抢！雷光轰向石甲龟。', danger:true, effects:{ flags:{ fight_turtle:true } }, goto:'v1n_15b' },
    { text:'智取：取出火灵符掷向远处，引开石甲龟再取灵芝。', cond:{ item:'huoyan_ling' }, effects:{ items:{ remove:{ huoyan_ling:1 } }, flags:{ trick_turtle:true } }, goto:'v1n_15c' },
    { text:'不贪这株灵芝，绕道前行。~秘境里，保命第一。~', effects:{ temper:{ gongli:1 }, flags:{ skip_herb:true } }, goto:'v1n_15d' }
  ]
};

  location: 'loc_mijing',
  text:
'灵池中央，灵气浓郁得几乎凝成实质，池水泛着乳白色的光，蒸腾的水汽沾在睫毛上，凉丝丝的。\n\n你盘膝坐下，服下那枚与苍梧镜同源的珠子。珠子入口即化，一股狂暴的灵气瞬间冲入经脉，如万马奔腾，疼得你额角青筋暴起——\n\n**筑基之机，就在此刻！**\n\n你运起《苍梧引气诀》，引着那股洪流冲刷经脉。可灵气冲入识海的刹那，幻象丛生——\n\n你看见了慕容雪冰冷的眼神，退婚书上的墨迹，满堂宾客的窃笑；\n你看见母亲佝偻的背影，干粮袋里的半块饼，她塞进你手里的三枚铜钱；\n你看见养父枯瘦的手，染血的信笺，雪夜里合上的眼帘；\n你看见父亲被当街扇落的那一巴掌，人群哄笑，无人回头……\n\n万般执念，化作重重魔影，从识海深处朝你扑来！它们长得像你认识的每一个人，说着你最怕听的话：\n\n「废物……」「你配吗……」「他们都在骗你……」「你谁也护不住……」\n\n那些声音贴着你的耳朵，钻进你的骨髓。你看见慕容雪签下退婚书时的冷笑，看见母亲在灯下咳得直不起腰，看见养父合上眼帘前还在望着庙门——你看见自己站在废墟里，怀里的人一个个离开，你伸出的手，什么也抓不住。\n\n梧老的声音从极远处传来，像隔着一万重山，却字字清晰：\n\n#梧老#「小子！守住本心！**一念成魔，一念成仙——这是你自己的劫，谁也替不了你！**」\n\n「但你要记住——」他的声音忽然软下来，带着一种从未有过的温柔，「不管你在幻象里看见了什么，那些都是假的。**你一路走来，从没真正失去过什么——除了你不敢面对的过去。**」',
  textVariants: [
    { cond:{ flag:'beat_qingjiao_wang' }, text:'~你掌心还残留着青蛟王的血，滚烫。~ 心魔的声音像极了那个黑袍人：「看看你这双手，沾了多少血？」' },
    { cond:{ flag:'wulao_sleep' }, text:'~梧老为你挡下青蛟王的临死一击，镜光黯淡，陷入沉睡。~ 这一次，心魔面前再无挡在你身前的人。' }
  ],
  choices: [
    { text:'直面心魔：「这些执念，都是我走过的路。我不悔。」', effects:{ temper:{ xiayi:1 }, stats:{ xinjing:20 }, setRealm:9, flags:{ xinmo_face:true } }, goto:'v1n_19' },
    { text:'以执念为剑：「退婚之辱、血亲之仇——我要的就是变强！」', effects:{ temper:{ henla:1 }, stats:{ atkBonus:2 }, setRealm:9, flags:{ xinmo_blade:true } }, goto:'v1n_19' },
    { text:'强行收摄心神，不愿去想那些痛处。', effects:{ temper:{ gongli:1 }, stats:{ xinjing:-15 }, setRealm:8, flags:{ xinmo_flee:true } }, goto:'v1n_19' }
  ]
};

  location: 'loc_xuanqing',
  text:
'秘境关闭的那一日，玄清宗山门前人山人海。\n\n晨雾还未散尽，山门前已经站满了人——有翘首以盼的弟子，有面色凝重的长老，还有偷偷溜出来的外门少年，踮着脚往秘境入口的方向张望。\n\n入口处的流光裂痕猛地一颤，随即缓缓闭合。你从光晕中走出——\n\n衣衫带血，发丝凌乱，衣角被撕开了一道口子，可你的气息，却深沉如渊。\n\n**筑基已成。**\n\n全场先是一静，随即哗然炸开！\n\n三年被废的废物，入宗三月，自秘境中踏筑基而出——这个名头，以风一样的速度传遍了整个青州，连苍梧城的茶楼里都在议论"沈家那个小子"。\n\n苏小满第一个冲过来，眼圈红红的，想拉你的手又不敢：「师、师兄……你受伤了没有？」\n\n邢烈扛着刀站在人群里，冲你龇牙一笑，比了个大拇指。\n\n执事长老亲自迎上来，目光灼灼，声音都变了调：「{name}！你……你当真在秘境里斩了青蛟王？」\n\n你点了点头。四周一片倒吸冷气的声音，有人看你的眼神，已经带上了敬畏。\n\n夜里，你独坐院中，翻出那枚残缺玉简。月光从窗棂漏进来，落在玉简上，你逐字辨认，指尖在冰冷的玉面上缓缓划过：\n\n~「苍梧仙帝，以身镇魔……九渊之下，封印将溃……苍梧为钥，血脉为引……」~\n\n你的手微微一颤。血脉为引……\n\n这四个字，像一根针，扎进你心里最深处。\n\n怀中的苍梧镜，轻轻跳动了一下，仿佛在回应你。',
  textVariants: [

    { cond:{ flag:'wulao_sleep' }, text:'~梧老还在沉睡。~ 你摩挲着黯淡的镜面，低声道：「前辈，你放心。下一回，换我护你。」' },
    { cond:{ flag:'xinmo_flee' }, text:'~强行突破的后遗症发作，你眼底血丝密布，心境不稳。~ 有些心结，逃得了一时，逃不了一世。' },
    { cond:{ flag:'party_wenyu' }, text:'~回程路上，温如玉一直沉默。~ 临别时他忽然说：「沈师弟，若有一天你发现身边人瞒着你什么……别急着恨。」说完便走了。~这话，让你心里打了个突。~' }
  ],
  choices: [

    { text:'连夜下山，把玉简拓印一份，托人送去万宝阁查证。', effects:{ temper:{ gongli:1 }, rel:{ yunshang:4 }, flags:{ verify_jade:true } }, goto:'v1n_19b' },
    { text:'盯着玉简上的"血脉为引"四个字，一夜未眠。', effects:{ temper:{ henla:1 }, flags:{ night_jade:true } }, goto:'v1n_19b' }

'第二轮，你抽到了**陈玄**。\n\n消息传开，看台上顿时议论纷纷——上届大比陈玄就败在你手里，如今再遇，是新仇旧恨一起算，还是你再度碾压？\n\n陈玄缓步登台。他面无表情，步伐却比从前更沉——只是眼底那抹诡异的红芒，比在秘境时更盛了，像两粒烧透的炭。\n\n他周身的气息起伏不定，忽强忽弱，像有什么东西在体内翻涌挣扎。离他近的弟子，都下意识往后退了一步。\n\n你眉头微皱。梧老的声音从镜中传来，罕见的凝重：\n\n#梧老#「不对劲。这小子体内的力量……是**控心丹**的痕迹。有人拿他做了棋子——下棋的人，就在这宗门里。」\n\n陈玄抬起头，嘴角咧开一个僵硬的笑，像是有人牵着他的嘴角：\n\n「{name}……有人让我……杀了你。」\n\n看台上，慕容烈站起来，攥着栏杆，一脸看好戏的狞笑；几位长老却变了脸色——他们也察觉到了那缕不该出现在擂台上的黑气。\n\n你望着陈玄眼底那两粒烧红的炭，忽然想起三年前测灵台下的自己。那时候，没有人看得出你被人动了手脚——就像现在，没有人看得出陈玄已经身不由己。\n\n~他不过是另一枚棋子。~\n\n~可棋子想杀人，也得先问过我这把剑。~\n\n话音未落，他拔剑而起，剑上黑气缭绕，气息暴涨！看台上有人失声惊呼。\n\n锣声未响，他竟已出手！',
  choices: [
    { text:'全力迎战，速战速决。', effects:{ flags:{ rush_chenxuan:true } }, goto:'v2_03b' },
    { text:'先以言语试探，激他露出破绽。', effects:{ temper:{ gongli:1 }, flags:{ probe_chenxuan:true } }, goto:'v2_03b' }
  ]
};

'回到宗门，你在灯下摊开那半张残图。\n\n烛火跳了跳，把残图的纹路照得明明灭灭。它残缺不全——可即便如此，你也能看出，图中画的是**北漠**：一条蜿蜒的虚线穿过冰原，绕过一片用朱砂点过的山，直直指向一片被墨色涂抹的区域。旁边只有两个字，笔迹潦草，像是写的人手在发抖：\n\n~九渊。~\n\n你指尖沿着那条虚线缓缓划过，忽然停住——虚线的尽头，画着一枚小小的印记，像是……一枚镜子。\n\n你正看得出神，怀中的苍梧镜忽然剧烈震动起来！镜面泛起一层又一层的光纹，像水面被投入石子。\n\n一道久违的声音在你脑海中炸开，虚弱却清晰：\n\n#梧老#「……小子……」\n\n你心头一震：「前辈！你醒了！」\n\n#梧老#「做了个很长的梦……梦见一柄剑，断了……梦见九渊下面……那个东西……它在动……」他顿了顿，声音发涩，「小子……你听着……**封印撑不了太久了。**」\n\n镜光明灭，他又昏沉过去，最后含糊地嘟囔了一句：\n\n#梧老#「……那枚印记……老夫好像……见过……」\n\n第二日，一封信送到你手上——沈家的家书，父亲的字迹，却只有短短一行，墨迹被水渍晕开过：\n\n~「母病重，速归。」~',
  textVariants: [
    { cond:{ flag:'wulao_sleep' }, text:'#梧老#「……小子……老夫睡了多久？」' },
    { cond: function(s){ return !s.flags.wulao_sleep; }, text:'#梧老#「……这一觉，老夫睡得不安稳。那枚印记……太眼熟了。」' },
    { cond:{ flag:'map_part3' }, text:'~三片残图，终于拼齐。~ 拼好的图面上，那条虚线完整地穿过冰原，直指九渊——那枚镜形印记，在完整的轮廓里清晰可见，像一枚印章，盖在封印之上。' },
    { cond: function(s){ return !s.flags.map_part3; }, text:'~残图还缺一角。~ 你盯着那个缺口，心里记下了：还有一片，流落在外。' }
  ],
  choices: [
    { text:'先回家看娘。', effects:{ flags:{ go_home:true }, rel:{ shen_mu:10 } }, goto:'v2_09c' },
    { text:'先查九渊的方位。~娘……等我。~', effects:{ temper:{ gongli:1 }, flags:{ go_jiuyuan:true } }, goto:'v2_09c' },
    { text:'两头兼顾——先托白芷去沈家看诊，自己查九渊。', effects:{ rel:{ baizhi:6 }, flags:{ both_sides:true } }, goto:'v2_09c' }
  ]
};

S.v2_10 = {
  id: 'v2_10', chapter: '卷二 · 风起云涌 · 第十章', title: '决赛·劫场',
  location: 'loc_xuanqing',
  text:
'宗门大比的决赛日，本该是青州最热闹的日子。\n\n天还没亮，山门前就挤满了人——各峰弟子、看热闹的散修、还有临江城、苍梧城特意赶来的世家子弟，把擂台围得水泄不通。彩绸挂满了擂台四角，在风里猎猎作响。看台上，几位长老正襟危坐，孙伯符还揣着一把瓜子。\n\n你站在擂台上，对面是一个沉默的锦衣少年。\n\n没人知道他叫什么，也没人知道他从哪里来。他只用了三场，就一路打进了决赛——每一场，对手都败得莫名其妙，像是被人抽走了力气。他使一柄通体漆黑的刀，刀身泛着不详的暗红，像凝固的血。\n\n梧老的声音从镜中传来，带着警惕：「小子，小心。那刀……是血魔宗的东西。这少年，怕是被人喂了东西——你看他的眼睛。」\n\n你顺着看过去。那少年低着头，可你分明看见，他眼底有一丝极淡的红光，一闪而过，像两点将熄未熄的炭。\n\n锣响。\n\n那少年拔刀，刀气漆黑如墨，卷着腥风——他的招式像不要命一样，招招以伤换伤，刀刀直取要害。看台上有人倒吸冷气，有人捂住了嘴。\n\n你紧握剑柄，站在擂台中央。看台上，柳长风微微颔首，眼里有光。\n\n锣响。\n\n那少年拔刀，刀气漆黑如墨，卷着腥风——他的招式像不要命一样，招招以伤换伤，刀刀直取要害。看台上有人倒吸冷气，有人捂住了嘴。\n\n你凝神，雷光在剑锋炸开，电弧噼啪作响。\n\n~这一战，不是切磋。是有人……想要我的命。~\n\n~那就来吧。~\n\n你抢先出剑，雷光如龙，撞向那片墨色！',
  choices: [
    { text:'速战速决，以雷霆之势破他刀势。', effects:{ flags:{ rush_final:true } }, goto:'v2_10b' },
    { text:'以守为攻，消耗他的血气。', effects:{ temper:{ gongli:1 }, flags:{ guard_final:true } }, goto:'v2_10b' }
  ]
};

  id: 'v2_11', chapter: '卷二 · 风起云涌 · 第十一章', title: '师父之伤',
  location: 'loc_xuanqing',
  text:
'你刚收剑，变故骤生——\n\n一道血影从天而降，滔天血气席卷整个广场！看台上的弟子像被割倒的麦子一样掀飞出去，惨叫声此起彼伏。彩绸被气浪撕碎，漫天飞舞。\n\n一个赤发老者立在擂台中央，周身血气翻涌如海，脚下的青石寸寸龟裂。他赤着半身，胸口纹着一头狰狞的血兽，随着他的呼吸，那血兽仿佛也在起伏。\n\n**血魔宗长老，血无极。**\n\n他居高临下地看着你，目光像在看一只蝼蚁：「苍梧镜，交出来。」\n\n话音未落，他抬手——动作很慢，像在掸去一粒灰尘——一道血色掌印却已凝聚成型，携着滔天威压，朝你当头拍下！\n\n空气被挤压得发出尖锐的啸声。你浑身僵硬，雷灵力在经脉中疯狂奔涌，却像被什么死死压住——\n\n一道白影，横空掠来，挡在你身前！\n\n**"噗——"**\n\n柳长风的长剑寸寸断裂，碎片四溅。血雾炸开，染红了漫天飘落的彩绸。他整个人像断线的风筝，向后飞出，重重砸在你怀里。\n\n温热的血，浸透了你的衣襟。\n\n他咳着血，却还在笑，声音断断续续：\n\n@柳长风@「剑者……心也……别让……别让剑心蒙尘……走……！」\n\n他旧伤复发，胸口的血迹迅速洇开，像一朵盛开的花。他缓缓闭上眼，气息越来越弱。\n\n你抱着他，指尖发抖。全场死寂。血无极冷笑一声，正要再出手——\n\n温如玉的声音忽然响起，带着一种从未有过的决然：「血无极！你敢在玄清宗撒野——」\n\n一道剑光，破空而起。',
  choices: [
    { text:'抱起师父，趁乱撤离。~这笔账，我记下了。~', effects:{ temper:{ henla:1 }, flags:{ flee_with_master:true } }, goto:'v2_11b' },
    { text:'放下师父，拔剑对向血无极：「你伤我师父，我要你的命。」', danger:true, effects:{ temper:{ xiayi:1 }, flags:{ face_xuewuji:true } }, goto:'v2_11b' }
  ]
};

  text:
'逼退黑莲后，你背着师父跌跌撞撞地逃入一处山谷。\n\n谷中草木荒芜，却藏着一座废弃的洞府。石门半掩，积灰寸厚，洞壁上的阵法纹路早已暗淡——显然荒废了不知多少年。\n\n你小心翼翼地把师父安置在洞府深处一块干燥的青石上，喂他服下疗骨丹。他的呼吸渐渐平稳下来，你悬着的心，稍稍放下。\n\n这时你才注意到，洞府中央有一座干涸的灵池。池底残留着一汪金色的液体，只有浅浅一滩，正散发着浓郁得惊人的灵气——灵气稠得几乎化不开，吸入一口，丹田都跟着发热。\n\n洞壁上，有人刻着几行字，笔迹苍劲：\n\n~「老夫于此池凝丹，坐关一甲子。后辈若见，此乃机缘——然，凝丹如渡劫，心不诚者，慎入。」~\n\n~前人遗泽……金丹之机！~\n\n你盘膝坐在那汪金液旁。梧老的声音在脑海中响起，虚弱却郑重：\n\n#梧老#「小子……这是凝液成丹的机缘。但你的心……你的心现在太乱了。」\n\n他顿了顿：「**金丹者，道心之果。你的道，是什么？**」\n\n灵气涌入体内，幻象再次降临——\n\n这一回，你看见的是：退婚的屈辱、母亲的白发、师父喷出的血、温如玉递出的玉简、边陲废墟里那个抱碗的孩童……\n\n**道心之问，三选其一。**',
  choices: [

    { text:'「我的道，是变强——强到让所有人，都付出代价。」', effects:{ temper:{ henla:1 }, setRealm:12, stats:{ atkBonus:3 }, flags:{ dao_power:true } }, goto:'v2_13' },

  text:

  text:

    { text:'「你跟着我，可要吃很多苦头。」', effects:{ flags:{ bai_jiu_pet:true }, rel:{ bai_jiu:8 } }, goto:'v2_08d' }

'又是半个月苦修。\n\n这一夜，你盘膝坐在竹窗前，《苍梧引气诀》运转到第十二个周天，丹田里的雷灵力忽然像烧开的水一样翻涌起来——\n\n你听见自己体内传来一声极轻的"啵"，像有什么壁障被冲开了。\n\n雷灵力顺着经脉奔涌而出，在你周身炸开细密的电弧，噼啪作响，照亮了整个屋子。竹窗外的风都被电得发麻。\n\n梧老的声音在脑海里响起，带着一丝欣慰：\n\n#梧老#「好小子，雷灵初成！这灵力，已经有几分模样了。记住——雷者，至刚至阳，也至纯。你的心越纯，雷越听你的话。」\n\n你睁开眼，指尖一弹，一道电弧"滋啦"一声，把窗台上的烛火劈成两半，又缓缓合拢，火苗轻轻摇曳，竟没有灭。',
  choices: [
    { text:'趁势冲击新的境界。', effects:{ setRealm:2, flags:{ realm_break3:true } }, goto:'v1n_09e' },
    { text:'不求突破，先把根基夯实。', effects:{ stats:{ xiwei:400, wuxing:1 }, flags:{ solid_base:true } }, goto:'v1n_09e' },
    { text:'静坐体悟这一夜的雷意。', effects:{ stats:{ wuxing:1, xinjing:10 }, flags:{ feel_thunder:true } }, goto:'v1n_09e' }
  ]
};

S.v2_03c = {
  id: 'v2_03c', chapter: '卷二 · 风起云涌 · 第三幕', title: '控心丹源',
  location: 'loc_xuanqing',
  text:
'陈玄被抬下去后，执事长老连夜在密室审问。\n\n你与朱尘大师兄奉命旁听。陈玄瘫在椅子上，眼底的血光早已散尽，只剩一脸灰败。他断断续续地说：\n\n@陈玄@「三个月前……有人在后山禁地附近……给我喂了一枚丹……之后我脑子就时不时发昏……控制不住自己……」\n\n执事长老沉声：「是谁？」\n\n陈玄摇头，忽然打了个寒战：「他蒙着脸……可我记得，他腰上挂着一枚骨牌，上面刻着……一只乌鸦。」\n\n~乌鸦骨牌……白骨教？还是血魔宗的使节？~\n\n朱尘站在一旁，垂着眼，不知在想什么。执事长老看向你：「此事牵扯魔道，宗门不可轻动。你可愿暗中查探？」',
  choices: [
    { text:'「弟子愿往。」', effects:{ flags:{ explore_danjing:true }, rel:{ changfeng:3 } }, goto:'v2_03d' },
    { text:'「先查后山药圃的当值弟子——丹药入体，必经人手。」', effects:{ temper:{ gongli:1 }, flags:{ check_apothecary:true } }, goto:'v2_03d' },
    { text:'不动声色地看了朱尘一眼。~他的反应，好像太平静了。~', effects:{ flags:{ watch_zhu_chen:true }, rel:{ zhu_chen:-2 } }, goto:'v2_03d' }
  ]
};

S.v2_06b = {
  id: 'v2_06b', chapter: '卷二 · 风起云涌 · 第六章', title: '孤儿',
  location: 'loc_xuanqing',
  text:
'回到宗门，你怀里还抱着那个边陲废墟里的孩童。他一路没说话，只死死攥着你给他的那包灵茶。\n\n白芷闻讯赶来，蹲下身替他诊脉，半晌，轻声说：「惊吓过度，加上饥寒，养一阵子就好。」\n\n她抬眼看向你：「他的家人……都没了。」\n\n孩童忽然抬头，直直地看着你，嘴唇动了动，吐出一个极轻的字：\n\n「……饿。」\n\n你鼻子一酸。你从怀里摸出那串小满给的糖葫芦，递到他手里。他小心翼翼地咬了一口，眼泪"啪嗒"掉在糖衣上。\n\n夜风穿过回廊，你蹲下来，把剑柄上系着的平安结解下来，挂在他脖子上：\n\n「以后，你就是玄清宗的人了。」\n\n他怔怔地低头，看着胸前那枚红绳编的平安结，忽然伸出小手，攥住了你的衣角，声音又轻又哑：\n\n「……我……没有名字。」\n\n你想起废墟里那个空碗，想起他空洞的眼神，沉默了一会儿：「那……就叫你「归山」吧。从废墟里回来，往后有山可归。」\n\n他抬起头，第一次露出了一个很淡很淡的笑。白芷站在一旁，偏过头，用袖子轻轻按了按眼角。',
  choices: [
    { text:'收他做记名弟子，托白芷照料。', effects:{ temper:{ xiayi:1 }, rel:{ baizhi:5 }, flags:{ take_orphan:true } }, goto:'v2_07' },
    { text:'托山下善堂安置，每月送去银钱口粮。', effects:{ temper:{ gongli:1 }, stats:{ lingshi:-20 }, flags:{ orphan_orphanage:true } }, goto:'v2_07' },
    { text:'只安顿他住下，不替他做决定。', effects:{ flags:{ settle_orphan:true } }, goto:'v2_07' }
  ]
};

S.v1n_09e = {
  id: 'v1n_09e', chapter: '卷一 · 少年意气 · 第四幕', title: '心魔微兆',
  location: 'loc_xuanqing',
  text:
'突破后的某个深夜，你做了个梦。\n\n梦里是三年前的那个夜晚——你躺在床上，浑身滚烫，有人站在床前，俯身看着你。他的脸隐在阴影里，你拼了命也看不清，只记得他腰间挂着一枚骨牌，牌面上刻着什么，在月光下泛着冷光。\n\n你想看清那纹路——\n\n你猛地惊醒，冷汗浸透了中衣。窗外月色惨白，梧桐的影子在窗纸上摇晃，像一只张开的巨手。\n\n梧老的声音在脑海响起，带着少见的严肃：\n\n#梧老#「……小子，你的心魔，比你想象中更早就种下了。那枚骨牌，是你心里的一根刺——早晚要拔出来的。」',
  choices: [
    { text:'闭眼细想那枚骨牌的纹路，直到手心掐出印子。', effects:{ stats:{ wuxing:1 }, flags:{ xinmo_bone:true } }, goto:'v1n_10' },
    { text:'压下杂念，起身修炼到天亮。', effects:{ stats:{ xiwei:150, xinjing:-3 }, flags:{ suppress_dream:true } }, goto:'v1n_10' },
    { text:'与梧老深谈心魔之事。', effects:{ rel:{ wulao:6 }, stats:{ xinjing:8 }, flags:{ talk_xinmo:true } }, goto:'v1n_10' }
  ]
};

S.v2_08d = {
  id: 'v2_08d', chapter: '卷二 · 风起云涌 · 第八章', title: '白九日常',
  location: 'loc_xuanqing',
  text:
'白九跟着你回了宗门。\n\n第一夜，它就把你的被褥拱成一个窝，盘在里面睡得四仰八叉，还打起了小呼噜；第二天一早，它叼走了你桌上一枚灵果，蹲在窗台上咔嚓咔嚓啃得欢实，果核吐得到处都是。\n\n你蹲在门口看它舔爪子，晨光落在它雪白的绒毛上，泛着淡淡的金——心里竟生出几分暖意。它像是察觉到你的目光，抬起头，歪了歪脑袋，把那枚啃了一半的灵果往你的方向推了推——意思是：分你一半。\n\n梧老在镜中嘀咕：「灵狐有灵，认了主，就是一辈子的事。小子，你这运气，老夫都羡慕。」\n\n白九似乎听懂了，抬起头，冲你"嘤"了一声，尾巴尖轻轻晃了晃——那枚灵果，又往你这边推了推。',
  choices: [
    { text:'伸手给它顺毛。', effects:{ rel:{ bai_jiu:5 }, stats:{ xinjing:5 }, flags:{ pet_bai_jiu:true } }, goto:'v2_08e' },
    { text:'把剑放在它面前，教它认你的气息。', effects:{ rel:{ bai_jiu:3 }, flags:{ bai_jiu_sword:true } }, goto:'v2_08e' },
    { text:'由它玩去，你继续修炼。', effects:{ stats:{ xiwei:100 }, flags:{ train_bai_jiu:true } }, goto:'v2_08e' }
  ]
};

  text:

  textVariants: [
    { cond:{ flag:'love_xiaoman' }, text:'苏小满蹲在溪边，正用树枝拨弄着火堆，烤着两枚灵薯。见你醒了，她耳朵尖红红的，却故作镇定：「师兄醒了？我、我烤了灵薯……你尝尝！」她把最烫的那枚塞给你，自己捧着另一枚，小口小口地吹着气。晨光落在她脸上，把她的睫毛镀成金色。' },
    { cond:{ flag:'love_qingshuang' }, text:'顾清霜坐在溪边一块青石上，膝上横着你的剑。她正用一块素白的帕子，仔仔细细地擦拭剑身，动作极轻。见你醒了，她别过脸，声音听不出情绪：「你的剑，昨夜沾了血。剑要养。」——可那帕子，是她自己的。' },
    { cond:{ flag:'love_yunshang' }, text:'云裳不知从哪儿变出一壶热茶，正倚着树，慢悠悠地喝着。见你醒了，她递过一杯：「刚煮的。万宝阁的规矩——谈成生意的第二天，要喝杯热茶庆祝。」她顿了顿，眼底带着笑，「咱们这生意……可是谈了一辈子。」' },
    { cond:{ flag:'love_baizhi' }, text:'白芷在洞府外晾着几株药材，袖口卷到肘弯，露出手腕上一道旧疤。她听见动静，回头冲你笑了笑：「醒了？我给师父换了药，又采了些柴胡。」她顿了顿，声音轻得像晨雾，「……你脸色不好，等会儿我再给你把把脉。」' },
    { cond:{ flag:'love_liuli' }, text:'夜琉璃坐在溪边的树杈上，手里把玩着一片落叶。见你醒了，她跳下来，把一片洗干净的果子递给你：「野果，甜的。」她顿了顿，别过脸，「……别多想，就是顺手。」——可她昨夜明明守了你一整夜。' }
  ],
  choices: [
    { text:'接过那份心意，郑重收好。', effects:{ stats:{ xinjing:15 }, flags:{ next_day_heart:true } }, goto:'v2_14' }
  ]
};

S.v1n_12c = {
  id: 'v1n_12c', chapter: '卷一 · 少年意气 · 第七幕', title: '秘境前夜',
  location: 'loc_xuanqing',
  text:
'秘境开启前夜，整个玄清宗灯火通明。\n\n各峰的弟子都在收拾行囊：有人在磨剑，有人在数丹药，有人在翻秘境图册，还有人蹲在院子里跟同伴交代"要是回不来，帮我照顾好我种的灵草"。\n\n你也在整理行囊。青锋剑擦了又擦，聚气丹数了三遍，迷踪符贴身收好。怀中的古镜安静地躺着，梧老难得没有打趣。\n\n院门被叩响。\n\n推开门——门外放着三样东西：一包糖葫芦，压着一张字条："师兄平安回来！——小满"；一壶酒，字条上歪歪扭扭写着："活着回来喝酒！——邢烈"；还有一枚黑玉棋子，没有字条，可你知道是谁。\n\n你站在门口，夜风拂过，忽然觉得，这秘境……也没那么可怕了。',
  choices: [

    { text:'只收了糖葫芦，把酒和棋子留在原地。~不欠人情。~', effects:{ temper:{ gongli:1 }, flags:{ pre_alone:true } }, goto:'v1n_13' },
    { text:'提起酒壶喝了一口，把棋子揣进怀里。', effects:{ temper:{ henla:1 }, flags:{ pre_tough:true }, stats:{ xinjing:5 } }, goto:'v1n_13' }

  text:
'第一擂的欢呼声还没散尽，你被同门簇拥着走下擂台。\n\n苏小满挤过人群，踮着脚把一壶水塞进你手里，眼睛亮晶晶的：「师兄，喝水！我、我看了你全程！」\n\n石磊拍着你的肩膀，蒲扇似的大手差点把你拍岔气：「好小子！三招！痛快！」钱多多不知从哪儿冒出来，压低声音：「师兄，有人押你进决赛，赔率一赔三——要不要自己也押一手？」\n\n看台上，云裳摇着扇子冲你点了点头；柳长风端坐着，嘴角几不可察地弯了一下。\n\n你拧开水壶，灌了一口。秋阳正好，风里带着桂花的香气——\n\n~这大概，就是"少年得意"的味道。~',

    { text:'向看台上的云裳举了举水壶，微微一笑。', effects:{ rel:{ yunshang:4 }, flags:{ toast_yunshang:true } }, goto:'v2_03' }

  location: 'loc_mijing',
  text:
'取珠之后，你趁着青蛟王尚未苏醒，在祭坛边缘发现了一具白骨。\n\n白骨倚着坛基，怀里的玉简早已黯淡，手边摊着一卷泛黄的绢帛——像是临死前，拼尽全力写下的。\n\n你展开绢帛，字迹潦草，墨迹被血浸过：\n\n~「……庚午年，奉师命入秘境寻镜心。祭坛有蛟龙守护，我等三人，殁其二。……镜心动，蛟龙醒。若后来者见此，切记——**镜心与苍梧镜同源，慎取。**」~\n\n落款处，是一个模糊的姓氏印记。你捏着绢帛，指尖微凉。\n\n~这祭坛下的秘密，比我想象的更深。~',
  choices: [

    { text:'对着白骨拜了拜：「前辈，得罪了。」', effects:{ temper:{ xiayi:1 }, flags:{ miji_bow:true } }, goto:'v1n_17' },
    { text:'记下"慎取"二字，握紧古镜。', effects:{ temper:{ henla:1 }, flags:{ miji_careful:true } }, goto:'v1n_17' }

S.v2_09d = {

  location: 'loc_xuanqing',
  text:
'夜里，你正对着残图出神，白九忽然从窗台上跳下来，凑到残图边，鼻尖抽了抽，然后咬住你的衣角，往外拽。\n\n你愣了一下：「白九？你要带我去哪儿？」\n\n它"嘤"了一声，松口，跳到院墙上，回头看你。\n\n你收起残图，跟了上去。\n\n白九在夜色里穿行如电，一路把你带到了宗门后山的一片竹林深处。它在一棵老竹下停下，用爪子刨了刨地面——土里，埋着一块焦黄的兽皮，边角残缺，与你的残图如出一辙。\n\n~北漠残图的碎片……怎么会埋在这里？~\n\n白九蹲在一旁，尾巴轻轻晃着，琥珀色的眼睛里带着一点"求表扬"的神色。',

  id: 'v1n_19c', chapter: '卷一 · 少年意气 · 第九幕', title: '筑基之夜',
  location: 'loc_xuanqing',
  text:
'突破筑基后的第一夜，你在院中静坐。\n\n体内的灵力不再是炼气期那缕细流——它现在像一条河，沉稳地流淌在经脉里，每过一次周天，便带起一点酥麻的电光。你闭上眼，能"看见"院外的风如何绕过竹梢，能听见百步外虫鸣的翅膀振动的节拍。\n\n~筑基。~\n\n这两个字，你曾在三年里无数次想过，又无数次把它压下去。如今它就这样安静地躺在你丹田里，像一件失而复得的旧物。\n\n梧老的镜光在怀里微微一亮——他像是被这筑基的气机惊动，迷迷糊糊地醒了一线神智：\n\n#梧老#「筑基，才算是真正踏上了仙途。炼气是搬砖，筑基是盖房——从今往后，这房子能盖多高，就看你自己了。」\n\n他顿了顿：「小子，还记得退婚那晚吗？那时候的你，可想不到自己会有今天吧。」\n\n镜光又沉了下去，像是睡熟了。\n\n你没有答话，只是望着头顶的月亮。月光很亮，像那天夜里祠堂的烛火。',
  choices: [
    { text:'「前辈，这条路，我走定了。」', effects:{ rel:{ wulao:6 }, stats:{ xinjing:10 }, flags:{ vow_road:true } }, goto:'v1n_20' },
    { text:'起身，把院中的剑练到天明。', effects:{ stats:{ xiwei:200 }, flags:{ night_sword:true } }, goto:'v1n_20' },
    { text:'给母亲写了一封家书，报了平安。', effects:{ temper:{ xiayi:1 }, rel:{ shen_mu:6 }, flags:{ letter_home:true } }, goto:'v1n_20' }
  ]
};

  location: 'loc_cangwu',
  text:
'章末的第三天，一只灰羽信鸽落在你窗前，脚上绑着一枚玉简。\n\n你解下玉简，神识探入——是云裳的字迹，没有客套，开门见山：\n\n~「血魔宗近日在青州各地收购北漠残图，出价是市价的三倍。另：大夏皇朝的人，也在打听一面「古镜」的下落。你小心。——裳」~\n\n玉简尾端，还压着一枚温润的令牌，正面刻着「万宝阁客卿」四字。\n\n你握着那枚令牌，指尖摩挲着上面的刻痕。\n\n~云裳……这是把自己，押到了我这边。~\n\n信鸽在窗台上歪着脑袋，咕咕叫了两声。',

  id: 'v1n_04b', chapter: '卷一 · 第三幕 · 青云会武', title: '余波',
  location: 'loc_xuanqing',
  text:
'测灵台上的雷光散尽，可人群里的议论声，却久久没有平息。\n\n你办完入门手续，走出大殿时，正撞上慕容家的人在廊下候着。慕容烈脸色铁青，盯着你的眼神像淬了毒；他身后的族老倒是笑眯眯的，可那笑纹里藏着的东西，比刀子还冷。\n\n更远处，陈玄远远地看了你一眼，那眼神里没有恨意，只有一种说不清道不明的算计——像一条蛇，在盘算着下口的时机。\n\n苏小满追上来，把一包桂花糖塞进你手里，眼睛亮晶晶的：「师兄师兄！你太厉害了！我请你吃糖！」\n\n你握着那包桂花糖，站在山门的台阶上，看着脚下层层叠叠的云海。\n\n~三年前，我从这里跌落谷底。~\n\n~三年后，我重新站在这里。~\n\n~这，还只是开始。~',

S.v1n_10e = {
  id: 'v1n_10e', chapter: '卷一 · 少年意气 · 第五幕', title: '坊市夜市',
  location: 'loc_cangwu',
  text:
'坊市的事办完，天色已暗。苍梧城的夜市，比白天更热闹。\n\n灵灯挂满长街，像一条蜿蜒的光河。糖炒灵栗的香气混着烤灵鱼的烟火气，飘得满街都是。摊贩们扯着嗓子叫卖，声音一个比一个高。\n\n云裳不知从哪儿冒出来，拽着你去逛夜市——她嘴上说"考察行情"，眼睛却盯着糖炒灵栗的摊子不放。\n\n街角的戏台子上，皮影戏正演到热闹处：白幕后面，一个小人儿持剑劈山，引得满场喝彩。幕前的说书人声音洪亮：\n\n@说书人@「话说当年苍梧仙帝，一柄剑，一面镜，镇压四海八荒——那镜中之灵，至今还在人间游荡咧！」\n\n你脚步一顿。白芷正好收摊路过，抱着一只药箱，闻言也停下来，静静地听。',
  choices: [
    { text:'买三份糖炒灵栗，分给云裳和白芷。', effects:{ stats:{ lingshi:-10 }, rel:{ yunshang:4, baizhi:4 }, flags:{ chestnut:true } }, goto:'v1n_11' },
    { text:'站在台下，把皮影戏从头看到尾。', effects:{ stats:{ wuxing:1 }, flags:{ shadow_play:true } }, goto:'v1n_11' },
    { text:'与云裳并肩走着，低声谈北漠残图的事。', effects:{ rel:{ yunshang:5 }, flags:{ night_talk:true } }, goto:'v1n_11' }
  ]
};

S.v2_01c = {
  id: 'v2_01c', chapter: '卷二 · 风起云涌 · 第一幕', title: '大比清晨',
  location: 'loc_xuanqing',
  text:
'大比当日，天还没亮透，演武场上已经人声鼎沸。\n\n彩绸从山门一路挂到擂台，弟子们里三层外三层，把场地围得水泄不通。有人搓着手取暖，有人踮着脚张望，空气里全是紧张与兴奋的味道。\n\n你在场边热身，忽然一条汗巾递到眼前。\n\n朱尘大师兄站在你面前，眉目温和：「沈师弟，放松。剑出鞘之前，手要稳。」\n\n他看了看你剑柄上系着的那枚平安结，目光微微一顿，随即笑了：「……是个好东西。戴着它，心里就稳了。」\n\n他说完，转身走向自己的席位。晨光落在他背上，把那个总是笑意温和的身影，镀上一层淡金。\n\n你握着剑柄，指尖触到那枚平安结上"平安"二字的刻痕，忽然觉得，手真的稳了。',
  choices: [
    { text:'「多谢大师兄指点。」', effects:{ rel:{ zhu_chen:5 }, flags:{ thank_zhu:true } }, goto:'v2_02' },
    { text:'「大师兄，擂台之上，有什么门道吗？」', effects:{ stats:{ wuxing:1 }, flags:{ ask_zhu_duel:true } }, goto:'v2_02' },
    { text:'不多话，默默热身。', effects:{ stats:{ xiwei:80 }, flags:{ warmup:true } }, goto:'v2_02' }
  ]
};

S.v1n_13b = {
  id: 'v1n_13b', chapter: '卷一 · 少年意气 · 第八幕', title: '秘境入口',
  location: 'loc_mijing',
  text:
'三日转瞬即至。\n\n秘境入口前，人山人海。青州各宗各派的弟子齐聚一堂，有人背着大包小包，有人攥着符箓，还有人当场跟同伴分起丹药来——"你三粒我三粒，出了事各凭本事"。\n\n万宝阁的摊子也摆到了山门前，聚气丹、辟谷丹、止血散摆了一排，价格比城里贵了三成——可买的人依然络绎不绝。云裳亲自坐镇，摇着扇子，笑眯眯地看着你：「沈公子，补点货？秘境里，有备无患。」\n\n你正要答话，余光忽然瞥见人群里一道黑影一闪而过——那人低着头，步履匆匆，腰间的衣摆下，隐约露出一抹血色。\n\n~黑莲？她怎么敢来秘境入口？~\n\n不远处，陈玄站在慕容家的队伍里，低着头，看不清神色。他的袖口下，似乎藏着什么东西。',
  choices: [
    { text:'去万宝阁摊子补些丹药。', effects:{ stats:{ lingshi:-30 }, items:{ add:{ juqi_dan:1, zhixue_san:1 } }, rel:{ yunshang:3 }, flags:{ stock_up:true } }, goto:'v1n_14' },
    { text:'盯着那道黑影消失的方向，若有所思。', effects:{ flags:{ note_heilian:true } }, goto:'v1n_14' },
    { text:'什么也不买，静候秘境入口开启。', effects:{ stats:{ xinjing:5 }, flags:{ wait_calm:true } }, goto:'v1n_14' }
  ]
};

S.v1n_07b = {
  id: 'v1n_07b', chapter: '卷一 · 少年意气 · 第四幕', title: '师父第一课',
  location: 'loc_xuanqing',
  text:'散课后，你按师父的吩咐，前往各自的修炼之地，上入宗第一课。',
  textVariants: [
    { cond: function(s){ return s.flags.teacher === 1; }, text:'青石剑坪，晨雾未散。\n\n柳长风负手立于剑坪中央，白衣胜雪。他没有回头，只淡淡道：\n\n@柳长风@「剑者，心也。心不正，剑不诚。」\n\n他随手一引，坪边石缝里一柄废剑"嗡"地出鞘，落在你脚前，剑尖朝上，微微震颤。\n\n@柳长风@「拔剑。」\n\n你握住剑柄——一股陌生的震颤从剑身传来，像握着一尾活鱼。柳长风看着你握剑的姿势，眼中掠过一丝几不可察的满意：\n\n@柳长风@「握剑三息而不抖，勉强算入门。今日教你第一式——「云开」。」\n\n他抬指，一道剑气在晨雾中划开一道笔直的银线。雾散，露珠坠地，如雨。\n\n你怔在原地。那一剑，快得你甚至没看清他是怎么出手的。\n\n#梧老#（镜中嘀咕）「啧，这老小子，剑意倒是有几分火候。小子，好好学——剑是九种兵器里，最讲「心」的。心狠，剑就狠。」' },
    { cond: function(s){ return s.flags.teacher === 2; }, text:'丹房，药香浓郁得化不开。\n\n孙伯符盘坐在蒲团上，面前摆着一排药臼。他笑眯眯地拈起一株百灵草，在鼻尖嗅了嗅，眯起眼：\n\n@孙伯符@「药性如人性——看着温和的，未必不伤人。今日先教你认药。」\n\n他把百灵草推到你面前：「闻。记住这个味道。火候、时辰、年份，都会改变一味药的气性。炼丹，炼的是心，不是手。」\n\n你凑近那株百灵草，草叶上还带着晨露，一股清苦的草木气钻进鼻腔。\n\n#梧老#（镜中嘀咕）「这老头说得倒是不错。小子，丹道一途，耗材耗力，但也最是生财——你自己掂量。」' },
    { cond: function(s){ return s.flags.teacher === 3; }, text:'符堂，四壁挂满符箓，朱砂的辛辣气混着墨香。\n\n林清音一袭素衣，指尖悬着一支狼毫。她没有废话，提笔在虚空一画——一道金符凭空而生，悬在半空，流光四溢。\n\n@林清音@「符者，天地之文。一笔错，万法空。」\n\n她把笔递给你：「画。画到笔不抖为止。」\n\n你接过笔，笔杆温润，笔尖的朱砂在晨光里殷红如血。你屏息，落笔——第一笔就歪了。\n\n林清音没有骂你，只是淡淡道：「继续。符道没有捷径，一万笔，一万个日夜。」\n\n#梧老#（镜中嘀咕）「这娘们儿是个狠角色。小子，符道入门慢，但画好了，一笔定生死。」' },
    { cond: function(s){ return s.flags.teacher === 4; }, text:'演武场，洪烈脱了上衣，露出铁铸般的肌肉。他拍了拍自己胸口，声若洪钟：\n\n@洪烈@「体修之道，以身为炉！什么灵根、什么功法，都比不上这副皮囊硬！」\n\n他指了指场边那面十丈高的石阶：「先跑一百圈。跑完，再搬那口石锁。」\n\n你二话不说，开始跑。日头渐渐升高，汗水糊了眼睛，肺像要烧起来——可你咬着牙，一圈，又一圈。\n\n洪烈抱着胳膊看了一会儿，忽然咧开嘴：「有点意思。小子，够硬气。」\n\n#梧老#（镜中嘀咕）「这莽夫的路子倒是直来直去。不过小子，皮糙肉厚也好——保命的时候，比什么都管用。」' }
  ],
  choices: [
    { text:'沉下心，把这一课学到骨子里。', effects:{ stats:{ wuxing:1, xiwei:80 }, rel:{ changfeng:3, sun_bo:3, lin_qingyin:3, hong_lie:3 } }, goto:'v1n_07c' },
    { text:'抓住机会，向师父请教一个一直想问的问题。', effects:{ stats:{ wuxing:1 }, flags:{ ask_master:true } }, goto:'v1n_07c' },
    { text:'把师父的每一句话、梧老的每一句嘀咕都记在心里。', effects:{ stats:{ xinjing:8 }, flags:{ note_master:true } }, goto:'v1n_07c' }

/* ================= 新增：顾清霜初遇 ================= */
S.v1n_08c = {
  id: 'v1n_08c', chapter: '卷一 · 少年意气 · 第四幕', title: '竹林剑影',
  location: 'loc_xuanqing',
  text:
'练功场风波过后，你正独自在竹林边调息。竹影婆娑，风过时"沙沙"作响，阳光被竹叶筛成细碎的光斑，落在地上明明灭灭。\n\n忽然，一道剑光破空而至——\n\n"铮！"\n\n一柄剑钉在你面前三步的地上，剑身轻颤，尾音嗡嗡不绝。剑锋入土三寸，不偏不倚，像是随手一掷，却准得惊人。\n\n竹林深处，走出一个白衣女子。她眉目清冷，步态极轻，踏在落叶上几乎没有声响。腰间悬着一柄同样的剑，看了你一眼，目光在你搁在膝上的佩剑上停了停：\n\n@顾清霜@「你就是那个雷灵根？」\n\n她顿了顿，语气平淡得像在念一句剑诀：「你的剑，握得太紧了。」\n\n你一愣。\n\n她却没有解释，转身欲走，走了两步又停住，头也不回：\n\n@顾清霜@「剑是手臂的延伸，不是仇人。握得太紧，剑会哭的。」\n\n说完，她飘然离去，衣袂带起几片竹叶，在风里打着旋儿。竹林里只剩剑鸣余韵。\n\n你低头看着自己的手——果然，指节还白着。\n\n#梧老#「……啧，这丫头，有点意思。小子，记她一好。」',
  choices: [
    { text:'「师姐留步——敢问剑道？」追上竹林，虚心请教。', effects:{ rel:{ qingshuang:8 }, flags:{ meet_qingshuang:true } }, goto:'v1n_08d' },
    { text:'望着她离去的背影，若有所思地松开握剑的手。', effects:{ rel:{ qingshuang:4 }, stats:{ wuxing:1 }, flags:{ meet_qingshuang:true } }, goto:'v1n_08d' },
    { text:'拔起那柄剑看了看——剑柄上刻着一个「霜」字。', effects:{ flags:{ meet_qingshuang:true, note_qingshuang:true } }, goto:'v1n_08d' }
  ]
};

/* ================= 新增：梧老夜课 ================= */
S.v1n_09b = {
  id: 'v1n_09b', chapter: '卷一 · 少年意气 · 第四幕', title: '梧老夜课',
  location: 'loc_xuanqing',
  text:
'子时，万籁俱寂。\n\n你盘膝坐在竹窗前，雷灵力在经脉中游走。梧老难得没有打盹，镜面浮着一层幽光，像一只眯起的眼睛。\n\n#梧老#「小子，问你个问题——修行是什么？」\n\n你一愣：「变强？」\n\n#梧老#「肤浅。」他哼了一声，「修行是**认识自己**。你越了解自己的心，这雷灵力就越听你的话。反之——」他顿了顿，「你心里那些放不下的事，早晚会变成你的心魔，在突破的时候咬你一口。」\n\n月光照进窗来，你沉默了很久。\n\n#梧老#「不过现在说这些还早。来，老夫教你一个雷系的小窍门——把灵力聚在指尖，试着让它在三息之内绕着手臂转一圈。」\n\n你依言而行。第一息，灵力迟滞；第二息，微微颤动；第三息——"滋啦"一声，一道细小的电弧在你指尖跳跃，照亮了你眼底的光。\n\n#梧老#「有天赋！再来！绕着整条手臂转！」\n\n这一夜，竹窗外的灯火，亮了很久。',
  choices: [
    { text:'继续加练，直到电弧能绕全身一周。', effects:{ stats:{ xiwei:120 }, flags:{ train_wulao:true } }, goto:'v1n_09c' },
    { text:'与梧老深谈"心魔"之事。', effects:{ stats:{ xinjing:10 }, rel:{ wulao:8 }, flags:{ talk_wulao:true } }, goto:'v1n_09c' },
    { text:'记住"认识自己"这句话，静坐入定。', effects:{ stats:{ wuxing:1, xinjing:5 }, flags:{ sit_wulao:true } }, goto:'v1n_09c' }
  ]
};

/* ================= 新增：温如玉棋局 ================= */
S.v1n_10b = {
  id: 'v1n_10b', chapter: '卷一 · 少年意气 · 第五幕', title: '夜弈',
  location: 'loc_xuanqing',
  text:
'入夜，你经过演武场，看见温如玉独自坐在石亭里，对着棋盘出神。\n\n棋盘上黑白交错，局势胶着。他捏着一枚黑子，迟迟没有落下。\n\n看见你，他微微一笑，招手：「沈师弟，来手谈一局？」\n\n你在他对面坐下。棋局过半，他忽然开口，声音很轻：\n\n@温如玉@「沈师弟，你说——一盘棋里，最难的，是当棋子的人，还是下棋的人？」\n\n你握着白子，一时不知如何作答。\n\n他笑了笑，落下黑子：「有时候，你以为自己是下棋的人，其实不过是更大一盘棋里的棋子。」\n\n夜风穿亭而过，棋盘上的棋子纹丝不动。他起身，拍了拍你的肩：\n\n@温如玉@「夜深了，早些歇息。」\n\n他走得很慢，背影在月光下拉得很长。你低头看那盘棋——他落下的那枚黑子，恰好封死了你所有的路。\n\n#梧老#（良久）「……这小子，话里有话。」',
  choices: [
    { text:'「师兄，那你想做下棋的人，还是棋子？」', effects:{ rel:{ wenyu:6 }, flags:{ ask_wenyu:true } }, goto:'v1n_10c' },
    { text:'不接话，把棋盘上那颗黑子轻轻拨回原位。', effects:{ rel:{ wenyu:3 }, flags:{ note_wenyu:true } }, goto:'v1n_10c' },
    { text:'记下这盘棋的落子，默默回去。', effects:{ flags:{ record_wenyu:true } }, goto:'v1n_10c' }
  ]
};

S.v2_01c = {
  id: 'v2_01c', chapter: '卷二 · 风起云涌 · 第一幕', title: '大比清晨',
  location: 'loc_xuanqing',
  text:
'大比当日，天还没亮透，演武场上已经人声鼎沸。\n\n晨雾还没散尽，被初升的日头染成淡淡的金色。彩绸从山门一路挂到擂台，在风里翻卷如浪；弟子们里三层外三层，把场地围得水泄不通，有人搓着手取暖，有人踮着脚张望，空气里全是紧张与兴奋的味道——还混着烤饼的焦香，膳堂的师兄把摊子都支到了场边。\n\n你在场边热身，活动着腕骨，忽然一条汗巾递到眼前。\n\n朱尘大师兄站在你面前，眉目温和：「沈师弟，放松。剑出鞘之前，手要稳。」\n\n他看了看你剑柄上系着的那枚平安结，目光微微一顿，随即笑了：「……是个好东西。戴着它，心里就稳了。」\n\n他说完，转身走向自己的席位。晨光落在他背上，把那个总是笑意温和的身影，镀上一层淡金。\n\n你握着剑柄，指尖触到那枚平安结上"平安"二字的刻痕，忽然觉得，手真的稳了。\n\n远处，慕容烈正从看台上俯视着你，嘴角的弧度带着几分胜券在握的轻蔑；他身后的慕容昭端坐不动，像一尊沉默的塑像。你收回目光，长长地呼出一口气——\n\n~三年前，我从这里跌落。~ \n\n~三年后，我站在这里。~\n\n~这第一场，就从你们开始。~',
  choices: [
    { text:'「多谢大师兄指点。」', effects:{ rel:{ zhu_chen:5 }, flags:{ thank_zhu:true } }, goto:'v2_02' },

    { text:'不多话，默默热身。', effects:{ stats:{ xiwei:80 }, flags:{ warmup:true } }, goto:'v2_02' }

/* ================= 第二幕 · 冤家路窄 ================= */
S.v2_02 = {
  id: 'v2_02', chapter: '卷二 · 风起云涌 · 第二幕', title: '冤家路窄',
  location: 'loc_xuanqing',
  text:
'大比擂台上，彩绸猎猎，人声鼎沸。\n\n四面看台坐满了人，各峰长老、各家族代表、还有专程从苍梧城赶来看热闹的散修，把演武场围成了一个人声的漩涡。风裹着尘土和呐喊声扑面而来，擂台的青石被日头晒得微微发烫，隔着鞋底都能感到那股热气。\n\n抽签的木箱被执事弟子抱上来时，全场弟子都屏住了呼吸——大比的签，关系到每个人的对手与命运。木箱里竹签碰撞，发出清脆的哗啦声，一声一声，敲在人心上。\n\n你上前，随手抽出一枚竹签。执事弟子接过，高声念出：\n\n「甲字场，第一轮——{name}，对阵……慕容烈！」\n\n全场先是一静，随即哗然炸开！谁都知道，秘境之后，你与慕容家的梁子早就结死了。议论声像潮水一样涌来，有人兴奋，有人担忧，有人纯粹在看热闹——角落里，连钱多多都攥着钱袋，一脸纠结要不要临时改注。\n\n看台上，慕容烈脸色先是一僵，随即狞笑起来，声音大得半个广场都听得见：「好！好得很！{name}，秘境里让你捡了便宜，今日擂台之上，看谁还能护你！」\n\n他"腾"地站起身，一把扯下外袍，拔刀跃上擂台——刀光凛冽，映着他眼底的狠戾。半年不见，他竟也突破到了筑基，气息比在秘境时强了一截，显然慕容家在他身上砸了不少灵石——那灵石的灵气，都快从毛孔里溢出来了。\n\n你注意到，看台第一排，慕容昭端坐不动，面无表情；他身侧那道月白身影，却在你登台时微微偏过头，避开了你的目光——是慕容雪。她的指尖绞着袖口，指节发白，像是想说什么，又咽了回去。\n\n你缓步登台，衣袂不动，在喧闹的人声中站定。风掠过擂台，吹起你的衣角，也吹来慕容烈那句压低了的狠话：\n\n@慕容烈@「{name}，今日这一战，我要你当着全青州的面，跪下去。」\n\n你抬眼看他，淡淡地：「慕容兄，请。」\n\n#梧老#（镜光微闪，声音带着刚醒的沙哑）「唔……筑基了？慕容家……在他身上砸了不少灵石。小子……留点手……别把他打哭了……」他像是又被困意拉了回去，声音渐渐低了下去，再没了声息。',
  choices: [
    { text:'拱手：「慕容兄，请。」', effects:{ temper:{ xiayi:1 }, flags:{ bow_murong:true } }, goto:'v2_02b' },
    { text:'「慕容兄，这次可没有秘境妖兽给你撑腰了。」', effects:{ temper:{ henla:1 }, rel:{ murong_lie:-6 }, flags:{ taunt_murong2:true } }, goto:'v2_02b' },
    { text:'一言不发，摆出起手式。', effects:{ temper:{ gongli:1 }, flags:{ silent_fight:true } }, goto:'v2_02b' }
  ]
};

  id: 'v2_03', chapter: '卷二 · 风起云涌 · 第三幕', title: '陈玄之战',
  location: 'loc_xuanqing',
  text:
'第二轮，你抽到了**陈玄**。\n\n消息传开，看台上顿时议论纷纷——上届大比陈玄就败在你手里，如今再遇，是新仇旧恨一起算，还是你再度碾压？\n\n陈玄缓步登台。他面无表情，步伐却比从前更沉——只是眼底那抹诡异的红芒，比在秘境时更盛了，像两粒烧透的炭，烧得人心头发毛。\n\n他周身的气息起伏不定，忽强忽弱，像有什么东西在体内翻涌挣扎。离他近的弟子，都下意识往后退了一步，空气里隐约弥漫着一丝若有若无的血腥气。\n\n你眉头微皱。怀中的古镜微微一震——像是感应到那股不该出现在擂台上的魔气，沉睡中的梧老被惊醒了一线神智：\n\n#梧老#「……不对劲。这小子体内的力量……是**控心丹**的痕迹。有人拿他做了棋子——下棋的人，就在这宗门里。」\n\n话音落下，镜光又暗了下去，像是再次沉入了梦底。\n\n陈玄抬起头，嘴角咧开一个僵硬的笑，像是有人牵着他的嘴角：「{name}……有人让我……杀了你。」\n\n看台上，慕容烈站起来，攥着栏杆，一脸看好戏的狞笑；几位长老却变了脸色——他们也察觉到了那缕不该出现在擂台上的黑气。\n\n你望着陈玄眼底那两粒烧红的炭，忽然想起三年前测灵台下的自己。那时候，没有人看得出你被人动了手脚——就像现在，没有人看得出陈玄已经身不由己。\n\n~他不过是另一枚棋子。~\n\n~可棋子想杀人，也得先问过我这把剑。~\n\n话音未落，他拔剑而起，剑上黑气缭绕，气息暴涨！看台上有人失声惊呼。\n\n锣声未响，他竟已出手！',

  location: 'loc_xuanqing',
  text:
'陈玄被抬下去后，执事长老连夜在密室审问。\n\n密室里只点着一盏油灯，烛火被符阵封住，凝成一团不晃的暖光。陈玄瘫在椅子上，眼底的血光早已散尽，只剩一脸灰败，整个人像被抽去了骨头。他断断续续地说：\n\n@陈玄@「三个月前……有人在后山禁地附近……给我喂了一枚丹……之后我脑子就时不时发昏……控制不住自己……」\n\n执事长老沉声：「是谁？」\n\n陈玄摇头，忽然打了个寒战：「他蒙着脸……可我记得，他腰上挂着一枚骨牌，上面刻着……一只乌鸦。」\n\n~乌鸦骨牌……白骨教？还是血魔宗的使节？~\n\n朱尘站在一旁，垂着眼，烛火在他眼底明明灭灭，不知在想什么。执事长老看向你：「此事牵扯魔道，宗门不可轻动。你可愿暗中查探？」\n\n你应下差事，正要退下，陈玄忽然抬起头，哑着嗓子喊住你：\n\n@陈玄@「……{name}。」他顿了顿，像是不习惯说这样的话，「擂台之上……谢了。那一剑，要是没有你，我大概……已经成了刀下鬼。」\n\n他说完，又垂下头去，像是把这句话连同尊严一起放下了。你站在门口，看着那个曾经趾高气扬的锦衣公子，忽然觉得，有些恨意，在这一刻轻了一些。',

    { text:'不动声色地看了朱尘一眼。~他的反应，好像太平静了。~', effects:{ flags:{ watch_zhu_chen:true }, rel:{ zhu_chen:-2 } }, goto:'v2_03d' }

  location: 'loc_xuanqing',
  text:
'大比告一段落，你连战连胜，名动宗门。\n\n看台上那些曾经看轻你的面孔，如今看你的眼神都变了——有人敬畏，有人忌惮，也有人藏着说不清的复杂。膳堂里，连掌勺的大婶都多给你舀了一勺肉，说"英雄该多吃点"；下山采买的师兄，甚至把你的事迹讲给了茶馆的说书人。\n\n当晚，月上中天。你正在院中调息，丹田里的灵力缓缓流转，忽然，一道纸鹤穿窗而入，轻盈地落在你手心，翅膀一颤，化作一行小字：\n\n~「后山凉亭，有事相商。——等你的人」~\n\n笔迹清秀，墨香未散。你翻过纸背，背面画着一枝小小的梅花——笔锋收得极稳，一看便知画的人心很静。\n\n你收起纸鹤，望向后山的方向。月色正好，风里带着桂花的香气，远处传来隐隐约约的虫鸣，像是整个宗门都在这一夜安静下来。\n\n你起身，推开院门。月光洒在青石小径上，像铺了一层银霜，每一步踩上去，都像踩在一层薄薄的雪上。\n\n~会是谁呢？~\n\n你踏着月光，向后山走去。',
  choices: [
    { text:'赴约——若是苏小满呢？', effects:{ rel:{ xiaoman:10 }, flags:{ moon_xiaoman:true } }, goto:'v2_04b' },
    { text:'赴约——若是顾清霜呢？', effects:{ rel:{ qingshuang:10 }, flags:{ moon_qingshuang:true } }, goto:'v2_04b' },
    { text:'赴约——若是云裳呢？', effects:{ rel:{ yunshang:10 }, flags:{ moon_yunshang:true } }, goto:'v2_04b' },
    { text:'赴约——若是白芷呢？', effects:{ rel:{ baizhi:10 }, flags:{ moon_baizhi:true } }, goto:'v2_04b' },
    { text:'赴约——若是夜琉璃呢？', effects:{ rel:{ liuli:10 }, flags:{ moon_liuli:true } }, goto:'v2_04b' },
    { text:'「夜已深，明日还有大比。」转身回房，辜负了这份心意。', effects:{ flags:{ miss_moon:true } }, goto:'v2_05' }
  ]
};

  location: 'loc_xuanqing',
  text:'月色如纱。凉亭里等你的人，让你心头微动。',
  textVariants: [

    { cond:{ flag:'moon_qingshuang' }, text:'顾清霜一袭白衣，倚着栏杆，望着月色，月下的侧影清冷如霜：「你的剑，杀气太重了。」\n\n她顿了顿：「剑者，心也。你的心，在急什么？」\n\n她转过头，月光落在她眉间，那双总是清冷的眼底，此刻却有一丝极淡的暖意：「{name}……若有一天你需要一把剑，我的剑，可以借你。」\n\n夜风拂过，她鬓边的发丝轻轻扬起。你看着她的侧脸，忽然觉得，凉亭里的月色，好像比别处更亮一些。\n\n她没有再多说，只是把腰间的剑解下来，横放在石桌上，推到你面前一寸——那动作轻得像在托付一件心事。' },
    { cond:{ flag:'moon_yunshang' }, text:'云裳摇着扇子，笑得眉眼弯弯：「找你谈笔生意——万宝阁想聘你做客卿。报酬好说，灵石管够。」\n\n她顿了顿，声音忽然轻了些：「……顺便，想问问你，北漠的残图，你有没有兴趣？」\n\n扇子掩住半张脸，只露出一双含笑的眼。可你分明看见，她问"残图"两个字的时候，扇沿微微颤了一下。\n\n~万宝阁的情报，果然比谁都灵。~\n\n你笑了笑：「客卿的事可以谈。残图的事……也谈谈？」\n\n她"啪"地合上扇子，眼底的笑意深了几分：「成交。」她站起身，走了两步，又回头补了一句，声音轻得几乎听不见：「……残图的事，水很深。你要是卷进来，记得——先来找我。」' },
    { cond:{ flag:'moon_baizhi' }, text:'白芷提着一盏药灯，递给你一枚温热的丹药，指尖还沾着捣药的药汁：「你与陈玄一战，经脉受了暗伤。这是我调的养脉丹……」\n\n她垂下眼，声音轻得像怕惊了夜：「医者不医己。能医你，是我的福气。」\n\n药灯的光在她脸上投下一片暖影。你接过丹药，指尖触到她微凉的指腹——她像被烫到一样缩回手，又若无其事地拢了拢鬓发：「记得……睡前服。」\n\n她说完，却没有立刻走，站在灯影里，像是还有什么话，在唇边转了转，终究没有说出口。' },
    { cond:{ flag:'moon_liuli' }, text:'夜琉璃斜倚着凉亭柱子，指尖绕着一缕月光，似笑非笑：「半年不见，你倒是出息了。」\n\n她忽然敛了笑意，声音低下来：「血无极来了青州。他在查一件东西——跟你怀里那面镜子有关。」\n\n月光落在她眼底，那一瞬，她的眼神认真得不像她：「……小心点，{name}。我可不想给你收尸。」\n\n她说完，不等你答话，转身没入夜色，衣角带起一阵淡淡的冷香。你站在原地，握着怀中古镜，指尖冰凉。\n\n~血无极……他也在找苍梧镜。~\n\n~这面镜子里，到底藏着什么？~' }

/* ================= 第五幕 · 暗流 ================= */
S.v2_05 = {
  id: 'v2_05', chapter: '卷二 · 风起云涌 · 第五幕', title: '暗流',
  location: 'loc_xuanqing',
  ending: 'vol2_hook',
  text:
'那一夜之后，风起了。\n\n消息像长了翅膀，三天之内传遍了整个青州：血魔宗长老**血无极**现踪边陲，有猎户亲眼看见他徒手撕开一头二阶妖兽，血溅了三丈远。茶楼里的散修们压低声音议论，说那血无极赤发如血、胸口纹着一头血兽，走到哪儿，哪儿就只剩一具具干尸。人人脸上都带着不安，连山门前的灯笼，都比往常多挂了一倍。\n\n宗门连夜加派了巡夜弟子。夜色里，火把的光在山道上明明灭灭，像一只只不安的眼睛。\n\n又三日，你深夜练剑归来。月色下，一道熟悉的身影正无声地掠出山门——是温如玉。他步履匆匆，怀里似乎揣着什么东西，在月光下投下一道拉长的影子，消失在夜色里。\n\n你站在山门前，握紧怀中古镜，指尖冰凉。\n\n~梧老还在沉睡。玉简上的字还在心头烧。黑莲的血影、陈玄体内的控心丹、温如玉深夜的背影……~\n\n~还有那句"是宫里的那位"——大夏皇朝。~\n\n~这苍梧界的天，真的要变了。~\n\n你低头，看着古镜斑驳的镜面。月光落进去，镜底深处，仿佛有什么东西，动了一下。\n\n你转身回山。身后，山门前的灯笼在风里晃了晃，光影明灭，像一双睁开的眼睛。\n\n**—— 卷二 · 第一章 完 ——**',
  choices: [
    { text:'🗡 继续前行 · 踏入卷二第二章', effects:{}, goto:'v2_05b' }
  ]
};

S.v2_05b = {
  id: 'v2_05b', chapter: '卷二 · 风起云涌 · 第五章', title: '云裳来信',
  location: 'loc_cangwu',
  text:
'章末的第三天，一只灰羽信鸽落在你窗前，脚上绑着一枚玉简，爪尖还沾着一点夜露——是连夜飞来的。\n\n你解下玉简，神识探入——是云裳的字迹，没有客套，开门见山：\n\n~「血魔宗近日在青州各地收购北漠残图，出价是市价的三倍。另：大夏皇朝的人，也在打听一面「古镜」的下落。你小心。——裳」~\n\n玉简尾端，还压着一枚温润的令牌，正面刻着「万宝阁客卿」四字，背面刻着一行小字：「凭此令，万宝阁各分号任你调用。」\n\n你握着那枚令牌，指尖摩挲着上面的刻痕，令牌微温，像还带着她的体温。\n\n~云裳……这是把自己，押到了我这边。~\n\n~一个商号的大小姐，把万宝阁的招牌押在一个散修身上——这买卖，怎么看都是亏本。~\n\n信鸽在窗台上歪着脑袋，咕咕叫了两声，仿佛在催你回信。\n\n你提笔，在纸上落下几行字，又涂掉，反反复复。最后只留了一句：「残图的事，我自有分寸。你顾好万宝阁——等我从东荒回来，请你喝酒。」\n\n信鸽振翅飞入暮色，很快变成一个黑点。你望着它消失的方向，心里那根绷着的弦，好像松了一点点。',
  choices: [
    { text:'写封回信，托信鸽带给她。', effects:{ rel:{ yunshang:6 }, flags:{ reply_yunshang:true } }, goto:'v2_06' },
    { text:'让钱多多打听大夏皇朝的动向。', effects:{ stats:{ lingshi:-10 }, flags:{ info_court:true }, rel:{ qian_duoduo:3 } }, goto:'v2_06' },
    { text:'收好令牌，继续备战。', effects:{ flags:{ keep_keqing:true } }, goto:'v2_06' }

S.v2_06 = {
  id: 'v2_06', chapter: '卷二 · 风起云涌 · 第六章', title: '边陲惨状',
  location: 'loc_linjiang',
  text:
'消息传来的第三天，青州边陲，三个村落一夜之间被屠。\n\n你随宗门弟子赶到时，暮色正沉，天边只剩一线惨白的光。残垣断壁间，血味浓得化不开，混着焦糊与牲畜的腥臭，呛得人喉头发紧。有乌鸦在树梢盘旋，发出粗哑的叫声，一声接一声，像在为这片土地送葬。\n\n村口的晒谷场上，晒着的不是谷子，是倒伏的尸首。有人跪在地上，一声不吭地翻着断砖，找自己的亲人——他的手指磨出了血，却像感觉不到疼。\n\n倒塌的屋梁下压着半锅冷掉的粥，灶台上的碗筷还摆得整整齐齐，仿佛一家人只是出门躲了一会儿，很快就会回来。墙根下，一只老黄狗伏在主人身边，怎么赶也不肯走，喉咙里发出低低的呜咽。\n\n废墟中央，一个五六岁的孩童抱着空碗坐在断墙下，不哭不闹，眼神空空的，望着一个方向——那是他家的方向。他身上的衣裳破了好几道口子，露出的皮肤上带着青紫的淤痕，像是被人从瓦砾里扒出来的。\n\n你走过去，蹲下身。他往后缩了缩，却没有躲开。你把身上仅剩的干粮和灵茶放在他碗里，他低头看着，很久很久，才伸出沾满灰土的小手，攥住了那包灵茶——攥得那样紧，指节都白了，像是攥着最后一根救命稻草。\n\n同门弟子红了眼眶，有人低声骂了一句：「血魔宗……畜生！」\n\n你站起身，望着这片废墟。风掠过断墙，吹起孩童额前的碎发。你忽然明白，那些写在玉简上的"封印将溃""大劫将至"，从来不是遥远的话——它们已经踩到了这片土地上，踩碎了一个孩子的一整个家。\n\n清理废墟时，你在村后的井台边看见一排新挖的土坑——那是幸存者们在掩埋亲人。没有人哭，哭声在那样的夜里，是会被野兽引来的。只有铲土的声音，一声，又一声，像这片土地在缓慢地呼吸。\n\n回宗之后，议事厅吵成一团，烛火被声浪震得直晃。\n\n主战派拍案而起：「打！打到南疆去，血债血偿！」\n\n主守派摇头：「魔道势大，正面迎战，青州危矣！」\n\n柳长风坐在上首，没有开口。他胸口还缠着旧伤的绷带——那是二十年前九渊之战留下的老伤，每逢阴雨天便隐隐作痛。他只是看着你，那目光里有话。\n\n散会时，你走出议事厅，月色正凉。你忽然想起什么，折回废墟的方向——那个孩童还坐在断墙下，抱着空碗，仰着头，安静地看着你，像在看一个会不会转身离开的人。\n\n你走回去，蹲下身，朝他伸出手：「跟我走，好不好？」\n\n他看了看你的手，又看了看你，很久很久，才伸出那只沾满灰土的小手，轻轻搭在你掌心——凉得没有一丝温度。\n\n那一刻你忽然明白，这趟边陲，你带回去的，不止是一场惨状。',
  choices: [
    { text:'「打。但不是现在——先联合万宝阁与散修，再打。」', effects:{ temper:{ gongli:1 }, flags:{ ally_wanbao:true }, rel:{ changfeng:4 } }, goto:'v2_06b' },
    { text:'「先把边陲的百姓撤进青州腹地，再谈战事。」', effects:{ temper:{ xiayi:1 }, flags:{ retreat_people:true } }, goto:'v2_06b' },
    { text:'「血无极在暗处，我们在明处——先揪出宗门里的内应。」', effects:{ temper:{ henla:1 }, flags:{ find_spy:true }, rel:{ wenyu:-3 } }, goto:'v2_06b' }
  ]
};

  id: 'v2_06b', chapter: '卷二 · 风起云涌 · 第六章', title: '孤儿',
  location: 'loc_xuanqing',
  text:
'回到宗门，你怀里还抱着那个边陲废墟里的孩童。他一路没说话，只死死攥着你给他的那包灵茶，攥得包装纸都皱了。山风迎面扑来，他把脸埋进你肩头，小小的身子在发抖。\n\n白芷闻讯赶来，蹲下身替他诊脉，指尖搭在他细瘦的手腕上，半晌，轻声说：「惊吓过度，加上饥寒，养一阵子就好。」\n\n她抬眼看向你：「他的家人……都没了。」\n\n孩童忽然抬头，直直地看着你，嘴唇动了动，吐出一个极轻的字：\n\n「……饿。」\n\n你鼻子一酸。你从怀里摸出那串小满给的糖葫芦，递到他手里。他小心翼翼地咬了一口，糖衣"咔"地碎了，眼泪"啪嗒"掉在糖衣上。\n\n夜风穿过回廊，你蹲下来，把剑柄上系着的平安结解下来，挂在他脖子上：\n\n「以后，你就是玄清宗的人了。」\n\n他怔怔地低头，看着胸前那枚红绳编的平安结，红绳蹭着他灰扑扑的衣领，忽然伸出小手，攥住了你的衣角，声音又轻又哑：\n\n「……我……没有名字。」\n\n你想起废墟里那个空碗，想起他空洞的眼神，沉默了一会儿：「那……就叫你「归山」吧。从废墟里回来，往后有山可归。」\n\n他抬起头，第一次露出了一个很淡很淡的笑——像阴云里漏下来的一线光。白芷站在一旁，偏过头，用袖子轻轻按了按眼角。',
