S.v2_06c = {
  id: 'v2_06c', chapter: '卷二 · 风起云涌 · 第六章', title: '归山',
  location: 'loc_xuanqing',
  text:
'深夜，你睡不着，提着一盏灯去看归山。\n\n客房的门虚掩着，灯影从门缝里漏出来。你轻轻推开——白芷坐在灯下，正一针一线地给归山缝一件小衣，袖口卷到肘弯，露出手腕上那道旧疤。她听见动静，抬头看了你一眼，没有说话，又低下头去，针脚走得很细。\n\n归山蜷在被窝里，怀里抱着那包灵茶和一根糖葫芦的竹签，睡得正沉。他忽然在梦里翻了个身，含含糊糊地喊了一声：\n\n「……娘。」\n\n白芷的针停了。\n\n你站在门口，喉头堵得说不出话。\n\n白芷轻声说：「他在废墟里待了两天两夜，没哭过一声。睡着才敢喊娘。」她的声音很平，像在说一件再寻常不过的事，可灯下，她的眼尾有一点水光，被她很快压了下去。\n\n你蹲在榻边，替归山把被角掖好。他忽然伸出手，抓住了你的手指——攥得紧紧的，像抓住一根浮木，又慢慢松开，继续睡了。\n\n窗外月光正好，山风送来远处巡逻弟子的脚步声。这个伤痕累累的宗门，正在一寸一寸地愈合。\n\n你站在门口，看了很久，才轻轻带上房门。',
  choices: [
    { text:'替归山掖好被角，在门口站了很久才离开。', effects:{ flags:{ guishan_guard:true } }, goto:'v2_07' },
    { text:'与白芷聊了几句家常，夸她针脚细。', effects:{ rel:{ baizhi:4 }, flags:{ baizhi_needle:true } }, goto:'v2_07' },
    { text:'轻声说：「往后有山可归。」像是在对他说，也像是对自己。', effects:{ flags:{ guishan_word:true }, stats:{ xinjing:8 } }, goto:'v2_07' }
  ]
};

/* ================= 第三章 · 青州风云 ================= */
S.v2_07 = {
  id: 'v2_07', chapter: '卷二 · 风起云涌 · 第七章', title: '月下尾行',
  location: 'loc_xuanqing',
  text:
'议事之后，你把注意力放在了温如玉身上。\n\n自从陈玄体内的控心丹被当众揭破，温如玉就变得越发沉默。他依旧会在棋亭对弈，依旧笑得温和，可你总觉得，他知道些什么——那枚乌鸦骨牌、边陲的血、还有那句"是宫里的那位"，像一条看不见的线，都隐隐约约地绕着他转。\n\n你想起秘境夜营时，他问你的那句话："人这一辈子，到底是自己选的路，还是被路选的人？"如今想来，那话里像是藏着一层没说完的意思。\n\n这夜，月晦星稀。你正打坐，忽然听见院外一道极轻的衣袂声——像一片叶子被风卷起，又落下。\n\n你推窗——温如玉一袭玄衣，正无声地掠过后山，往山门方向去了。\n\n~又是这个时辰。~ 你略一犹豫，跟了上去。\n\n你没有走山道，而是贴着崖壁的阴影潜行，每一步都踩在石缝里，不敢惊动一粒碎石。夜风把你的衣角吹得猎猎作响，你不得不按住袍角，屏住呼吸。山道上的碎石被夜露浸得冰凉，硌在脚下，你咬着牙，一步一步，把距离控制在一丈之外。\n\n山脚下，温如玉停下脚步。一道黑袍身影从树影中走出——那人身形极高，宽大的袍子笼住全身，只露出一双枯瘦的手，手背上爬着青色的血管。他与温如玉说了几句，声音压得极低，温如玉便从怀中取出一枚玉简，递了过去。\n\n黑袍人接过玉简，又说了什么。风把几个字送到你耳边：\n\n「……慕容昭……三片残图……北漠……」。\n\n温如玉转身往回走，脚步比来时更沉。月光下，他的背影被拉得很长，像一个背着什么重物的人。\n\n你藏在树后，一动不动，直到他的脚步声彻底消失，才缓缓吐出一口浊气。夜风灌进衣领，你才发现，后背的中衣已经被冷汗浸透了。\n\n回到院中，你却怎么也睡不着。窗外月色惨白，你把玩着陈玄供词里提到的那枚乌鸦骨牌——自然是空的，什么都没有。可你总觉得，今晚黑袍人接过玉简时手指的停顿里，藏着一丝你没看清的东西。\n\n~温如玉……你到底在替谁做事？~\n\n~又在替谁，瞒着我？~',
  choices: [
    { text:'从树影中现身：「温师兄，深夜赠玉，所为何人？」', danger:true, effects:{ rel:{ wenyu:-10 }, flags:{ confront_wenyu:true } }, goto:'v2_07b' },
    { text:'压下心头的惊疑，悄然退走。~再看看吧。~', effects:{ flags:{ follow_wenyu:true }, rel:{ wenyu:2 } }, goto:'v2_07b' },
    { text:'服下隐息丹，靠近偷听。', cond:{ item:'yinxi_dan' }, effects:{ items:{ remove:{ yinxi_dan:1 } }, flags:{ eavesdrop_wenyu:true } }, goto:'v2_07b' }
  ]
};

  id: 'v2_07b', chapter: '卷二 · 风起云涌 · 第七章', title: '铁证',
  location: 'loc_linjiang',
  text:
'（无论你如何选择，你已确认了两件事：）\n\n**其一**，温如玉深夜出山，与血魔宗的人交换情报——他是内应，还是被胁迫？他递出玉简时手指稳得很，可转身时脚步却沉得像灌了铅。一个人若真在替魔道办事，何至于走出那副模样？\n\n**其二**，黑袍人提到了慕容昭——临江城慕容家家主，你退婚时的"体面人"。他在收集北漠残图，三片。\n\n~慕容昭……原来你也在局中。~\n\n你回到宗门，一夜未眠。桌上的残图碎片在烛火下泛着幽光——那是你从青蛟王巢穴中带出来的，如今只剩最后一片，就能拼出九渊的方位。烛花"啪"地爆了一下，你看着那枚碎片边缘焦黄的纹路，忽然想起夜探时慕容雪那声发颤的质问："残图到底用来做什么？"\n\n~她也不知道。~\n\n~那么，慕容昭在瞒着的，到底是什么？~',

  id: 'v2_07c', chapter: '卷二 · 风起云涌 · 第七章', title: '夜探慕容家',
  location: 'loc_shenjia',
  text:
'证据指向慕容昭，你决定夜探慕容家。\n\n三更天，你借着夜色翻过慕容家的院墙。廊下灯笼昏黄，把青砖照出一片一片的暗影；巡夜的护院打着哈欠走过，你贴着屋脊潜行，每一步都踩在瓦当的阴影里。夜风送来后院的一缕檀香，混着若有若无的药味——慕容家，比半年前更戒备了。\n\n书房里亮着灯。你掀开一片瓦，烛光从缝隙里漏出来，忽然听见压低的争执声——\n\n@慕容雪@「父亲！残图到底用来做什么？血魔宗的人为什么会在我们家！」\n\n她的声音发颤，带着压抑的怒意。你心头一动——退婚那日她清冷如霜，可此刻的声音里，分明带着一丝说不出的慌乱。\n\n@慕容昭@「雪儿，你不懂。这苍梧界的天要变了——慕容家要想活，就得站对位置。」\n\n@慕容雪@「站对位置？站到血魔宗那边去吗？！」\n\n书房里静了片刻，烛火"哔剥"一响。慕容昭的声音低了下去，像是卸下了什么伪装：\n\n@慕容昭@「……你以为，当年废沈家那小子灵根的「抽灵血祭」，是谁牵的头？」\n\n你浑身一僵，指节扣进瓦缝里。\n\n@慕容昭@「是宫里的那位。**大夏皇朝。**」\n\n~大夏皇朝……抽灵血祭……~ 你攥紧拳头，指甲刺进掌心，疼得发木。\n\n~三年前那个夜晚，站在我床前、腰间挂着骨牌的人……~\n\n~是宫里的人？~\n\n屋檐上，你一动不动，像一尊石像。夜风掠过，把你的影子吹成一片模糊的暗色。\n\n书房里，慕容雪没有再说话。过了很久，你听见她低低地问了一句，声音哑得不成样子：「父亲……那我们，还能回头吗？」\n\n回答她的，是长久的沉默。',

    { text:'在窗下又听了一会儿，直到书房灯灭。', effects:{ flags:{ eavesdrop_murong:true }, stats:{ xinjing:-5 } }, goto:'v2_08' }
  ]

S.v2_08 = {
  id: 'v2_08', chapter: '卷二 · 风起云涌 · 第八章', title: '东荒猎妖',
  location: 'loc_yaoshou',
  onEnter: { effects: { map: { unlock: ['loc_sanxiu'] } } },
  text:
'东荒，妖兽山脉。\n\n林深雾重，古木参天，枝桠交错得像一张张撑开的巨网，把天光滤成一缕一缕，漏下来的阳光在地上画出斑驳的光斑。远处传来兽吼，一声接一声，辨不清远近——在东荒，辨不清远近的兽吼，往往就意味着危险。\n\n这里是猎妖者的天堂，也是亡命徒的坟场。路边的枯树上挂着褪色的符纸，那是前人留下的警示；有人用刀在树干上刻了一行字，墨迹已旧：「三阶以下，勿入深处。」树根下还堆着几块被啃白的兽骨，不知是哪头妖兽的杰作。\n\n你握紧剑柄，踏入密林。空气中弥漫着兽腥与草木的气息，混着腐叶发酵的潮气，钻进鼻腔；脚下是厚厚的腐叶，每一步都踩出"吱嘎"的声响，惊起几只灰雀，扑棱棱飞走。有蛇形的影子在灌木丛里一闪而过，随即归于沉寂。\n\n树影深处，偶尔能看见猎妖者留下的篝火余烬，灰堆里还埋着没烧透的兽骨——有人来过，有人走了，也有人再没走出去。\n\n梧老的声音在镜中响起，带着几分提醒：「小子，东荒的规矩，别贪。猎几头落单的，换够灵石就回——深处那些大家伙，不是现在的你能惹的。」\n\n你点点头，脚步不停。林间忽然飘来一缕烟火气——前方不远，散修集市的轮廓在树影后若隐若现：搭着各色棚子，有人吆喝卖妖丹，有人蹲在地摊前挑拣兽骨，还有人神神秘秘地压低声音谈着什么买卖。你摸了摸腰间的兽核袋，盘算着待会儿换一笔灵石。',
  textVariants: [
    { cond:{ flag:'meet_bai_jiu' }, text:'一道雪白的身影忽然从树梢跃下，落在你肩上——是那只你从猎网中救下的幼狐。它歪着脑袋看你，琥珀色的眼睛里带着打量，随后跳向前方，回头冲你叫了一声，像是在说：跟我来。\n\n~这小家伙……是认出我了？~ 你看着它在林间腾挪的身影，鬼使神差地跟了上去。' },
    { cond:{ flag:'see_bai_jiu' }, text:'~你想起妖兽山脉外围那只被猎网困住的幼狐。当时你没有出手，那双琥珀色的眼睛，却在你心里记了很久。~ 你摇摇头，把杂念抛在脑后。' }
  ],
  choices: [
    { text:'猎一头落单的幽影豹，练练手。', effects:{ flags:{ hunt_leopard:true } }, goto:'v2_08b' },
    { text:'先采集几株灵草，填满行囊。', effects:{ items:{ add:{ bailing_cao:2, ling_huang_cao:1 } }, flags:{ gather_herb:true } }, goto:'v2_08c' },
    { text:'跟着白九走，看它要带你去哪。', cond:{ flag:'meet_bai_jiu' }, effects:{ rel:{ bai_jiu:0 }, flags:{ bai_jiu_follow:true } }, goto:'v2_08c' }
  ]

'（若你之前救过那只幼狐，或跟着它走了——）\n\n白九在前面蹦跳着引路，一直把你带到一处隐蔽的山洞。\n\n洞口被藤蔓遮得严严实实，拨开藤蔓，洞中竟有一汪灵泉——泉水清冽如镜，泛着淡淡的灵光，蒸腾的水汽里带着一丝若有若无的桂花香，沁人心脾。水面上浮着几片翠绿的灵叶，随着水波轻轻打转，像是这一方天地自成的小世界。\n\n白九在泉边停下，回头看你。它琥珀色的眼睛里，那种郑重的神色更浓了——像一只活了几百年的小狐狸，在做一件只做一次的决定。它的尾尖微微绷着，脊背挺得笔直，像一个即将把性命托付出去的人。\n\n它忽然低下头，用额头轻轻碰了碰你的手背。额头是凉的，可你分明感觉到，有什么东西顺着那道触碰，流进了你的血脉里——很轻，像一滴水落入湖面，却在心口漾开一圈一圈的暖意。\n\n~这是……认主？~\n\n梧老在镜中嘀咕，声音里带着难得的感慨：「九尾灵狐认主，一生一次。小子，你这运气，老夫都眼红——它这一拜，是把命交到你手里了。」\n\n白九抬起头，冲你叫了一声，尾巴轻轻扫过你的手腕——你手腕上，多了一枚淡金色的印记，转瞬隐入皮肤，只在月光下，隐约能看见一缕金纹，像一枚小小的印章，盖在了你的命上。\n\n灵泉的水面被夜风拂过，漾开一圈涟漪。白九跳到泉边，低下头，衔了一捧水，轻轻放在你脚边——那是它认主后的第一份"供奉"。',

  text:

  text:
'猎妖归来，日头西斜。你背着兽核袋，正要循原路出山——白九忽然停下，耳朵竖起，喉咙里发出低低的呜咽，背上的毛都炸了起来。\n\n你脚步一顿，手按剑柄。\n\n身后的灌木丛里，一双燃着火光眼睛正盯着你。一头火岩狮缓缓走出，鬃毛间跳动着细小的火苗，喉间的低吼震得地面微微发颤，热浪一阵一阵地扑过来。它的目光，落在你腰间的兽核袋上。\n\n~是闻着兽核味儿来的。~\n\n梧老的声音带着提醒：「火岩狮，四阶。要是它只是讨食……最好别结死仇。妖兽这东西，记仇。」',

};

/* ================= 第五章 · 身世之影 ================= */
S.v2_09 = {
  id: 'v2_09', chapter: '卷二 · 风起云涌 · 第九章', title: '身世之影',
  location: 'loc_xuanqing',
  onEnter: { effects: { flags: { wulao_awake: true } } },
  text:
'回到宗门，你在灯下摊开那半张残图。\n\n烛火跳了跳，把残图的纹路照得明明灭灭。它残缺不全——可即便如此，你也能看出，图中画的是**北漠**：一条蜿蜒的虚线穿过冰原，绕过一片用朱砂点过的山，直直指向一片被墨色涂抹的区域。旁边只有两个字，笔迹潦草，像是写的人手在发抖：\n\n~九渊。~\n\n你指尖沿着那条虚线缓缓划过，指尖能感觉到兽皮的毛糙与焦边——忽然停住，虚线的尽头，画着一枚小小的印记，像是……一枚镜子。\n\n你正看得出神，怀中的苍梧镜忽然剧烈震动起来！镜面泛起一层又一层的光纹，像水面被投入石子，一圈一圈荡开，烫得你胸口发紧。\n\n一道久违的声音在你脑海中炸开，虚弱却清晰：\n\n#梧老#「……小子……」\n\n你心头一震：「前辈！你醒了！」\n\n#梧老#「做了个很长的梦……梦见一柄剑，断了……梦见九渊下面……那个东西……它在动……」他顿了顿，声音发涩，像锈蚀的铁器在摩擦，「小子……你听着……**封印撑不了太久了。**」\n\n镜光明灭，他又昏沉过去，最后含糊地嘟囔了一句：\n\n#梧老#「……那枚印记……老夫好像……见过……」\n\n你握着古镜，指节发白，看着残图上那枚镜形印记，久久没有动。烛火在风里晃了晃，把你的影子投在墙上，像一个沉默的问号。\n\n~梧老说封印撑不了太久——可他还说，那枚印记他见过。~\n\n~一枚画在九渊方位旁的印记，一枚刻在苍梧镜上的印记。~\n\n~这两者之间，到底连着什么？~\n\n第二日，一封信送到你手上——沈家的家书，父亲的字迹，却只有短短一行，墨迹被水渍晕开过：\n\n~「母病重，速归。」~\n\n你盯着那行字，水渍洇开的边缘，像一道干涸的泪痕。',
  textVariants: [
    { cond:{ flag:'wulao_sleep' }, text:'#梧老#「……小子……老夫睡了多久？」他的声音比记忆中更虚，像一缕随时会散的风。' },
    { cond:{ flag:'beat_qingjiao_wang' }, text:'#梧老#「……小子，老夫只是打了个盹。你在秘境里斩杀那条蛟龙的手段，老夫瞧见了——有几分意思。」' },
    { cond: function(s){ return !s.flags.wulao_sleep && !s.flags.beat_qingjiao_wang; }, text:'#梧老#「……这一觉，老夫睡得不安稳。那枚印记……太眼熟了。」' },
    { cond:{ flag:'map_part3' }, text:'~三片残图，终于拼齐。~ 拼好的图面上，那条虚线完整地穿过冰原，直指九渊——那枚镜形印记，在完整的轮廓里清晰可见，像一枚印章，盖在封印之上。' },
    { cond: function(s){ return !s.flags.map_part3; }, text:'~残图还缺一角。~ 你盯着那个缺口，心里记下了：还有一片，流落在外。' }
  ],
  choices: [
    { text:'先回家看娘。', effects:{ flags:{ go_home:true }, rel:{ shen_mu:10 } }, goto:'v2_09c' },
    { text:'先查九渊的方位。~娘……等我。~', effects:{ temper:{ gongli:1 }, flags:{ go_jiuyuan:true } }, goto:'v2_09c' },
    { text:'两头兼顾——先托白芷去沈家看诊，自己查九渊。', effects:{ rel:{ baizhi:6 }, flags:{ both_sides:true } }, goto:'v2_09c' }
  ]
};

S.v2_09c = {
  id: 'v2_09c', chapter: '卷二 · 风起云涌 · 第九章', title: '梧老深谈',
  location: 'loc_xuanqing',
  text:
'梧老苏醒后的第二夜，你在院中与他深谈。\n\n月光如水，梧老的镜光在黑暗中明明灭灭，像一盏将熄的灯。他断断续续地拼凑着记忆，语速很慢，每一个字都像从很深的地方捞出来的：\n\n#梧老#「苍梧……那个家伙，是个疯子。他把自己炼成了钥匙——用血脉当锁芯。」\n\n他顿了顿，镜光暗了一瞬，声音低下去：\n\n#梧老#「小子，你体内那缕血脉……有他的味道。**抽灵血祭，抽的不是灵根，是血脉。**」\n\n~抽的不是灵根……是血脉。~\n\n你猛地想起三年前那个夜晚——床前那道看不清脸的身影，腰间那枚泛着冷光的骨牌。原来那场"意外"要的从来不是你的灵根，是你体内那缕被封印的血脉。\n\n夜风穿过院子，梧桐的影子在地上摇晃，像一只张开的巨手。你久久没有说话，掌心却慢慢攥紧了那面古镜——镜面微温，仿佛在回应你的心跳。\n\n#梧老#「小子……老夫记不全了。可有一件事，老夫记得清楚——」他低声道，「那枚印记，苍梧的剑上，也有。」\n\n月光落进镜面，像落进一口深井。你低头，看着镜底那缕若有若无的金纹，忽然觉得，这面镜子，比你想象的更沉。\n\n#梧老#（良久）「小子……老夫跟你说这些，不是要吓你。是想告诉你——那面镜子既然认了你，你就得担得起它。」他顿了顿，声音低下去，「等哪一天，老夫把什么都想起来了……再告诉你，苍梧那个疯子，到底做了什么。」',
  choices: [
    { text:'「那我……是苍梧仙帝的后人？」', effects:{ flags:{ ask_heir:true }, rel:{ wulao:4 } }, goto:'v2_09d' },
    { text:'沉默很久，才开口：「所以我才活该被换掉灵根？」', effects:{ stats:{ xinjing:-5 }, flags:{ ask_bitter:true } }, goto:'v2_09d' },
    { text:'「前辈，你记得那枚骨牌吗？刻着乌鸦的那种。」', effects:{ flags:{ ask_bone:true }, rel:{ wulao:5 } }, goto:'v2_09d' }
  ]
};

S.v2_09d = {
  id: 'v2_09d', chapter: '卷二 · 风起云涌 · 第九章', title: '白九寻图',
  location: 'loc_xuanqing',
  text:
'夜里，你正对着残图出神，白九忽然从窗台上跳下来，凑到残图边，鼻尖抽了抽，然后咬住你的衣角，往外拽，尾巴急急地晃着。\n\n你愣了一下：「白九？你要带我去哪儿？」\n\n它"嘤"了一声，松口，跳到院墙上，回头看你，月光下那双琥珀色的眼睛亮得像两颗小灯。\n\n你收起残图，跟了上去。\n\n白九在夜色里穿行如电，一路把你带到了宗门后山的一片竹林深处。夜露把竹叶洗得发亮，风过时"沙沙"作响。它在一棵老竹下停下，用爪子刨了刨地面——土里，埋着一块焦黄的兽皮，边角残缺，与你的残图如出一辙。\n\n~北漠残图的碎片……怎么会埋在这里？~\n\n白九蹲在一旁，尾巴轻轻晃着，琥珀色的眼睛里带着一点"求表扬"的神色，还得意地"嘤"了一声。\n\n你拿起那块兽皮，借着月光端详。边缘的焦痕、纸面的纹路——与青蛟王巢穴里那块如出一辙，像是出自同一卷图。\n\n~三片残图，凑齐了两片。最后一片，在白九的鼻子底下找到了答案。~\n\n~而这竹林深处，又埋着谁的手笔？~\n\n你收好兽皮，正要转身，白九却忽然竖起耳朵，冲着竹林深处低低呜咽了一声——那里雾蒙蒙的，什么也看不清。你凝神看了半晌，终究没有追进去，只是把那个方向，记在了心里。',
  choices: [
    { text:'收下碎片，摸摸白九的头：「好样的。」', effects:{ rel:{ bai_jiu:8 }, flags:{ map_part3:true, bai_jiu_find:true } }, goto:'v2_09e' },
    { text:'「你是怎么发现的？」（白九歪着头，一脸无辜）', effects:{ rel:{ bai_jiu:5 }, flags:{ ask_bai_jiu:true } }, goto:'v2_09e' },
    { text:'记下这个地方，把碎片收好。', effects:{ flags:{ map_part3:true, note_spot:true } }, goto:'v2_09e' }
  ]
};

S.v2_09e = {
  id: 'v2_09e', chapter: '卷二 · 风起云涌 · 第九章', title: '归家',
  location: 'loc_linjiang',
  text:
'家书上的那行字，像一根刺，扎在你心里拔不出来。你收拾好残图与古镜，星夜兼程，赶回临江城。',
  textVariants: [
    { cond: function(s){ return s.flags.origin === 'noble'; }, text:'沈家正堂的灯火，比记忆里暗了许多。\n\n你踏进内院时，父亲沈伯渊正坐在廊下，手里攥着一封信，信纸已经被他捏得起了毛边。他看见你，怔了半晌，才哑着嗓子说："回来了……回来就好。"\n\n母亲的病榻上，她瘦了许多，颧骨都支棱起来，可看见你的那一刻，眼睛却亮了一下。她挣扎着坐起来，握住你的手，指尖冰凉："儿啊……娘没事，就是老毛病……你爹非要写信惊动你。"\n\n她说着，却从枕下摸出一枚半残的玉佩，塞进你手心："这是你祖父留下的，说与你的命有关。娘一直替你收着——如今你大了，该交给你了。"\n\n玉佩入手微温。你翻过背面——一道细纹，蜿蜒如龙蛇，隐约能看出……一枚镜形印记。\n\n~与残图上那枚印记，一模一样。~\n\n你握着那枚带着镜形印记的玉佩，指尖发凉。梧老在镜中沉默了很久，才低声道：「……小子，血脉为引。这话，不是随便说说的。」\n\n~九渊的封印、苍梧的印记、被抽走的血脉……~\n\n~所有的线，都指向同一个地方。~\n\n你在家中逗留了两日。母亲的病在白芷托人送来的丹药调理下见了好转，你悬着的心，稍稍放下。可夜深人静时，那枚印记总在你眼前晃——像一扇半掩的门，等你推开。' },
    { cond: function(s){ return s.flags.origin === 'poor'; }, text:'青州乡下，三间茅屋缩在薄雾里，屋脊上的霜比记忆里更厚了。\n\n你娘倚在门框上，披着那件洗得发白的旧袄，看见你，先是一愣，随即红了眼眶，别过脸去擦眼角："儿啊……你怎么回来了？修仙的人，不是不能随便下山的吗……"\n\n她的咳疾比走时更重了，说话时喉间带着呼噜呼噜的痰音。你跪在床边，她握住你的手，半晌，才从枕头底下摸出一块叠得整整齐齐的旧帕子："你爹当年从北漠带回来的……娘一直没舍得动。你看看，这上面绣的东西，是不是跟你怀里那面镜子有点像？"\n\n帕子旧得发黄，边角磨出了毛边，帕心却绣着一枚小小的印记——云纹缠绕，中间是一枚镜形。针脚细密，像是绣的人花了很大的心思。\n\n~北漠……镜形印记……~\n\n~爹，你到底在北漠，见过什么？~\n\n你握着那块旧帕子，指尖发凉。梧老在镜中沉默了很久，才低声道：「……小子，血脉为引。这话，不是随便说说的。」\n\n~九渊的封印、苍梧的印记、被抽走的血脉……~\n\n~所有的线，都指向同一个地方。~\n\n你在家中逗留了两日。娘的咳疾在白芷托人送来的丹药调理下见了好转，你悬着的心，稍稍放下。可夜深人静时，那枚印记总在你眼前晃——像一扇半掩的门，等你推开。' },
    { cond: function(s){ return s.flags.origin === 'merchant'; }, text:'万金商会，朱漆大门依旧气派，门前的石狮子却被磨得圆润了几分。\n\n你爹万金听说你回来，三步并作两步迎出来，脸上的褶子都笑开了花："儿啊！可算回来了！娘想你都想病了——"他说着，眼眶就红了，又赶紧别过头去，招呼下人："快，去请大夫！"\n\n母亲的病榻前，她拉着你的手，絮絮叨叨说了半天家常，末了，从妆奁最底层取出一块蒙尘的玉牌："这是你爹当年收当收来的死当——当主再没来赎过。娘觉得这玉纹古怪，一直收着，你如今修行了，看看认不认得。"\n\n玉牌入手温凉，蒙尘之下，隐隐刻着一枚镜形印记，纹路与苍梧镜上的如出一辙。\n\n~死当……无人认领的镜子印记……~\n\n~这天下，到底还有多少这样的东西，散落在人间？~\n\n你握着那块玉牌，指尖发凉。梧老在镜中沉默了很久，才低声道：「……小子，血脉为引。这话，不是随便说说的。」\n\n~九渊的封印、苍梧的印记、被抽走的血脉……~\n\n~所有的线，都指向同一个地方。~\n\n你在家中逗留了两日。母亲的病在白芷托人送来的丹药调理下见了好转，你悬着的心，稍稍放下。可夜深人静时，那枚印记总在你眼前晃——像一扇半掩的门，等你推开。' },
    { cond: function(s){ return s.flags.origin === 'demon'; }, text:'青州边陲，山神庙。\n\n大雪已经化了，庙顶的破瓦露着天光。养父的坟头，比你去岁时高了一截——有人来过，添了新土，坟前还放着一块半残的玉佩，和一炷未燃尽的香。\n\n香灰还是温的。\n\n你蹲下身，拾起那枚玉佩——入手微温，翻过背面，一道细纹蜿蜒如龙蛇，隐约是一枚镜形印记。\n\n~与那封染血的信上，落款的印记一模一样。~\n\n~有人知道你会回来。~\n\n~而那个人，认得这枚印记。~\n\n山风穿过破庙，吹动神像上残破的帷幔。你握着玉佩，跪在坟前，磕了三个头："爹，我回来了。"\n\n你握着那枚玉佩，指尖发凉。梧老在镜中沉默了很久，才低声道：「……小子，血脉为引。这话，不是随便说说的。」\n\n~九渊的封印、苍梧的印记、被抽走的血脉……~\n\n~所有的线，都指向同一个地方。~\n\n你在山神庙里又待了一夜，替养父守了一夜的长明灯。天明时，你把那枚玉佩贴身收好，折返回程。可一路上，那枚印记总在你眼前晃——像一扇半掩的门，等你推开。' }

  id: 'v2_10d', chapter: '卷二 · 风起云涌 · 第十章', title: '决赛前夜',
  location: 'loc_xuanqing',
  text:
'决赛前夜，你回到宗门。\n\n山门前的桂花已经落尽了，演武场上，彩绸重新挂了起来——宗门没有因为边陲的血而停下，反而比从前更安静、更硬气。各峰弟子都在备战，有人连夜磨剑，有人围着执事长老问决赛的规矩，空气里绷着一根看不见的弦。\n\n你盘膝坐在院中调息，忽然，一阵脚步声停在院门外——是邢烈。他提着一壶酒，倚着门框，冲你扬了扬下巴：\n\n@邢烈@「兄弟，明天那场，赢了请俺喝酒！」\n\n你笑着应了。他走后，师父柳长风在晨雾里远远地看了你一眼，没有说教，只留下一句：「稳着点。」\n\n夜深了。你正要睡下，梧老的声音忽然在镜中响起，带着一丝少见的凝重：\n\n#梧老#「小子……明天，怕是要出事。血无极那老东西，盯上这面镜子不是一天两天了——决赛，正是人多眼杂的时候。」\n\n你握着古镜，指尖微凉。月光落在镜面上，映出你沉静的眉眼。\n\n~来吧。~\n\n~该来的，总会来。~',
  choices: [
    { text:'把剑擦到锃亮，静待天明。', effects:{ flags:{ sword_ready:true } }, goto:'v2_10' },
    { text:'去找温如玉下一盘棋，试探他的态度。', effects:{ flags:{ chess_wenyu:true }, rel:{ wenyu:3 } }, goto:'v2_10' },
    { text:'独自练剑到天明，让雷光劈开夜色。', effects:{ stats:{ xiwei:150 }, flags:{ night_sword2:true } }, goto:'v2_10' }
  ]
};

/* ================= 第六章 · 决赛劫场 ================= */
S.v2_10 = {
  id: 'v2_10', chapter: '卷二 · 风起云涌 · 第十章', title: '决赛·劫场',
  location: 'loc_xuanqing',
  text:
'宗门大比的决赛日，本该是青州最热闹的日子。\n\n天还没亮，山门前就挤满了人——各峰弟子、看热闹的散修、还有临江城、苍梧城特意赶来的世家子弟，把擂台围得水泄不通。彩绸挂满了擂台四角，在风里猎猎作响。看台上，几位长老正襟危坐，孙伯符还揣着一把瓜子，磕得咔嚓作响。\n\n你站在擂台上，对面是一个沉默的锦衣少年。\n\n没人知道他叫什么，也没人知道他从哪里来。他只用了三场，就一路打进了决赛——每一场，对手都败得莫名其妙，像是被人抽走了力气。他使一柄通体漆黑的刀，刀身泛着不详的暗红，像凝固的血。\n\n梧老的声音从镜中传来，带着警惕：「小子，小心。那刀……是血魔宗的东西。这少年，怕是被人喂了东西——你看他的眼睛。」\n\n你顺着看过去。那少年低着头，可你分明看见，他眼底有一丝极淡的红光，一闪而过，像两点将熄未熄的炭。\n\n锣响。\n\n那少年拔刀，刀气漆黑如墨，卷着腥风——他的招式像不要命一样，招招以伤换伤，刀刀直取要害。看台上有人倒吸冷气，有人捂住了嘴。\n\n你紧握剑柄，站在擂台中央。看台上，柳长风微微颔首，眼里有光；朱尘抱着胳膊，眉头微皱；苏小满攥着拳，指甲掐进掌心，嘴唇抿得发白。\n\n你凝神，雷光在剑锋炸开，电弧噼啪作响。\n\n~这一战，不是切磋。是有人……想要我的命。~\n\n~那就来吧。~\n\n你抢先出剑，雷光如龙，撞向那片墨色！',
  choices: [
    { text:'速战速决，以雷霆之势破他刀势。', effects:{ flags:{ rush_final:true } }, goto:'v2_10b' },
    { text:'以守为攻，消耗他的血气。', effects:{ temper:{ gongli:1 }, flags:{ guard_final:true } }, goto:'v2_10b' }
  ]
};

'决赛风波后，你与白芷合力，解了那魔刀少年体内的控心丹。\n\n少年醒来时，眼底的血光已经散尽，露出两张稚嫩而茫然的眼睛。他看起来不过十五六岁，瘦得皮包骨，手腕上的青筋根根分明。\n\n@少年@「我……我在哪？」他愣了很久，忽然想起什么，猛地抓住你的衣袖，声音发颤，「他们……他们在苍梧城地下……有个据点……专门关我们这样的人……喂丹、试刀……」\n\n他的指尖攥得死紧，像是溺水的人抓住浮木。白芷替他诊了脉，低声对你说：「他体内的丹毒积了很久，怕是……活不过三年了。」\n\n少年没听见这句话。他低着头，攥着自己的衣角，小声说：「……我想回家。」\n\n~回家。~ 你看着他那双瘦得凹下去的眼睛，忽然想起边陲废墟里那个抱碗的孩童。\n\n你沉默了很久。',

/* ================= 第七章 · 师父之伤 ================= */
S.v2_11 = {
  id: 'v2_11', chapter: '卷二 · 风起云涌 · 第十一章', title: '师父之伤',
  location: 'loc_xuanqing',
  text:
'你把少年交给白芷照料，刚收剑回鞘，变故骤生——\n\n一道血影从天而降，滔天血气席卷整个广场！看台上的弟子像被割倒的麦子一样掀飞出去，惨叫声此起彼伏。彩绸被气浪撕碎，漫天飞舞，像一场猩红的雪。\n\n一个赤发老者立在擂台中央，周身血气翻涌如海，脚下的青石寸寸龟裂，裂痕像蛛网一样蔓延开去。他赤着半身，胸口纹着一头狰狞的血兽，随着他的呼吸，那血兽仿佛也在起伏，仿佛下一秒就要活过来。\n\n**血魔宗长老，血无极。**\n\n他居高临下地看着你，目光像在看一只蝼蚁：「苍梧镜，交出来。」\n\n话音未落，他抬手——动作很慢，像在掸去一粒灰尘——一道血色掌印却已凝聚成型，携着滔天威压，朝你当头拍下！\n\n空气被挤压得发出尖锐的啸声，你脚下的青石寸寸下陷。你浑身僵硬，雷灵力在经脉中疯狂奔涌，却像被什么死死压住，连指尖都动弹不得——筑基与元婴之间的差距，像一道天堑，横亘在你眼前。\n\n一道白影，横空掠来，挡在你身前！\n\n**"噗——"**\n\n柳长风的长剑寸寸断裂，碎片四溅，像碎掉的月光。血雾炸开，染红了漫天飘落的彩绸。他整个人像断线的风筝，向后飞出，重重砸在你怀里。\n\n温热的血，浸透了你的衣襟。\n\n他咳着血，却还在笑，声音断断续续：\n\n@柳长风@「剑者……心也……别让……别让剑心蒙尘……走……！」\n\n他旧伤复发，胸口的血迹迅速洇开，像一朵盛开的花。他缓缓闭上眼，气息越来越弱。\n\n你抱着他，指尖发抖。全场死寂，只有风声呜咽。血无极冷笑一声，正要再出手——\n\n温如玉的声音忽然响起，带着一种从未有过的决然：「血无极！你敢在玄清宗撒野——」\n\n一道剑光，破空而起。\n\n那剑光很细，却快得像一道闪电，直取血无极面门。血无极眉头一皱，挥袖挡开，动作终于有了一瞬的停滞——就是这一瞬，人群炸开，四散奔逃。\n\n你趁乱背起师父，往山门方向掠去。身后，血无极的冷笑声像刀子一样追着你的后背：「跑吧，小老鼠。带着那面镜子——跑得越远越好。」\n\n~元婴……~\n\n~方才那一掌的威压，压得你连剑都抬不起来。~\n\n~可这笔账，我记下了。~',
  choices: [
    { text:'抱起师父，趁乱撤离。~这笔账，我记下了。~', effects:{ temper:{ henla:1 }, flags:{ flee_with_master:true } }, goto:'v2_11b' },
    { text:'放下师父，拔剑对向血无极：「你伤我师父，我要你的命。」', danger:true, effects:{ temper:{ xiayi:1 }, flags:{ face_xuewuji:true } }, goto:'v2_11b' }
  ]
};

  text:

  location: 'loc_qingyunshan',
  text:
'逼退黑莲后，你背着师父跌跌撞撞地逃入一处山谷。\n\n谷中草木荒芜，枯藤爬满岩壁，却藏着一座废弃的洞府。石门半掩，积灰寸厚，洞壁上的阵法纹路早已暗淡——显然荒废了不知多少年。你把石门推开一道缝，灰尘簌簌而落，呛得你咳了两声。\n\n你小心翼翼地把师父安置在洞府深处一块干燥的青石上，喂他服下疗骨丹。他的呼吸渐渐平稳下来，你悬着的心，稍稍放下。\n\n这时你才注意到，洞府中央有一座干涸的灵池。池底残留着一汪金色的液体，只有浅浅一滩，正散发着浓郁得惊人的灵气——灵气稠得几乎化不开，吸入一口，丹田都跟着发热，连空气都像是镀了一层淡金。\n\n洞壁上，有人刻着几行字，笔迹苍劲：\n\n~「老夫于此池凝丹，坐关一甲子。后辈若见，此乃机缘——然，凝丹如渡劫，心不诚者，慎入。」~\n\n~前人遗泽……金丹之机！~\n\n你盘膝坐在那汪金液旁，膝盖触到冰凉的池底，灵气顺着双腿渗入经脉，酥麻一片。梧老的声音在脑海中响起，虚弱却郑重：\n\n#梧老#「小子……这是凝液成丹的机缘。但你的心……你的心现在太乱了。」\n\n他顿了顿：「**金丹者，道心之果。你的道，是什么？**」\n\n灵气涌入体内，幻象再次降临——\n\n这一回，你看见的是：退婚的屈辱、母亲的白发、师父喷出的血、温如玉递出的玉简、边陲废墟里那个抱碗的孩童、邢烈转身迎向追兵的背影……\n\n一幅一幅，像走马灯一样碾过你的心口。\n\n最后定格的，是残图上那枚镜形印记，在烛火里明明灭灭，像一只半睁的眼睛，静静地看着你。\n\n~三年了。从退婚那夜起，我走的每一步，都在回答同一个问题——我是谁，我要成为谁。~\n\n~而答案，从来不在别人的嘴里。~\n\n幻象散尽，金液的光在你的眼底缓缓沉淀。你低头看着自己的手——三年前，这双手连聚气丹都炼不出来；如今，它握着剑，背着师父，走过废墟与血夜。\n\n~这双手要握住的，从来不是别人给的答案。~\n\n~是我自己选的。~\n\n**道心之问，三选其一。**',
  choices: [
    { text:'「我的道，是守护——护我所爱之人，再不让任何人死在我面前。」', effects:{ temper:{ xiayi:1 }, setRealm:12, flags:{ dao_guard:true } }, goto:'v2_13' },
    { text:'「我的道，是变强——强到让所有人，都付出代价。」', effects:{ temper:{ henla:1 }, setRealm:12, stats:{ atkBonus:3 }, flags:{ dao_power:true } }, goto:'v2_13' },
    { text:'「我的道……是她。」（情劫）', effects:{ setRealm:12, stats:{ xinjing:15 }, flags:{ dao_love:true } }, goto:'v2_13' }
  ]
};

'定情翌日的黄昏，你回到临时的住处，推门时，一枚黑玉棋子"当啷"一声滚到脚边——是温如玉的棋子。\n\n棋子上缠着一缕红线，线头系着一卷极细的纸条。你展开，纸条上的字极小，却一笔一划，写得极稳：\n\n~「宗门有眼线。血无极在找九渊的钥匙——他们以为钥匙是镜子。别信任何人。」~\n\n你捏着那枚棋子，指尖发凉。\n\n想起那夜他递出玉简的背影，想起他说的"棋子还是下棋的人"，想起他在血无极掌下拔剑的决然——这个人，到底在下一盘什么棋？\n\n梧老难得开口，声音里带着一丝琢磨：「……这小子，话里有话。棋子是真的，递出去的东西也是真的——可棋子的方向，未必是他自己要去的方向。」\n\n~如果连温如玉递出去的玉简都是假的……那真的，又在哪里？~\n\n你收好棋子。天色将暮，宗门的方向传来晚课的钟声，一声一声，像在催促什么。',

  location: 'loc_xuanqing',

  text:
'三日后，你带着重伤的师父回到宗门。\n\n山门依旧，可空气里还残留着焦糊与血腥的气息，混着经久不散的药味。广场上，弟子们沉默地搬运着碎石，有人手臂上缠着渗血的绷带，有人跪在阵亡同门的灵位前，久久不起。灵前的香火在风里明明灭灭，像无数双不肯闭上的眼睛。\n\n血无极那一掌，让玄清宗元气大伤。\n\n可活下来的人，眼神却比从前更硬了——擦药的弟子咬着牙不吭声，抬石头的弟子把腰挺得笔直。\n\n苏小满远远看见你，跑过来，张了张嘴，却什么也没说，只是把一枚温热的平安结塞进你手里——和你剑柄上那枚一模一样，只是新编的，红绳还泛着亮。她转身跑开，衣角消失在回廊拐角。\n\n执事长老红着眼眶找到你，声音沙哑：「{name}……宗门上下，等你一句话。」\n\n他展开一张地图，上面用朱笔标注着血魔宗的动向——红色的箭头，像一道道淌血的伤口，正一步步逼近青州。\n\n你站在地图前。身后是满身伤痕的同门，怀中是沉睡的梧老，心底是那个抱碗孩童空洞的眼神，还有慕容昭那句"是宫里的那位"。风从窗外灌进来，烛火摇曳，把你的影子拉得很长很长。\n\n你伸手，指尖按在九渊的方向。\n\n身后忽然传来脚步声——邢烈回来了。他肩上搭着外袍，衣襟上还带着干涸的血迹，却咧嘴一笑，把一壶酒拍在你面前：「兄弟，活着回来了。酒，爷爷带来了。」\n\n你接过酒壶，灌了一口——辣的，呛得人眼眶发热。\n\n~有兄弟，有家，有要护的人。~\n\n~这苍梧界的天，塌不下来。~\n\n**—— 卷二 · 终章抉择 ——**',

  text:'你回到玄清宗，与同门一起重建山门，厉兵秣马。\n\n被血无极震裂的青石被一块一块换掉，折断的旗杆重新立起来，彩绸换成了素白的练功服——宗门没有垮，只是把每一分力气都拧成了一股绳。你把剑柄上的平安结重新系紧，在晨钟里站了很久。\n\n师父的伤势在慢慢好转，白芷每日来换药，说他是"命硬的人"。邢烈托人捎来一句口信，歪歪扭扭五个字：「酒已备好，速归。」\n\n清晨，你在山门前练剑。剑气掠过石阶，惊起几只山雀。有路过的弟子停下脚步，朝你拱了拱手，什么也没说，又继续去搬砖石了。\n\n你望着那些沉默的背影，收剑入鞘。\n\n~家，还在。~\n\n**—— 卷二 · 风起云涌 · 完 ——**',

<script>

g.GameData.lore = {
  items: {
    juqi_dan: '炼气期修士最常用的修行丹药。以百灵草为主药、辅以一阶兽核凝练而成，药性温和，久服不伤根基。坊间流传：当年苍梧仙帝未成道时，也曾靠着聚气丹一粒一粒攒出筑基的根基。',
    juqi_dan_jp: '丹纹隐现、丹香凝而不散的一品极品。同一炉药材，只有火候分毫不差、运气也恰到好处时，才能凝出这等丹纹。丹师们说，能炼出极品丹的炉子，连炉灰都是香的。',
    bigu_dan: '一粒可抵一月饮食，游历者必备。味道寡淡，形如黄豆，却不知让多少赶路的修士免于饿死途中。有人笑称：辟谷丹是修真界最没排面、也最救命的东西。',
    xingshen_wan: '以醒神草炼制的清心小丸，炼气修士熬夜修炼后含一粒，能压住翻涌的杂念。味道极苦，苦到让人清醒——老修士说，苦，才是修行的本味。',
    huichun_dan: '二品疗伤圣药，入口微苦，回味甘甜。伤重时含一粒，能吊住一口气。医家言：回春丹救的是身，救不了心——可有时候，能救身，就已经是天大的恩德了。',
    cuidi_dan: '二品淬体丹药，服后浑身如遭锤击，筋骨发麻。但熬过去，肉身便硬一分。体修弟子们常互相打趣：挨过淬体丹的疼，才配说自己练过体。',
    ningqi_dan: '凝气丹，二品丹药中的"硬通货"。药力敦厚，一枚下肚，丹田里便多三分底气。坊市里论瓶买卖，散修们攒上半年的灵石，才舍得买一瓶。',
    jiedu_dan: '可解百毒的丹丸，是行走南疆瘴气林的保命符。但老医师总爱补一句：解得了毒，解不了人心。',
    guiyuan_dan: '三品归元丹，平复心绪、安神定魄。炼丹时需在月圆夜取子时露水，火候要文火慢炖三个时辰——急不得，也躁不得。',
    yanghun_dan: '温养神魂的三品丹药，对悟性有奇效。药力入体如涓涓细流，能抚平识海的波澜。传闻上古丹师以自身神魂养丹，才有了这等奇效。',
    pozhan_dan: '三品突破辅助丹药，只在突破大境界时服用。药力霸道，能短暂撕裂境界壁障——但也正因霸道，根基不稳者服之，反受其害。老丹师常说：丹是死的，人是活的。',
    pozhan_dan_jp: '丹香满室、紫气内蕴的三品极品。据说炼制此丹，需在雷雨夜开炉，借天雷之力凝丹。百年难出一枚，一旦出现，足以让一座宗门为其争破头。',
    huxin_dan: '护心丹，危急时刻含一粒，能护住心脉一线生机。丹如其名，护的是心——可有些伤，不在心上，在心外。',
    zhuji_dan: '四品筑基丹，一粒定乾坤的传说级丹药。筑基是修士的第一道大坎，多少天才折在这道坎上。丹方早已失传大半，如今能炼筑基丹的丹师，屈指可数。',
    xisui_dan: '四品洗髓丹，洗筋伐髓、脱胎换骨。药力霸道，服用时如万蚁噬骨，熬过去便是新生。体修们称它为"第二次投胎"。',
    lingzhi: '百年灵芝，药力醇厚，可炼丹、可入药、可赠人。生长于灵气充沛之地，常被妖兽守护。凡俗间有人以百年灵芝吊命，修真界里，它不过是一味寻常灵材——同物不同命，大抵如此。',
    qingfeng_jian: '百炼精钢所铸的灵器长剑，剑锋清亮，吹毛断发。玄清宗炼器堂每月出产一批，是内门弟子的入门标配。剑身上刻着一行小字：剑者，心也。',
    xuantie_jia: '玄铁打制的灵器护甲，厚重坚固。铁匠说，好甲要千锤百炼——可这世上，又有多少人经得起千锤百炼呢？',
    juling_yupei: '宝器级灵佩，佩之灵气汇聚，修炼事半功倍。万宝阁的镇店之宝之一，传闻是百年前一位金丹修士为报恩所铸，玉中封存着一缕聚灵阵纹。',
    huoyan_ling: '蕴含爆裂火灵的一次性符箓，符纸赤红如血。画符时须以火系灵兽的精血调朱砂，笔走龙蛇间，仿佛能听见火灵在纸上游走。',
    mizong_fu: '迷踪符，捏碎即可遁走。保命之物，却也是身份的象征——能用得起宝符的修士，多少都有几分家底。',
    tiancan_ruanjia: '天蚕丝织就的宝器软甲，轻薄如无物，却能挡下金丹修士的一击。天蚕百年吐一次丝，一件软甲，耗尽了整整一代养蚕人的心血。',
    qiankun_dai: '内藏乾坤的宝袋，看着只有巴掌大，却能装下半个仓库。修士行走江湖，腰间挂一个乾坤袋，才算真正"上了道"。',
    cangwu_jing: '上古仙器「苍梧镜」的残片所化，内寄残魂梧老。镜面斑驳，却能在月圆之夜泛起幽光。传闻仙帝以镜镇魔，镜碎人间——你手中的这一片，或许是这苍梧界最后的钥匙。',
    wuming_cantu: '半张泛黄的残图，隐约指向北漠。图的边角焦黑，像是被火烧过，又像是被血浸过。残图上只有两个字看得真切：九渊。',
    ranxue_xinjian: '一封染血的信，字迹潦草，落款处只有一个模糊的印记。血已经发黑，纸张发脆，可那字里的急切，隔着岁月依然灼人。',
    chuanjia_jiuyu: '一枚温润的旧玉，据说是祖上传下来的。玉身有一条细细的裂纹，像一道旧伤——老人们说，这玉护过三代人。',
    qingjiao_ni: '青蛟王的逆鳞，蕴含一丝蛟龙真意。炼入法器，可添三分龙威；贴身收藏，能镇心魔。传闻蛟龙百年才长一片逆鳞——这一片，等了它三百年。',
    lei_ji_mu: '被天雷击中的古木，木质焦黑，内里却蕴着一缕雷灵。雷灵根修士梦寐以求的炼器材料，价值连城。',
    zhu_sha: '画符必备的灵砂，朱红如血。符修们说，一笔朱砂，定的是符的魂——手抖一分，符便废一分。',
    lingcha: '以灵泉水冲泡的茶叶，清冽回甘。修真界最寻常的待客之物，上至宗门长老，下至坊市小贩，都喝得起。可恰恰是这寻常之物，最能看出一个人的性情——急的人，喝不出它的回甘。',
    tanghulu: '裹着糖衣的山楂串，甜得发亮。苍梧城张伯的手艺，糖要熬到金黄，山楂要挑八分熟的。小满最爱吃这个，说甜得能让人忘掉所有烦心事。',
    nanhai_mingzhu: '南海深处采得的明珠，价值连城，通体莹润，夜里能发出柔和的光。传闻南海龙宫中有一种灵蚌，百年方育一珠——这一枚，也不知是从哪头老蚌肚子里剖出来的。',
    tongmai_san: '通脉散，疏通经脉、辅助小境界突破的常备药。药力温和，炼气弟子突破小境界前含一撮，能少疼几分。老散修们说：通脉散不值钱，可每一枚，都是一条熬过来的路。',
    zhixue_san: '外伤止血的药粉，敷上即止。猎妖人怀里常备，价比干粮还低，却是他们最信得过的伙伴——伤口能止血，命就还在。',
    qingxin_lu: '晨露与清心草炼成的药露，一小瓶能顶一夜的烦躁。修士心境不稳时滴两滴，清凉直透识海。药铺老板常说：心静不下来的时候，喝什么都没用——除了它。',
    guben_dan: '固本培元的丹药，药力内敛，不温不火。适合打基础，却不适合急功近利的人。老丹师有句话：根基不牢，服再多丹也是虚的。',
    peiyuan_san: '滋养元气的药散，色如细雪，入口即化。是体虚之人的补品，也是重伤后的第一碗"粥"。',
    mingmu_shui: '滴眼明目的药水，凉丝丝的。常年在雾里、夜里行走的修士最宝贝它——看得清，才活得久。',
    huoluo_dan: '活血通络的小丹丸，练功练到筋骨发僵时来一枚，通体舒泰。武师们拿它当瓜子嗑，边嗑边吹牛。',
    quchong_san: '驱虫药粉，洒在营地四周，蛇虫鼠蚁避之不及。气味刺鼻，可进山的人都知道：这味儿难闻，好闻的坟头草都比你高了。',
    yexing_wan: '夜行丸，服之目能夜视，视物如白昼。夜行客的宝贝，猎妖人的底气——暗处的东西看得见，就不怕它了。',
    juling_san: '聚拢灵气的药散，修炼时洒在蒲团四周，灵气浓三分。散修们舍不得整瓶用，都是小心翼翼地撮一小撮——像在撒金粉。',
    qixue_dan: '充盈气血的丹药，服后血气翻涌，脸色红润如饮了三杯烈酒。体修们最爱的"补药"，也是战场上救命的回气丹。',
    xuli_dan: '蓄养气力的丹丸，把一夜休养的气力攒进一粒丹里。猎妖人赶路时含一粒，能在荒山里多撑一天。',
    qingshen_dan: '清神丹，可压下识海的杂音。心魔未成形的修士，靠它撑过无数个将睡未睡的夜。',
    dingshen_dan: '定神丹，应对心魔时的护神丹药。含在舌下，如有人在你耳边说：稳住，别怕。',
    shengji_gao: '生肌膏，外敷生肌，一道深可见骨的伤口，半月便能愈合如初。医馆里最抢手的膏药，也是江湖人身上最重的行囊。',
    bidu_dan: '避毒丹，含一粒，瘴气毒雾近身不侵。南疆的商人过瘴气林前，必先含上一粒——那是拿命换来的规矩。',
    fengxing_dan: '风行丹，服之身轻如燕，一日千里。赶路、逃命、追敌，皆是大用。丹师说：这丹炼的不是药，是风。',
    juling_dan: '聚灵丹，筑基期修炼圣品。药力霸道，一枚顶一月苦修。坊市上论粒卖，一粒能换一个散修半年的口粮。',
    zhenyuan_dan: '真元丹，凝聚真元的丹药，服后丹田暖意融融。是金丹前修士冲击瓶颈时的"临门一脚"。',
    yinxi_dan: '隐息丹，服之气息全无，如同凡人。藏身、潜行、躲仇家——一粒下去，谁也找不着你。',
    powang_dan: '破妄丹，破除幻境迷障。入秘境、探古墓前含一粒，能看穿七成幻术。',
    liaogu_dan: '疗骨丹，断骨接续的圣药。摔断了骨头，嚼碎敷上，再养半月，比新长的还结实。',
    ningpo_dan: '凝魄丹，凝练魂魄，安定心神。魂魄受损的修士视若珍宝——神魂这东西，碎了可就难补了。',
    xulei_dan: '蓄雷丹，雷系修士专用，服后经脉里雷灵力暴涨一截。雷雨天服之，事半功倍——但也有人被劈得外焦里嫩。',
    mihun_san: '迷魂散，吸入即神志恍惚。阴人的利器，也是下三滥的手段——但江湖人常说：手段不分贵贱，命只有一条。',
    guixi_dan: '龟息丹，服之气若游丝，状若假死，骗得过大多数修士的探查。是用来"死"给仇家看的东西——用的时候，得想清楚自己是不是真不想活了。',
    bihuo_dan: '辟火丹，入火不焚，火海可渡。丹师炼它时，炉火要烧到纯青——据说最难的，是让炼丹的人自己信这丹有用。',
    bihan_dan: '辟寒丹，入冰不冻。北漠的赶路人，过冰原前必服一粒——冰原上冻死的修士，多半是舍不得这一粒丹。',
    dingshen_fu: '定身符，可定住敌人一瞬。画符者须笔力极稳，符成时，纸上隐隐有锁链虚影。',
    chi_yan_dao: '刀身赤红的灵器，入手发烫，隐隐有火气流动。据说是炼器师用火山铁精所铸，刀出鞘时，周围的空气都燥热三分。',
    han_shuang_jian: '剑生寒霜的灵器，握剑久了，指节会冻得发白。剑鞘里总是凝着一层薄霜——像剑在自言自语。',
    zi_dian_bian: '鞭身缠绕紫色电弧的灵器，挥动时噼啪作响。雷灵根修士用起来得心应手，旁人拿它，先被电麻半只手。',
    bai_lian_gong: '百炼精弓，弓弦是蛟筋所制。拉满时弓身嗡鸣如龙吟，射出的箭，能追上一里外的飞鸟。',
    shou_hu_dun: '兽骨所炼的盾牌，正面刻着一头狰狞兽首。据说是猎妖人用了一辈子猎的妖兽的骨——他赢了，所以盾牌在；他输了，盾牌也会在。',
    xuanwu_dun: '玄武龟甲炼成的宝器盾，坚不可摧。传闻炼这面盾时，炼器师闭关三年，出关时，满头的黑发全白了。',
    leiyin_jian: '雷音剑，出剑有雷音相伴。剑身刻着细密的雷纹，出鞘时"嗡"的一声，像雷云压顶。',
    fengyu_shan: '凤凰翎羽所制的宝扇，扇动生风，风里带着一丝若有若无的凤鸣。据说是万宝阁从一场大火里抢出来的——那火，烧了三天三夜。',
    zhenyao_ta: '镇妖塔，巴掌大的小塔，却能镇住妖气。修士随身带着它，寻常妖兽近身三尺便伏低做小。',
    han_po_jian: '北漠寒魄所铸的宝器剑，剑出霜凝，握之如握一块千年寒冰。铸它的那块寒魄，在冰原深处冻了不知多少万年。',
    chixiao_jian: '赤霄剑，剑身赤红如血，传闻饮过蛟龙之血。剑柄缠着暗红的绳，握上去，指尖能感受到一丝微弱的搏动——像剑在呼吸。',
    qinglian_jian: '青莲剑，剑身如一朵含苞的青莲，出淤泥而不染。传闻铸剑者以自身剑意为火，炼了整整十年。',
    bailing_cao: '最常见的炼丹灵草，路边、山谷、溪畔，到处都是。药铺收它的价低得可怜，可就是这不起眼的草，撑起了修真界九成的丹炉。',
    shouhe1: '一阶妖兽体内凝结的精华，花生大小，泛着微光。低阶猎妖人一整天猎三头妖兽，才攒得下这么一枚。',
    shouhe2: '二阶兽核，灵气充沛，指甲盖大小。炼丹、炼器、布阵，都离不了它——散修们攒十枚，能换一件像样的法器。',
    shouhe3: '三阶兽核，价值不菲，入手温热。坊市里论枚卖，买主多是筑基后期冲击金丹的修士。',
    shouhe4: '四阶兽核，可遇不可求。一头四阶妖兽，足以让一座宗门倾巢而出——而它的兽核，够炼一炉上好的宝丹。',
    mangpi: '花斑蟒的皮，花纹斑斓，质地柔韧。鞣制之后可做软甲，也可做剑鞘——修士们说，蟒皮做的剑鞘，剑拔出来的时候会响。',
    bao_gu: '幽影豹的骨头，蕴含一丝风灵之力。敲击时有清越之声，是炼制风系法器的好料。',
    hupi: '雷纹虎皮，纹路如雷，雷灵根修士视若珍宝。铺在蒲团下修炼，事半功倍——可惜雷纹虎不好惹。',
    chan_yi: '冰蟾衣，冰晶蟾蜕下的外衣，寒性十足。缝进衣甲里，冬暖夏凉，还能挡几分火系术法。',
    shedu: '雾隐蛇毒囊，剧毒。可炼毒，也可入药——毒与药，本是一体两面，只看用的人。',
    guijia: '石甲龟甲，坚不可摧。炼器师说，这龟甲能挡住金丹修士全力一击——前提是，你得先杀了那头龟。',
    qingjiao_lin: '青蛟鳞，蕴含蛟龙血脉之力。炼入法器，可添几分龙威；泡酒喝，据说能壮筋骨——反正没人试过第二片。',
    linghu_mao: '九尾灵狐的尾毛，柔韧入微，可织软甲，可制符笔。传闻蘸灵狐毛制的笔画的符，符灵三分。',
    xuan_bing_jing: '北漠冰原深处的冰晶，万年寒气内蕴。炼寒系法器必备，握在手里，指尖会冻得发麻。',
    han_po: '万载寒魄，炼器至宝。一整块寒魄，足以让一座宗门的炼器堂争破头——北漠冰原里，百年也挖不出一块。',
    huo_ling_shi: '火灵石矿精，通体赤红，入手滚烫。火系修士修炼的宝贝，也是炼器炉里最好的火种。',
    feng_ling_guo: '风灵果树百年一果，青翠欲滴。服之身轻，风系修士的大补。',
    lei_ling_guo: '雷灵果树千年一果，果皮泛着电弧。雷灵根修士梦寐以求——可惜千年一熟，等得起的人不多。',
    long_xian_cao: '据说沾过龙涎的灵草，叶脉泛金。炼丹入药皆是上品——当然，"据说"两个字，让它便宜了不少。',
    xue_ling_zhi: '血色灵芝，药力暴烈。可炼暴烈的大补丹，也可入毒——全看丹师的手。',
    canque_yujian: '上古修士留下的玉简残片，记载着失传功法的线索。残缺不全，可那上面的每一个字，都可能是某个传承的钥匙。',
    lingshi_bao: '沉甸甸的一袋灵石，万金商会出品。袋口绣着一个"万"字——钱能通神，也能通仙。',
    baimei_jiansui: '素白的剑穗，绣着一朵小小的白梅。针脚细密，是有人一针一针缝出来的——剑穗这种东西，通常没人会亲手做。',
    moyu_zan: '墨玉雕成的发簪，通体温润，簪头雕着一朵含苞的墨莲。夜里看，玉里仿佛有墨色流动。',
    baiyu_xiangnang: '白玉香囊，内藏清冽药香，闻之宁神。香囊里的药，是配了七七四十九种——能配齐的，都是有耐心的人。',
    shangdeng_jiu: '百年陈酿，入口如刀，后劲绵长。酒馆老板说：这酒，喝的不是味道，是岁月。',
    qipu_canye: '一页残破棋谱，落子之处暗藏玄机。能看懂它的人，据说棋力能涨三成——可惜这世上会下棋的修士，越来越少了。',
    yu_suanpan: '羊脂玉雕的算盘，珠子拨动时叮当作响。是商人的心头好，也是万宝阁大小姐的随身之物——算盘一响，黄金万两。',
    qingyu_di: '青玉所制的短笛，音色空灵。吹笛的人若心不静，笛声便不成调——所以会吹它的人，都是心静的人。',
    xue_mei_niang: '雪梅酿成的美酒，清香冷冽，入口如雪化。醉仙楼的招牌，据说一年只酿十坛。',
    yinsi_pa: '银丝织就的手帕，素雅精致。角上绣着一行小字，看不清是什么——绣字的人，怕是故意的。'
  },
  beasts: {
    qingyan_lang: '青州山林最常见的群居妖兽，铜头铁尾，惯于成群出没。喜食灵田里的作物，常与农户起冲突。弱点在腰腹，皮糙肉厚，但极怕火。',
    chimu_shu: '赤目尖牙的鼠类妖兽，灵田里的祸害，繁殖极快。胆小，昼伏夜出，成群时连猫都躲着走。皮毛不值钱，但兽核可入药。',
    tiebei_zhu: '皮糙肉厚的低阶妖兽，发起蛮来横冲直撞，连筑基修士都要避其锋芒。肉质紧实，是宗门膳堂的抢手货。',
    huaban_mang: '盘踞山林的花斑巨蟒，绞杀之力惊人，最喜盘在树上伏击猎物。皮可制软甲，胆可入药——前提是，你能在它绞住你之前，先要了它的命。',
    youying_bao: '行踪如鬼魅的暗夜猎手，速度奇快，常在猎物毫无察觉时出手。骨可炼器，蕴一丝风灵之力。猎它的人，多半也死在它的爪下。',
    wuyin_she: '藏于浓雾中的毒蛇，一击致命，从不恋战。雾隐蛇的毒囊，既可炼毒，也可入药——毒与药，本是一体两面。',
    leiwen_hu: '虎纹生雷的三阶妖兽，啸声如雷，雷系妖兽中的王者。皮是雷灵根修士的至宝，骨可炼雷系法器。传闻它枕着雷击木睡觉，雷击木也因此沾了虎威。',
    bingjing_chan: '通体冰晶的寒性妖兽，吐息可冻裂岩石。它蜕下的外衣"冰蟾衣"是炼寒系法器的好材料，只是这玩意儿冬眠时藏在极深的山洞里，不好找。',
    shijia_gui: '甲壳坚逾精铁的龟类妖兽，慢吞吞的，却几乎没有天敌。它守着的那株灵芝，少说也守了百年——这份耐心，倒让许多修士自愧不如。',
    zi_dian_diao: '身负紫电的灵貂，快若惊雷，能在雷雨夜引雷入体。它的皮毛在雷灵根修士眼中是无价之宝，可它跑得比雷还快。',
    lie_di_xiong: '一掌裂地的巨熊，力量恐怖，皮糙肉厚。猎户们说，惹什么都别惹裂地熊——它的巴掌，比城门还硬。',
    feng_xiao_lang: '青岩狼群的王者，御风而行，啸声裂石。狼王不死，狼群不散——所以猎狼任务里，真正值钱的，是狼王的命。',
    huo_yan_shi: '东荒火山口的火系妖兽，狮鬃燃火，喷吐之间热浪滔天。它的兽核是火系修士的大补之物，只是要取核，得先过火这一关。',
    xuan_shui_jiao: '深潭中的黑水蛟龙，控水成浪，喜怒无常。传闻它与青云秘境的青蛟王是远亲——蛟龙一脉，果然都霸道。',
    xue_yi_fu: '血翼蔽天的蝠王，嗜血成性，夜行千里。它出没的地方，方圆十里的野兽都会连夜迁徙——没人说得清为什么。',
    qingjiao: '青云秘境深处的青鳞蛟龙，蛟龙一怒，山崩地裂。鳞可炼甲，逆鳞更是无价之宝。传闻蛟龙千年化龙——这头青蛟，怕是离化龙不远了。',
    qingjiao_wang: '青云秘境之主，妖王级的青鳞蛟龙，守护秘境已逾三百年。它的逆鳞中，或许藏着秘境真正的秘密。',
    ming_huo_yao_feng: '冥火中涅槃的妖凰，凤鸣九霄，是南疆最恐怖的传说之一。见过它的人屈指可数，而活下来的，一个也没有。',
    tai_gu_xuan_wu: '太古遗种，龟蛇同体，背负天道。它沉睡时像一座岛，醒来时——没有人知道它醒来时会是什么样子。',
    jiu_tian_ying_long: '应天而生的神龙，行云布雨，威压九天。传闻它守护着北漠深处的一件东西——有人说是仙帝的遗物，有人说是封印的钥匙。',
    jiu_you_tian_mo: '被苍梧仙帝镇压于九渊的灭世天魔，万载封印已近极限。它的呼吸，能让整个苍梧界的修士夜不能寐。',
    yao_huang_baize: '通晓万物的上古神兽白泽，妖界至尊。它不说话则已，一开口，便是天机。',
    jiu_wei_ling_hu: '通体雪白的九尾灵狐，天生通灵，可遇不可求。传闻九尾灵狐一尾一命，活过千年，尾尖便会染金。它叼走你的干粮，留下风灵果——这算是……交朋友？',
    hua_ling_zhi: '尾羽华丽的山雉，飞不高，跑得快。肉质鲜美，是猎户们最爱的下酒菜——猎它不用刀，用圈套。',
    shui_jian_yu: '溪流中的妖兽，能喷出锋利的水箭。渔夫们恨它，说它偷鱼；孩子们爱它，说它的鳞片在阳光下会发光。',
    sui_shi_chan: '体型巨大如石的蟾蜍，受惊时喷吐碎石。它藏在水底一动不动时，没人分得清那是石头还是蟾——直到它跳起来。',
    shi_tie_yi: '嗜食铁矿的巨蚁，甲壳坚硬如铁，蚁群过境，连矿脉都要啃出缺口。好在它们只在深山里活动——城里人最多在铁匠铺里见到它们的标本。',
    bi_yan_hou: '通人性的灵猴，碧眼能辨宝。最爱偷修士的丹药，偷完还会把空瓶子放回原处——像是怕你发现药没了。',
    feng_ren_que: '疾如风的雀鸟，翎羽如刀，从树梢掠过时能削断拇指粗的枝条。猎它的人不多——追不上。',
    yan_jia_xi: '背生岩甲的蜥蜴，趴在岩石上时与岩石无异。它一趴就是一天，等猎物踩上它的背——然后，没有然后了。',
    du_nang_zhu: '林中织网的毒蛛，网丝坚韧如铁丝。它的毒囊可入药，胆子大的药师会活捉它取毒——胆子更大的，会先让它咬一口试试药效。',
    yue_ying_diao: '月光下出没的灵貂，皮毛泛着月华般的银光。它的皮毛价值不菲，可它只在月圆之夜出没——猎它的人，也得挑月亮最圆的那天。',
    chi_yan_quan: '火属性妖犬，獠牙带火，性烈如火。野生的极难驯服，驯服的，是猎妖人最忠诚的伙伴——火犬认主，一生不二。',
    shuang_tou_she: '双头蛇，一头喷毒雾，一头吐火息。两个头常互相打架，打完了再一起捕猎——修真界的猎妖人管这叫"内耗式妖兽"。',
    tie_yi_ying: '翼如铁铸的巨鹰，俯冲之势可裂石。它的巢建在悬崖绝壁上，巢里的鹰羽，是炼制飞行法器的好料。',
    qing_lin_e: '沼泽霸主，鳞甲坚硬，咬合力惊人。它趴在泥里时像一根朽木，可谁要是踩上去——那就不是朽木了。',
    zhang_qi_ha: '吐息成瘴的蛤蟆，凡人触之即倒。药师们却在它的瘴气里提炼解药——最毒的东西，往往也是最好的药引。',
    xue_ya_zhu: '獠牙染血的狂暴野猪，发起狂来六亲不认。它的獠牙是炼器的好料，可要取牙，得先挨它几撞——被它撞过的树，没有不倒的。',
    han_bing_tu: '北地雪原的冰系灵兔，看似无害，吐息冻人。雪原上的猎人教孩子：看见白兔子，别摸——先看它眼睛里有没有霜。',
    huo_yan_xi: '火属性妖兽，尾焰如炬。它盘踞的岩缝里，常年有火焰蜥的蛋——那蛋烤熟了，是东荒最香的点心。',
    du_wang_xie: '蝎中王者，尾针之毒可放倒金丹以下修士。它的毒液按滴卖，一滴能换一座宅子——当然，得先抓住它。',
    jin_bei_yuan: '背生金毛的灵猿，力大无穷，通晓粗浅拳法。它常坐在树梢上打拳，有人看了三天，回去悟出一套拳法——灵猿自己也想不到。',
    mijing_shouling: '青云秘境核心的守灵，无形无相，镇守秘境机缘。没人见过它的真面目——见过的，都成了秘境的一部分。',
    lei_peng: '翼展蔽日的雷鹏，振翅间雷云翻涌。它掠过头顶时，整个山头的兽吼都会安静下来——兽也怕雷。',
    han_shuang_lang: '北漠冰原的狼王，吐息成冰。它统率的狼群，能在冰原上活过一整个冬天——这份本事，人类学不来。',
    yan_yue_ju_yuan: '背负山岳般的巨猿，一拳可碎小山。它睡一觉的工夫，够一个村庄盖三间房——前提是别在它眼皮底下盖。',
    xuan_bing_gu: '北漠冰原的冰系妖兽，骨翼如刀，寒息千里。它的骨翼是炼器的至宝，可它飞起来的时候，连影子都是冷的。',
    yan_yu_mo_niu: '炎狱深渊走出的魔牛，四蹄踏火。它走过的地面，会留下燃烧的蹄印——东荒的猎妖人管那叫"火路"。',
    zi_jin_lei_peng: '紫金翎羽的雷鹏，雷霆为翼。传闻它每百年蜕一次羽，蜕下的紫金羽，是炼制雷系宝器的无上材料——可它蜕羽的地方，没人找得到。',
    hei_shui_xuan_she: '深潭黑水中的玄蛇，毒水滔天。它盘踞的水潭，连飞鸟都不肯掠过——那水面，倒映着的东西，都不是真的。',
    chi_yang_jin_wu: '身负赤阳之力的金乌，焚天煮海。它展翅时，半边天空都会染成金色——是灾，也是祥瑞，全看它飞过谁家的屋顶。',
    cang_lei_gu_yuan: '存活万年的古猿，苍雷加身，力可擎天。它每渡一次雷劫，毛发便白一分——它活了多久，天劫就追了它多久。',
    xuan_ming_gui: '背负玄冥二气的古龟，不动如山。它的龟甲上刻着看不懂的文字，有人说是上古的文字，有人说是龟自己的日记。',
    qi_se_tun_tian: '七色鳞甲的吞天蟒，可吞山河之气。它蜕下的七彩鳞，是炼制防御宝器的绝品——只是它蜕鳞时，方圆十里没人敢靠近。',
    zhen_yue_qi_lin: '身怀麒麟血脉的异兽，其吼镇山河。传闻它血统不纯，却比纯血麒麟更拼命——像是要向谁证明什么。',
    fen_tian_yao_feng: '焚天灭地的妖凰，凤炎可焚神魂。它涅槃时，整片天空会下起火雨——有人说那是它的眼泪。',
    han_yuan_zhu_long: '盘踞寒渊的烛龙，睁眼为昼，闭眼为夜。它若闭眼，北漠的冰原会提前黑三天——北漠人都知道，看见天黑得不对劲，就收拾东西回家。',
    wan_gu_lei_shou: '与天地同寿的雷兽，雷霆即其呼吸。它沉睡在雷云之上，一睡千年——雷雨夜那一声声炸雷，其实是它在打鼾。',
    bu_dong_ming_wang: '金刚不坏的巨猿，怒目如明王。它盘坐时像一尊佛像，可它站起来时——那就不叫佛像了。',
    you_ming_mo_jiao: '幽冥中孕育的魔蛟，其鳞可噬魂。它游过的水域，鱼虾都会翻白——是被它身上的气息"吓死"的。',
    hun_dun_zu_long: '开天辟地前的混沌祖龙，其存在即法则。传闻它是这苍梧界最早的生灵——它若睁眼，天地都要重新排序。',
    yao_di_zhu_jiuyin: '妖界亘古的帝王，其目开合间昼夜颠倒。妖界万妖臣服于它，正道修士谈之色变——可它已经很多年没有踏出妖界一步了。'
  },
  locs: {
    loc_shenjia: '临江城沈家，三代相传的修仙世家。祖上也曾出过金丹修士，如今虽已式微，门楣上那块「世德传家」的匾，仍擦得锃亮。',
    loc_linjiang: '青州繁华大城，商贾云集，三教九流汇聚。城西有灵材摊，城东有醉仙楼，城门口每日都有行商被泼皮欺辱——有人在这里一夜暴富，也有人在这里一夜倾家荡产。',
    loc_xuanqing: '青云山上的玄清宗，青州第一宗门。山门九十九级石阶，测灵石高丈许，钟声能传遍半个青州。开宗祖师以一剑一镜立派，如今剑还在，镜却只剩一段传说。',
    loc_qingyunshan: '玄清宗所在的灵山福地，竹海千顷，灵泉处处。山上的钟声，晨昏各响一次，风雨无阻——据说是提醒弟子们：道无止境，勿忘修行。',
    loc_mijing: '三年一开的青云秘境，入口是一道流光裂痕。内藏灵药妖兽、前人遗泽，也藏着吃人的凶险。秘境核心处那座黑石祭坛，没人说得清是谁建的。',
    loc_cangwu: '中州大城，万宝阁总号所在。三层高楼，飞檐翘角，灵药与檀木的香气终年不散。这里是修真界的销金窟——灵石在这里，真的能让鬼推磨。',
    loc_wanbao: '商通八方的万宝阁，货架上摆着玉瓶、锦盒、灵剑，还有你想不到的一切。大掌柜钱万金白手起家，最常挂在嘴边的一句话是：灵石不认人，认人的人，才赚得到灵石。',
    loc_yaoshou: '东荒妖兽山脉，猎妖者的天堂与坟场。林深雾重，兽吼声此起彼伏。山里的规矩很简单：拳头大的吃肉，拳头小的——被吃。',
    loc_sanxiu: '东荒散修集市，三教九流聚集的自由之地。没有宗门，没有规矩，只有灵石与拳头。黑市藏在最深处，卖的东西来路不明，买的人心照不宣。',
    loc_huangdu: '大夏皇朝都城，世俗权力的巅峰。朱墙金瓦，气象森严。皇城深处那座摘星楼，据说能看到整个苍梧界——也有人说，能看到九渊。',
    loc_xuemo: '南疆血魔宗，魔道巨擘。宗门建在血湖之上，湖水终年泛红，腥气百里可闻。魔道中人以血养功，以命搏命——那里没有规矩，只有强弱。',
    loc_baigu: '白骨教，魔道凶宗，以尸傀之术闻名。教主座下，白骨成山。教众腰间都挂着一枚乌鸦骨牌——那是白骨教的信物，也是催命的符。',
    loc_danding: '丹鼎阁，天下丹药出丹鼎。阁中丹炉百座，终年不熄。炼丹师在这里的地位，比金丹修士还高——毕竟，谁不想要一枚好丹呢？',
    loc_tianjian: '天剑宗，剑修圣地，一剑破万法。山门上刻着一行大字：剑出无悔。传闻天剑宗的开宗祖师，曾以一剑劈开过一座山。',
    loc_bingyuan: '北漠冰原，玄冰千里，终年风雪。冰原深处有万载寒魄，也有传说中冰封的上古战场。敢进冰原的人不多，活着出来的更少。',
    loc_guzhanchang: '北漠古战场，上古大战的遗迹。杀伐之气万年不散，草木不生，鸟兽绝迹。传闻每逢月圆之夜，还能听见铁马金戈之声——那是死去的英魂，还在列阵。',
    loc_jiuyuan: '九渊封印之地，苍梧仙帝镇压天魔之处。封印若破，苍梧界倾覆。这方寸之地，牵动着整个苍梧界的命运——而钥匙，可能就在你怀里。',
    loc_taiqing: '太清宗，符箓道法正宗。山门是一道巨大的符箓，据说能镇住整座山的灵气。宗门弟子出门必带符笔——那是他们的剑。',
    loc_foguo: '沙海佛国，西陲佛门。寺庙建在沙丘之上，钟声能传出百里。佛国僧人修的是一颗"放下"的心——可放下二字，最难。'
  }

<script>
/* ============================================================
   问道苍梧 · 结局组装模板
   原理：结局方向定死，细节读取本局实际状态动态拼装。
   ============================================================ */
(function (g) {
'use strict';
var GD = g.GameData;
function Eng() { return g.GameEngine; }
function charName(id) { var c = GD.characters[id]; return c ? c.name : id; }
function teacherName(s) {
  return ['——','柳长风·剑道','孙伯符·丹道','林清音·符道','洪烈·体修'][s.flags.teacher || 1] || '——';
}
function temperLabel(axis) { return { xiayi:'侠义', gongli:'功利', henla:'狠辣' }[axis] || ''; }

g.GameData = g.GameData || {};
g.GameData.endings = {
  /* 卷1 预览结局（动态总结本局） */
  preview_end: {
    title: '少年初立',
    render: function (s) {
      var E = Eng();
      var dt = E.dominantTemper(s);
      var rels = Object.keys(s.rel || {}).sort(function (a, b) { return s.rel[b] - s.rel[a]; }).slice(0, 3)
        .map(function (id) { return charName(id) + '（好感 ' + s.rel[id] + '）'; });
      var parts = [];
      parts.push('『' + s.profile.name + '』以' + E.realmName(s) + '之身，拜入玄清宗' + teacherName(s) + '门下。');
      parts.push('主导性格：' + temperLabel(dt.axis) + '（' + dt.val + '）。声望 ' + s.stats.shengwang + '，灵石 ' + s.stats.lingshi + '。');
      if (rels.length) parts.push('此时站在你身边的：' + rels.join('、') + '。');
      if (s.flags.sign_divorce) parts.push('那纸退婚书，你收下了——此仇，记在心里。');
      if (s.flags.question_public) parts.push('你当众质问过慕容雪，满堂哗然——有些话，说了就是种子。');
      if (s.flags.remember_face) parts.push('慕容雪的脸，你刻进了心里——这张脸，早晚要还。');
      if (s.flags.probe_wulao) parts.push('你试探过梧老的来历，他笑而不答——这面镜子，藏着更大的秘密。');
      if (s.flags.test_wulao) parts.push('你让梧老证明自己——他骂骂咧咧地证明了。');
      if (s.flags.help_xinglie || s.flags.wait_xinglie) parts.push('邢烈与你并肩砍过山匪，这份交情是真的。');
      if (s.flags.skip_xinglie) parts.push('你绕过了那场乱斗——有些缘分，错过就是错过。');
      var danCount = 0, beastCount = 0;
      for (var k in s.items) { var it = GD.items[k]; if (it && it.type === 'dan') danCount += s.items[k]; }
      if (s.seenBeasts) beastCount = s.seenBeasts.length;
      parts.push('行囊里丹药 ' + danCount + ' 枚，妖兽图鉴点亮 ' + beastCount + ' 种。');
      parts.push('—— 苍梧界的故事，才刚刚开始。');
      return parts.join('\n');
    }
  },
  /* 卷1 阶段结局（动态总结） */
  vol1_stay: {
    title: '潜龙在渊',
    render: function (s) {
      var E = Eng();
      return '『' + s.profile.name + '』以' + E.realmName(s) + '之境留在玄清宗，声望 ' + s.stats.shengwang + '。' +
        (s.rel.xiaoman > 20 ? '\n苏小满的信物还揣在怀里——她说大比之后要你带她去苍梧城。' : '') +
        (s.rel.wenyu > 15 ? '\n温如玉深夜出山的背影，你始终没有说破。' : '') +
        '\n——宗门大比、正魔之局，静待风起。';
    }
  },
  vol1_travel: {
    title: '仗剑天涯',
    render: function (s) {
      var E = Eng();
      return '『' + s.profile.name + '』以' + E.realmName(s) + '之境仗剑下山，游历四方，声望 ' + s.stats.shengwang + '。' +
        (s.flags.meet_yunshang ? '\n万宝阁的客卿帖子还在行囊里——云裳说，东荒有桩大生意等着你。' : '') +
        '\n——江湖路远，山高水长。';
    }
  },
  vol1_secret: {
    title: '身世之问',
    render: function (s) {
      var E = Eng();
      return '『' + s.profile.name + '』握紧残缺玉简，踏上了追寻身世之路，声望 ' + s.stats.shengwang + '。' +
        (s.flags.wulao_sleep ? '\n梧老仍在沉睡——这一次，换你独自前行。' : '\n梧老在镜中嘀咕：「查到这一步，想回头可就难喽。」') +
        '\n——九渊之下，苍梧为钥；血脉为引，你是谁的钥？';
    }
  },
  /* 卷二阶段性收尾 */
  vol2_hook: {
    title: '风起云涌 · 待续',
    render: function (s) {
      var E = Eng();
      var lines = ['『' + s.profile.name + '』以' + E.realmName(s) + '之境，在宗门大比中崭露头角，声望 ' + s.stats.shengwang + '。'];
      if (s.flags.moon_xiaoman) lines.push('月下之约，苏小满红着脸说想与你同游苍梧城。');
      if (s.flags.moon_qingshuang) lines.push('月下之约，顾清霜说：我的剑，可以借你。');
      if (s.flags.moon_yunshang) lines.push('月下之约，云裳递来万宝阁客卿帖，还有北漠残图的线索。');
      if (s.flags.moon_baizhi) lines.push('月下之约，白芷为你调了一枚养脉丹。');
      if (s.flags.moon_liuli) lines.push('月下之约，夜琉璃警告你：血无极在查你怀里的镜子。');
      lines.push('——血无极现踪，温如玉深夜出山，黑莲的影子在暗处窥伺。\n卷二未完待续：大比决赛、正魔之局、身世之谜，皆在前方。');
      return lines.join('\n');
    }
  },
  /* 卷二终章抉择（动态总结本局因果） */
  vol2_end_hook: {
    title: '风云落幕 · 终章抉择',
    render: function (s) {
      var E = Eng();
      var lines = ['『' + s.profile.name + '』以' + E.realmName(s) + '之境回到残破的玄清宗，声望 ' + s.stats.shengwang + '。'];
      if (s.flags.love_xiaoman) lines.push('苏小满把新编的平安结塞进你手里，什么也没说。');
      if (s.flags.love_qingshuang) lines.push('顾清霜擦拭着你的断剑，说要替你重铸一柄。');
      if (s.flags.love_yunshang) lines.push('云裳送来的客卿令还揣在怀里——万宝阁，站在你这边。');
      if (s.flags.love_baizhi) lines.push('白芷每日来给师父换药，也顺道多看你一眼。');
      if (s.flags.love_liuli) lines.push('夜琉璃在夜色里远远地看了你一眼，又消失在暗处。');
      if (s.flags.xinglie_rear_guard) lines.push('邢烈为你断后，浑身是血地回来了——酒，他也带回来了。');
      if (s.flags.wenyu_chess || s.flags.wenyu_wait || s.flags.wenyu_reply) lines.push('温如玉的黑玉棋子还留在你身上——他到底在替谁下棋？');
      if (s.flags.take_orphan || s.flags.settle_orphan) lines.push('归山在客房里睡着了，怀里还抱着那包灵茶。');
      if (s.flags.dao_guard) lines.push('你的道，是守护。');
      else if (s.flags.dao_power) lines.push('你的道，是变强。');
      else if (s.flags.dao_love) lines.push('你的道，是那个人。');
      lines.push('——血无极重伤了玄清宗，而九渊的封印正在松动。\n你的下一个抉择，将决定苍梧界的走向。');
      return lines.join('\n');
    }
  },
  /* 卷二阶段结局 */
  vol2_restore: {
    title: '重整旗鼓',
    render: function (s) {
      var E = Eng();

<script>
/* ============================================================
   问道苍梧 · 核心引擎（纯逻辑，不依赖 DOM，可在 Node 中测试）
   ============================================================ */
(function (g) {
'use strict';
var GD = g.GameData || (g.GameData = {});

/* ---------- 常量 ---------- */
var REALMS = ["炼气一层","炼气二层","炼气三层","炼气四层","炼气五层","炼气六层","炼气七层","炼气八层","炼气九层",
  "筑基初期","筑基中期","筑基后期","金丹初期","金丹中期","金丹后期","元婴初期","元婴中期","元婴后期",
  "化神初期","化神中期","化神后期","渡劫期","大乘期","飞升境"];
var REALM_BONUS = REALMS.map(function (_, i) {
  return { atk: 3 + i * 2, def: 2 + Math.floor(i * 1.5), hp: 50 + i * 25, spd: 5 + i };
});
var XIWEI_NEED = [100,150,200,260,330,410,500,620,800,   /* 炼气各层 */
  1500,2200,3200,4500,6000,8000,11000,15000,20000,26000,34000,45000,60000,80000,100000]; /* 大境界 */

var ORIGINS = {
  noble:    { name:'世家嫡子', tag:'退婚流', desc:'临江城沈家嫡子。三年前灵根被废沦为笑柄，今日成人礼上，未婚妻慕容家登门退婚。', startLoc:'loc_shenjia', startScene:'v1n_01', lingshi:120, gift:{}, locked:false },
  poor:     { name:'寒门散修', tag:'逆袭流', desc:'出身贫寒的散修少年，揣着一筐干粮和一枚传家旧玉，独闯青云山求仙问道。', startLoc:'loc_linjiang', startScene:'v1p_01', lingshi:10, gift:{chuanjia_jiuyu:1}, locked:false },
  demon:    { name:'魔道遗孤', tag:'身世流', desc:'养父临终前将一面碎裂古镜托付于你，让你隐姓埋名活下去。正魔两道，都在找你。', startLoc:'loc_linjiang', startScene:'v1d_01', lingshi:30, gift:{ranxue_xinjian:1}, locked:false },
  merchant: { name:'商贾之子', tag:'打脸流', desc:'临江首富万家独子。用灵石砸开仙门，让修真者知道什么叫"有钱"也是实力。', startLoc:'loc_linjiang', startScene:'v1m_01', lingshi:500, gift:{lingshi_bao:1}, locked:false }
};

var SPIRIT_ROOTS = {
  jin:'金灵根', mu:'木灵根', shui:'水灵根', huo:'火灵根', tu:'土灵根',
  lei:'雷灵根(变异)', bing:'冰灵根(变异)', feng:'风灵根(变异)', an:'暗灵根(变异)'
};
var PHYSIQUES = {
  fan:'凡体', ling:'灵体', dao:'道体', mo:'魔体'
};
var PHYSIQUE_BONUS = {
  fan:{ desc:'平平无奇，稳扎稳打。' },
  ling:{ desc:'亲近灵气，修为获取 +10%。', xiweiMul:1.1 },
  dao:{ desc:'道心通明，悟性 +2，心境上限更高。', wuxing:2, xinjingMax:100 },
  mo:{ desc:'魔气亲和，正邪值 -10，狠辣路线加成。', zhengxie:-10, henla:1 }
};
var ROOT_BONUS = {
  jin:{ atk:1 }, mu:{ hp:15 }, shui:{ xinjing:5 }, huo:{ atk:2 }, tu:{ def:2 },
  lei:{ atk:3, spd:2, desc:'狂暴迅捷' }, bing:{ def:2, hp:10 }, feng:{ spd:4 }, an:{ atk:1, henlaHint:true }
};

var REL_THRESHOLDS = [
  { min:80, label:'生死之交' }, { min:60, label:'挚友' }, { min:30, label:'知己' },
  { min:10, label:'相识' }, { min:-9, label:'冷淡' }, { min:-30, label:'厌恶' }, { min:-999, label:'仇敌' }
];

/* ---------- 状态 ---------- */
function newState(profile) {
  var o = ORIGINS[profile.origin] || ORIGINS.noble;
  var ph = PHYSIQUE_BONUS[profile.physique] || {};
  var rt = ROOT_BONUS[profile.spiritRoot] || {};
  var items = {}; items.cangwu_jing = 1;
  for (var k in o.gift) items[k] = (items[k] || 0) + o.gift[k];
  var s = {
    version: 2,
    profile: profile,
    stats: {
      realmIdx: 0, xiwei: 0,
      wuxing: 5 + (ph.wuxing || 0) + (rt.wuxing || 0),
      xinjing: Math.min(50 + (rt.xinjing || 0) + (ph.xinjingMax ? 5 : 0), 100),
      shengwang: 0,
      zhengxie: (ph.zhengxie || 0),
      lingshi: o.lingshi, meili: 5,
      atkBonus: (rt.atk || 0), defBonus: (rt.def || 0), hpBonus: (rt.hp || 0), spdBonus: (rt.spd || 0)
    },
    temper: { xiayi: profile.temper.xiayi || 0, gongli: profile.temper.gongli || 0, henla: profile.temper.henla || 0 },
    physiqueBonus: ph,
    items: items,
    equip: { weapon: null, armor: null, accessory: null },
    skills: [], rel: {}, relStatus: {},
    flags: { origin: profile.origin, wulao_met: false },
    map: { unlocked: [o.startLoc], current: o.startLoc, visited: [o.startLoc] },
    log: [], scene: o.startScene, endingsSeen: [],
    seenBeasts: [], seenDanyao: [], seenLocations: [o.startLoc],
    settings: { soundOn: true, textSpeed: 'mid', dangerHints: true, showEffects: false },
    playSeconds: 0
  };
  return s;
}

/* ---------- 工具 ---------- */
function getScene(id) { return GD.scenes[id]; }
function hasItem(s, id, n) { return (s.items[id] || 0) >= (n || 1); }
function hasFlag(s, f) { return !!s.flags[f]; }
function itemDef(id) { return GD.items[id]; }
function beastDef(id) { return GD.beasts[id]; }
function charDef(id) { return GD.characters[id]; }
function skillDef(id) { return GD.skills[id]; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

function condPass(s, cond) {
  if (!cond) return true;
  if (typeof cond === 'function') { try { return !!cond(s); } catch (e) { return false; } }
  if (typeof cond === 'string') return !!s.flags[cond];
  if (Array.isArray(cond)) return cond.every(function (c) { return condPass(s, c); });
  if (cond.flag) return !!s.flags[cond.flag] === (cond.val !== false);
  if (cond.item) return hasItem(s, cond.item, cond.n);
  if (cond.rel) return (s.rel[cond.rel] || 0) >= (cond.n || 1);
  if (cond.stat) return (s.stats[cond.stat] || 0) >= (cond.n || 1);
  if (cond.any) return cond.any.some(function (c) { return condPass(s, c); });
  return true;
}

function interp(s, text) {
  if (!text) return text;
  return String(text)
    .replace(/\{name\}/g, s.profile.name)
    .replace(/\{originName\}/g, (ORIGINS[s.profile.origin] || {}).name || '')
    .replace(/\{realm\}/g, realmName(s))
    .replace(/\{lingshi\}/g, s.stats.lingshi);
}

function realmName(s) { return REALMS[clamp(s.stats.realmIdx, 0, REALMS.length - 1)]; }
function realmProgress(s) {
  var idx = s.stats.realmIdx;
  var need = XIWEI_NEED[Math.min(idx, XIWEI_NEED.length - 1)];
  var have = s.stats.xiwei;
  return { have: have, need: need, pct: clamp(Math.round(have / need * 100), 0, 100) };
}

function gainXiwei(s, n) {
  var mul = 1;
  if (s.equip.accessory && itemDef(s.equip.accessory) && itemDef(s.equip.accessory).xiweiMul) mul *= itemDef(s.equip.accessory).xiweiMul;
  if (s.physiqueBonus && s.physiqueBonus.xiweiMul) mul *= s.physiqueBonus.xiweiMul;
  if (s.skills.indexOf('cangwu_yinqi') >= 0) mul *= 1.2;
  var v = Math.round(n * mul);
  s.stats.xiwei += v;
  return v;
}

function relStatus(s, id) {
  var v = s.rel[id] || 0;
  for (var i = 0; i < REL_THRESHOLDS.length; i++) {
    if (v >= REL_THRESHOLDS[i].min) return { label: REL_THRESHOLDS[i].label, v: v };
  }
  return { label: '仇敌', v: v };
}

function dominantTemper(s) {
  var t = s.temper, best = 'xiayi', bestV = t.xiayi;
  if (t.gongli > bestV) { best = 'gongli'; bestV = t.gongli; }
  if (t.henla > bestV) { best = 'henla'; bestV = t.henla; }
  return { axis: best, val: bestV, labels: { xiayi: '侠义', gongli: '功利', henla: '狠辣' } };
}

/* ---------- 效果结算 ---------- */
function applyEffects(s, fx) {
  var notes = [];
  if (!fx) return notes;
  if (fx.stats) for (var k in fx.stats) {
    var nk = fx.stats[k];
    if (k === 'xiwei' && nk > 0) { gainXiwei(s, nk); }
    else s.stats[k] = (s.stats[k] || 0) + nk;
    notes.push({ type: 'stat', k: k, v: nk });
  }
  if (fx.temper) for (var t in fx.temper) { s.temper[t] = (s.temper[t] || 0) + fx.temper[t]; notes.push({ type: 'temper', k: t, v: fx.temper[t] }); }
  if (fx.rel) for (var c in fx.rel) {
    s.rel[c] = (s.rel[c] || 0) + fx.rel[c];
    s.relStatus[c] = relStatus(s, c).label;
    notes.push({ type: 'rel', k: c, v: fx.rel[c] });
  }
  if (fx.items) {
    if (fx.items.add) for (var i in fx.items.add) {
      s.items[i] = (s.items[i] || 0) + fx.items.add[i];
      if (itemDef(i) && itemDef(i).type === 'dan') markSeen(s.seenDanyao, i);
      notes.push({ type: 'item', k: i, v: fx.items.add[i] });
    }
    if (fx.items.remove) for (var r in fx.items.remove) {
      s.items[r] = (s.items[r] || 0) - fx.items.remove[r];
      if (s.items[r] <= 0) delete s.items[r];
      notes.push({ type: 'item', k: r, v: -fx.items.remove[r] });
    }
  }
  if (fx.flags) for (var f in fx.flags) s.flags[f] = fx.flags[f];
  if (fx.equip) for (var e in fx.equip) { s.equip[e] = fx.equip[e]; notes.push({ type: 'equip', k: e, v: fx.equip[e] }); }
  if (fx.map) {
    if (fx.map.unlock) fx.map.unlock.forEach(function (l) {
      if (s.map.unlocked.indexOf(l) < 0) { s.map.unlocked.push(l); markSeen(s.seenLocations, l); notes.push({ type: 'map', k: l }); }
    });
    if (fx.map.current) {
      s.map.current = fx.map.current;
      if (s.map.visited.indexOf(fx.map.current) < 0) s.map.visited.push(fx.map.current);
      markSeen(s.seenLocations, fx.map.current);
    }
  }
  if (fx.skills) {
    if (fx.skills.add) fx.skills.add.forEach(function (sk) { if (s.skills.indexOf(sk) < 0) s.skills.push(sk); notes.push({ type: 'skill', k: sk }); });
  }
  if (fx.setRealm !== undefined) { s.stats.realmIdx = clamp(fx.setRealm, 0, REALMS.length - 1); s.stats.xiwei = 0; notes.push({ type: 'stat', k: '境界', v: '突破' }); }
  if (fx.beasts) fx.beasts.forEach(function (b) { markSeen(s.seenBeasts, b); notes.push({ type: 'beast', k: b }); });
  if (fx.goto) s._pendingGoto = fx.goto;
  s.stats.xinjing = clamp(s.stats.xinjing, 0, 100);
  s.stats.zhengxie = clamp(s.stats.zhengxie, -100, 100);
  s.stats.realmIdx = clamp(s.stats.realmIdx, 0, REALMS.length - 1);
  return notes;
}

function markSeen(arr, id) { if (arr.indexOf(id) < 0) arr.push(id); }

/* ---------- 战斗数值 ---------- */
function combatStats(s) {
  var rb = REALM_BONUS[clamp(s.stats.realmIdx, 0, REALM_BONUS.length - 1)];
  var atk = rb.atk + (s.stats.atkBonus || 0), def = rb.def + (s.stats.defBonus || 0);
  var hp = rb.hp + (s.stats.hpBonus || 0), spd = rb.spd + (s.stats.spdBonus || 0);
  ['weapon', 'armor', 'accessory'].forEach(function (sl) {
    var eid = s.equip[sl];
    if (eid && itemDef(eid) && itemDef(eid).equip) {
      var eq = itemDef(eid).equip;
      atk += eq.atk || 0; def += eq.def || 0; hp += eq.hp || 0; spd += eq.spd || 0;
    }
  });
  s.skills.forEach(function (sk) {
    var d = skillDef(sk); if (!d || !d.combat) return;
    atk += d.combat.atk || 0; def += d.combat.def || 0; hp += d.combat.hp || 0; spd += d.combat.spd || 0;
  });
  return { atk: Math.max(1, atk), def: Math.max(0, def), hp: Math.max(10, hp), spd: Math.max(1, spd) };
}

/* ---------- 场景流转 ---------- */
function enterScene(id) {
  var sc = getScene(id);
  if (!sc) return { error: '场景不存在: ' + id, sceneId: id };
  var s = engine.state;
  s.scene = id;
  s.log.push({ scene: id, t: Date.now() });
  if (sc.location) {
    s.map.current = sc.location;
    markSeen(s.seenLocations, sc.location);
    // 探索即解锁：到过的地点在地图上永久点亮（迷雾随剧情散开，支线才可达）
    if (s.map.unlocked.indexOf(sc.location) < 0) s.map.unlocked.push(sc.location);
  }
  var text = sc.text || '';
  if (sc.onEnter) {
    if (typeof sc.onEnter === 'function') {
      var r = sc.onEnter(s);
      if (r && r.text) text += '\n\n' + r.text;
    } else {
      if (sc.onEnter.append) text += '\n\n' + sc.onEnter.append;
      if (sc.onEnter.effects) applyEffects(s, sc.onEnter.effects);
      if (sc.onEnter.flags) for (var f in sc.onEnter.flags) s.flags[f] = sc.onEnter.flags[f];
    }
  }
  // 变体文本：根据此前选择/积累，追加不同的剧情版本（选择真正影响剧情的关键机制）
  if (sc.textVariants) for (var vi = 0; vi < sc.textVariants.length; vi++) {
    var v = sc.textVariants[vi];
    if (condPass(s, v.cond)) text += '\n\n' + interp(s, v.text);
  }
  text = interp(s, text);
  var choices = (sc.choices || []).filter(function (c) { return condPass(s, c.cond); }).map(function (c) {
    return {
      text: interp(s, c.text), hint: c.hint, effects: c.effects, goto: c.goto,
      ending: c.ending, kind: c.kind, consume: c.consume, danger: c.danger
    };
  });
  var out = {
    scene: sc, title: sc.title, chapter: sc.chapter, location: sc.location, text: text,
    choices: choices, combat: sc.combat || null, ending: sc.ending || null,
    npc: sc.npc || null
  };
  engine.resolve = out;
  return out;
}

function choose(idx) {
  var r = engine.resolve;
  if (!r || !r.choices[idx]) return null;
  var c = r.choices[idx];
  var notes = applyEffects(engine.state, c.effects);
  if (c.kind === 'mapreturn') return { notes: notes, resolve: r, mapreturn: true, choice: c };
  if (c.goto) { var nr = enterScene(c.goto); engine.resolve = nr; return { notes: notes, resolve: nr, choice: c }; }
  if (c.ending) { recordEnding(c.ending); return { notes: notes, resolve: r, ending: c.ending, choice: c }; }
  return { notes: notes, resolve: r, choice: c };
}

function recordEnding(kind) {
  var s = engine.state;
  if (s.endingsSeen.indexOf(kind) < 0) s.endingsSeen.push(kind);
  s.flags['ending_' + kind] = true;
}

/* ---------- 突破 ---------- */
function tryBreakthrough(s) {
  var idx = s.stats.realmIdx;
  if (idx >= REALMS.length - 1) return { ok: false, msg: '已至巅峰' };
  if (s.stats.xiwei < XIWEI_NEED[idx]) return { ok: false, msg: '修为不足' };
  var isBig = idx === 8 || idx === 11 || idx === 14 || idx === 17 || idx === 20;
  var chance = 0.75;
  if (s.flags.pozhan_jp) chance += 0.3;
  else if (s.flags.pozhang || hasItem(s, 'pozhan_dan')) chance += 0.15;
  if (s.stats.xinjing >= 70) chance += 0.1;
  else if (s.stats.xinjing <= 25) chance -= 0.2;
  if (chance >= 1) { s.stats.realmIdx++; s.stats.xiwei = 0; return { ok: true, big: isBig, crit: true }; }
  if (Math.random() < chance) {
    s.stats.realmIdx++; s.stats.xiwei = 0;
    return { ok: true, big: isBig };
  }
  s.stats.xiwei = Math.floor(s.stats.xiwei * 0.5);
  s.stats.xinjing = clamp(s.stats.xinjing - 10, 0, 100);
  return { ok: false, big: isBig, failed: true };
}

/* ---------- 引擎门面 ---------- */
var engine = {
  REALMS: REALMS, ORIGINS: ORIGINS, SPIRIT_ROOTS: SPIRIT_ROOTS, PHYSIQUES: PHYSIQUES,
  newState: newState, enterScene: enterScene, choose: choose, condPass: condPass,
  applyEffects: applyEffects, gainXiwei: gainXiwei, relStatus: relStatus,
  dominantTemper: dominantTemper, combatStats: combatStats, realmName: realmName,
  realmProgress: realmProgress, tryBreakthrough: tryBreakthrough, recordEnding: recordEnding,
  getScene: getScene, itemDef: itemDef, beastDef: beastDef, charDef: charDef, skillDef: skillDef,
  hasItem: hasItem, hasFlag: hasFlag, interp: interp,
  state: null, resolve: null
};
engine.newGame = function (profile) {
  engine.state = newState(profile);
  engine.resolve = enterScene(engine.state.scene);
  return engine.resolve;
};
g.GameEngine = engine;
g.GameData = GD;

/* Node 测试入口 */
if (typeof module !== 'undefined' && module.exports) module.exports = { engine: engine, GD: GD };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

/* ============================================================

   ============================================================ */
(function (g) {
'use strict';
var PREFIX = 'wdcw_v2_';
var SLOT_KEYS = ['auto', 's0', 's1', 's2'];
var SLOT_NAMES = { auto: '自动存档', s0: '存档位一', s1: '存档位二', s2: '存档位三' };

function storage() {

    if (typeof localStorage !== 'undefined') return localStorage;

<script>
/* ============================================================
   问道苍梧 · 多回合策略战斗
   ============================================================ */
(function (g) {
'use strict';
var E = g.GameEngine;

var combat = {
  active: false, sc: null, enemy: null, pHp: 0, eHp: 0, round: 0, log: [], usedBottom: false, ended: false
};

function start(scene) {
  var def = scene.combat;
  var enemy = typeof def.enemy === 'string' ? E.beastDef(def.enemy) : def.enemy;
  if (!enemy) { E.enterScene(def.winGoto); return; }
  var ps = E.combatStats(E.state);
  combat.active = true; combat.sc = scene; combat.enemy = enemy;
  combat.pHp = ps.hp; combat.eHp = enemy.hp;
  combat.round = 0; combat.log = []; combat.usedBottom = false; combat.ended = false;
  combat.ps = ps;
  if (def.intro) combat.log.push(def.intro);
  combat.log.push('遭遇【' + enemy.name + '】（' + (enemy.tier || '') + '）');
  if (def.beast) E.applyEffects(E.state, { beasts: [def.enemy] });
  render();
}

function enemyAtk() {
  var def = combat.enemy;
  var dmg = Math.max(1, def.atk - Math.floor(combat.ps.def * 0.5) + (Math.random() * 3 - 1));
  combat.pHp -= dmg;
  combat.log.push('【' + def.name + '】向你袭来，你受 <span class="hit">' + dmg + '</span> 点伤（气血 ' + Math.max(0, combat.pHp) + '/' + combat.ps.hp + '）');
}

function playerHit(mult, extra) {
  var dmg = Math.max(1, Math.round(combat.ps.atk * (mult || 1)) - Math.floor(combat.enemy.def * 0.5) + (Math.random() * 3 - 1) + (extra || 0));
  var crit = Math.random() < (0.05 + combat.ps.spd * 0.004);
  if (crit) dmg = Math.round(dmg * 1.8);
  combat.eHp -= dmg;
  combat.log.push((crit ? '<b>暴击！</b>' : '你') + '挥出攻击，命中【' + combat.enemy.name + '】 <span class="hit">' + dmg + '</span> 点（' + Math.max(0, combat.eHp) + '/' + combat.enemy.hp + '）');
}

function act(kind) {
  if (!combat.active || combat.ended) return;
  var s = E.state;
  combat.round++;
  var def = combat.sc.combat;

  switch (kind) {
    case 'attack': playerHit(1.15); break;
    case 'fengmang': playerHit(1.45); combat.log.push('你孤注一掷，全力出手——但门户大开！'); break;
    case 'guard': combat.log.push('你凝神防守，稳住阵脚。'); combat.pHp = Math.min(combat.ps.hp, combat.pHp + 4); break;
    case 'yinshen': playerHit(0.75); combat.log.push('你且战且走，伺机而动。'); break;
    case 'huoyan_ling':
      if (E.hasItem(s, 'huoyan_ling')) { E.applyEffects(s, { items: { remove: { huoyan_ling: 1 } } }); playerHit(2.2, 6); combat.log.push('你掷出火灵符，烈焰轰然炸开！'); }
      else return;
      break;
    case 'ding_shen':
      if (E.hasItem(s, 'dingshen_fu')) { E.applyEffects(s, { items: { remove: { dingshen_fu: 1 } } }); combat.log.push('你祭出定身符，【' + combat.enemy.name + '】被定在原地，动弹不得！'); playerHit(1.6); return; }
      else return;
      break;
    case 'heal':
      if (E.hasItem(s, 'huichun_dan')) { E.applyEffects(s, { items: { remove: { huichun_dan: 1 } } }); var h = 50; combat.pHp = Math.min(combat.ps.hp, combat.pHp + h); combat.log.push('你吞下回春丹，气血恢复 <span class="heal">+' + h + '</span>（' + combat.pHp + '/' + combat.ps.hp + '）'); }
      else if (E.hasItem(s, 'zhixue_san')) { E.applyEffects(s, { items: { remove: { zhixue_san: 1 } } }); var h2 = 20; combat.pHp = Math.min(combat.ps.hp, combat.pHp + h2); combat.log.push('你敷上止血散，气血恢复 <span class="heal">+' + h2 + '</span>'); }
      else return;
      break;
    case 'flee':
      if (E.hasItem(s, 'mizong_fu')) { E.applyEffects(s, { items: { remove: { mizong_fu: 1 } } }); combat.log.push('你捏碎迷踪符，身形化作一缕青烟遁走！'); return end(false, 'flee'); }
      combat.log.push('你试图脱身——却被缠住，动弹不得！');
      break;
  }

  // 敌人反击
  if (combat.eHp > 0) enemyAtk();

  // 胜负判定
  if (combat.eHp <= 0) return end(true);
  if (combat.pHp <= 0) return defeat();
  if (combat.round >= (combat.sc.combat.maxRounds || 6)) {
    combat.log.push('鏖战已久，双方体力不支，各自退开……');
    return end(false, 'stale');
  }
  render();
}

function defeat() {
  var def = combat.sc.combat;
  if (!combat.usedBottom) {
    combat.usedBottom = true;
    combat.log.push('—— 危急关头，你怀中的苍梧镜骤然亮起！');
    combat.log.push('梧老：<span style="color:#4fd1a0">「啧，小子，命都快没了还在逞强。老夫替你挡这一下——下不为例！」</span>');
    combat.pHp = Math.floor(combat.ps.hp * 0.4);
    combat.eHp = Math.max(1, combat.eHp - Math.floor(combat.enemy.hp * 0.2));
    E.applyEffects(E.state, { stats: { xiwei: -30 }, flags: { used_bottom_1: true } });

  }
  return end(false, 'defeat');

function end(win, reason) {

  combat.ended = true;
  var def = combat.sc.combat;
  var notes = [];
  if (win) {
    g.GameAudio.play('win');
    combat.log.push('—— 你击败了【' + combat.enemy.name + '】！');
    if (def.winText) combat.log.push(def.winText);
    if (def.drops) {
      E.applyEffects(E.state, { items: { add: def.drops } });
      notes.push({ type: 'item', k: Object.keys(def.drops)[0], v: def.drops[Object.keys(def.drops)[0]] });
    }
    E.applyEffects(E.state, { stats: { shengwang: (def.shengwang || 2) } });
    var beatFlag = 'beat_' + (typeof def.enemy === 'string' ? def.enemy : combat.enemy.name);
    var beatFx = { flags: {} };
    beatFx.flags[beatFlag] = true;
    E.applyEffects(E.state, beatFx);
  } else {
    g.GameAudio.play('lose');
    combat.log.push('—— ' + (reason === 'flee' ? '你全身而退。' : reason === 'stale' ? '双方暂且罢手。' : '你战败了……'));
  }
  render();
  setTimeout(function () {
    var goto = win ? def.winGoto : (reason === 'flee' ? (def.fleeGoto || def.loseGoto) : def.loseGoto);
    if (!goto) { if (g.GameUI) g.GameUI.closeCombat(); return; }
    var r = E.enterScene(goto);
    if (g.GameUI) { g.GameUI.closeCombat(); g.GameUI.render(r, notes); }
  }, win ? 900 : 1400);
  return win;
}

function options() {
  var s = E.state;
  var opts = [
    { kind: 'attack', label: '⚔ 强攻', desc: '全力进攻（1.15 倍伤害）' },
    { kind: 'fengmang', label: '🔥 锋芒毕露', desc: '孤注一掷（1.45 倍伤害，不设防）' },
    { kind: 'guard', label: '🛡 凝神防守', desc: '稳住阵脚，回复少量气血' },
    { kind: 'yinshen', label: '🌀 游走缠斗', desc: '稳中求进（0.75 倍伤害）' }
  ];
  if (E.hasItem(s, 'huichun_dan') || E.hasItem(s, 'zhixue_san')) opts.push({ kind: 'heal', label: '💊 服丹疗伤', desc: '服用回春丹/止血散恢复气血' });
  if (E.hasItem(s, 'huoyan_ling')) opts.push({ kind: 'huoyan_ling', label: '🔥 火灵符', desc: '掷出火灵符，重创敌人' });
  if (E.hasItem(s, 'dingshen_fu')) opts.push({ kind: 'ding_shen', label: '✋ 定身符', desc: '定住敌人一瞬，追加攻击' });
  if (E.hasItem(s, 'mizong_fu')) opts.push({ kind: 'flee', label: '💨 遁走', desc: '捏碎迷踪符脱身' });
  return opts;
}

function render() {
  if (!g.GameUI) return;
  g.GameUI.renderCombat(combat);
}

g.GameCombat = { start: start, options: options, act: act, get state() { return combat; } };
if (typeof module !== 'undefined' && module.exports) module.exports = g.GameCombat;

  chip.className = 'speaker-chip';

  pEl.appendChild(chip);

}

/* ================= 小标记文本解析 ================= */
function parseSegs(text) {
  // **粗** *红* ~暗~ @说话人@ #梧老#
  var segs = [], re = /(\*\*[^*]+\*\*|\*[^*]+\*|~[^~]+~|@[^@]+@|#[^#]+#)/g;
  var last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) segs.push({ t: text.slice(last, m.index), cls: '' });
    var tok = m[0];
    if (tok[0] === '*' && tok[1] === '*') segs.push({ t: tok.slice(2, -2), cls: 'b' });
    else if (tok[0] === '*') segs.push({ t: tok.slice(1, -1), cls: 'em' });
    else if (tok[0] === '~') segs.push({ t: tok.slice(1, -1), cls: 'dim' });
    else if (tok[0] === '@') segs.push({ t: tok.slice(1, -1), cls: 'spk' });
    else if (tok[0] === '#') segs.push({ t: tok.slice(1, -1), cls: 'spk-wulao' });
    last = m.index + tok.length;
  }
  if (last < text.length) segs.push({ t: text.slice(last), cls: '' });
  return segs;
}

/* ================= 打字机 ================= */
function speedMs() {
  var sp = E.state.settings.textSpeed;
  return sp === 'slow' ? 30 : sp === 'fast' ? 2 : 12;
}
function startTyping(container, paragraphs) {
  stopTyping();
  container.innerHTML = '';
  UI.typing = true; UI.typeDone = false;
  var paras = paragraphs.slice();
  var pi = 0, si = 0, ci = 0;
  var pEl = null, segEl = null, segs = null;
  var caret = $('typing-caret');
  if (caret) caret.classList.remove('hidden');

  function nextChar() {
    if (!UI.typing) return;
    if (pi >= paras.length) { finish(); return; }
    if (!pEl) {
      pEl = document.createElement('p');
      pEl.style.minHeight = '1.6em';
      container.appendChild(pEl);
      segs = parseSegs(paras[pi]);
      attachSpeaker(pEl, segs);
      si = 0;
    }
    if (si >= segs.length) { pi++; pEl = null; schedule(); return; }
    var seg = segs[si];
    if (!segEl) {
      segEl = document.createElement(seg.cls ? 'span' : 'span');
      if (seg.cls) segEl.className = seg.cls;
      pEl.appendChild(segEl);
      ci = 0;
    }
    if (ci < seg.t.length) {
      segEl.textContent += seg.t[ci];
      ci++;
      if (ci % 2 === 0) AUDIO.play('type');
      schedule(1);
    } else { si++; segEl = null; schedule(); }
  }
  function schedule(n) { UI.typeTimer = setTimeout(nextChar, n || speedMs()); }
  function finish() {
    UI.typing = false; UI.typeDone = true;
    if (caret) caret.classList.add('hidden');
    UI.onTypeDone && UI.onTypeDone();
  }
  schedule(2);
}
function stopTyping() { UI.typing = false; if (UI.typeTimer) { clearTimeout(UI.typeTimer); UI.typeTimer = null; } }
function completeTyping() {
  if (!UI.typing) return;
  var c = $('scene-text');
  // 直接全文渲染
  stopTyping();
  var paras = c.__paras || [];
  c.innerHTML = '';
  paras.forEach(function (p) {
    var el = document.createElement('p');
    var psegs = parseSegs(p);
    attachSpeaker(el, psegs);
    psegs.forEach(function (seg) {
      var sp = document.createElement('span');
      if (seg.cls) sp.className = seg.cls;
      sp.textContent = seg.t;
      el.appendChild(sp);
    });
    c.appendChild(el);
  });
  UI.typeDone = true;
  var caret = $('typing-caret'); if (caret) caret.classList.add('hidden');
  UI.onTypeDone && UI.onTypeDone();
}

/* ================= 通知 ================= */
function toast(msg, cls) {
  var box = $('toasts');
  var el = document.createElement('div');
  el.className = 'toast' + (cls ? ' ' + cls : '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(function () { el.remove(); }, 3200);
}
function notesToasts(notes) {
  if (!notes) return;
  notes.forEach(function (n) {
    if (n.type === 'item') { var it = E.itemDef(n.k); if (it) toast((n.v > 0 ? '获得 ' : '失去 ') + it.name + (n.v > 1 ? ' ×' + n.v : '')); AUDIO.play('item'); }
    else if (n.type === 'rel') { var c = E.charDef(n.k); if (c) toast(c.name + ' 好感 ' + (n.v > 0 ? '+' : '') + n.v); }
    else if (n.type === 'stat') { if (STAT_LABELS[n.k]) toast(STAT_LABELS[n.k] + (n.v > 0 ? ' +' : ' ') + n.v); }
    else if (n.type === 'map') { var loc = (GD.map.locations || []).filter(function (l) { return l.id === n.k; })[0]; if (loc) { toast('迷雾散开：「' + loc.name + '」已解锁'); AUDIO.play('fog'); } }
    else if (n.type === 'skill') { var sk = E.skillDef(n.k); if (sk) toast('习得功法：' + sk.name); }
    else if (n.type === 'temper') { toast(TEMPER_LABELS[n.k] + ' 倾向 ' + (n.v > 0 ? '+' : '') + n.v); }
    else if (n.type === 'beast') { var b = E.beastDef(n.k); if (b) toast('图鉴点亮：' + b.name); }
  });
}

/* ================= 选项效果预览 ================= */
function describeEffects(fx) {
  if (!fx) return '';
  var parts = [];
  if (fx.stats) for (var k in fx.stats) { var v = fx.stats[k]; if (v) parts.push(STAT_LABELS[k] + (v > 0 ? '+' : '') + v); }
  if (fx.temper) for (var t in fx.temper) { var tv = fx.temper[t]; if (tv) parts.push(TEMPER_LABELS[t] + (tv > 0 ? '+' : '') + tv); }
  if (fx.rel) for (var r in fx.rel) { var c = E.charDef(r); if (c) parts.push(c.name + (fx.rel[r] > 0 ? '+' : '') + fx.rel[r]); }
  if (fx.items && fx.items.add) for (var i in fx.items.add) { var it = E.itemDef(i); if (it) parts.push('获' + it.name + '×' + fx.items.add[i]); }
  if (fx.items && fx.items.remove) for (var i2 in fx.items.remove) { var it2 = E.itemDef(i2); if (it2) parts.push('失' + it2.name); }
  return parts.join(' · ');
}

/* ================= 主渲染 ================= */
UI.render = function (resolve, notes) {
  if (!resolve || resolve.error) { toast('剧情异常：' + (resolve && resolve.error || '未知')); return; }
  E.resolve = resolve;
  var s = E.state;
  stopTyping();
  // 场景信息
  $('scene-title').textContent = resolve.title || '';
  $('scene-chapter').textContent = chapterOf(resolve);
  $('scene-location').textContent = locName(resolve.location) || '';
  // 正文
  var paras = (resolve.text || '').split(/\n\n+/);
  var textEl = $('scene-text');
  textEl.__paras = paras;
  applyFontSize();
  startTyping(textEl, paras);
  // 选项
  var box = $('choices');
  box.innerHTML = '';
  var showFx = s.settings.showEffects;
  (resolve.choices || []).forEach(function (c, idx) {
    var btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.style.animationDelay = (idx * 70) + 'ms';
    var html = c.text;
    if (c.danger && s.settings.dangerHints) html += ' <span class="cb-hint">此路凶险</span>';
    if (showFx) { var fx = describeEffects(c.effects); if (fx) html += ' <span class="cb-effect">[' + fx + ']</span>'; }
    btn.innerHTML = html;
    btn.addEventListener('click', function () { AUDIO.play('click'); onChoice(idx); });
    box.appendChild(btn);
  });
  // 结局标记
  if (resolve.ending) renderEndingCard(resolve.ending);
  // 章节转场卡（仅在幕切换时浮现一次，同一幕内的多场景不再反复弹出）
  var ch = chapterOf(resolve);
  if (ch && ch !== UI.lastChapter) {
    UI.lastChapter = ch;
    var card = document.createElement('div');
    card.className = 'chapter-card';
    card.innerHTML = '<span>' + ch + '</span><b>' + (resolve.title || '') + '</b>';
    var sa = $('story-area');
    if (sa) sa.appendChild(card);
    setTimeout(function () { if (card.parentNode) card.parentNode.removeChild(card); }, 2500);
  }
  // 战斗
  if (resolve.combat && !UI.combatShown) {
    setTimeout(function () { g.GameCombat.start(resolve); }, 600);
  }
  // 底栏
  updateStatusBar();
  notesToasts(notes);
  SAVE.autosave(s);
};

function onChoice(idx) {
  var r = E.choose(idx);
  if (!r) return;
  notesToasts(r.notes);
  if (r.mapreturn) { openPanel('map'); return; }
  if (r.ending) { UI.renderEnding(r.ending); return; }
  if (r.resolve) { UI.render(r.resolve); }
}
UI.onTypeDone = function () { /* 打字结束后无需额外动作 */ };

function locName(locId) {
  var l = (GD.map.locations || []).filter(function (x) { return x.id === locId; })[0];

  for (var key in dangs) {

function fmtTime(sec) {
  if (!sec) return '0 分钟';
  var m = Math.floor(sec / 60);
  if (m < 60) return m + ' 分钟';
  return Math.floor(m / 60) + ' 小时 ' + (m % 60) + ' 分';
}

    b.addEventListener('click', function () {
      var ax = b.dataset.tp, d = +b.dataset.d;
      var sum = create.temper.xiayi + create.temper.gongli + create.temper.henla;
      if (d > 0 && sum >= 6) { toast('点数已分配完毕（共 6 点）'); return; }
      if (d < 0 && create.temper[ax] <= 0) return;
      create.temper[ax] += d;
      renderCreate(); AUDIO.play('click');
    });
  });
}
function updateTemperLeft() {
  var sum = create.temper.xiayi + create.temper.gongli + create.temper.henla;
  $('temper-left').textContent = 6 - sum;
}
UI.renderCreate = renderCreate;

function startNewGame() {
  screen('create');
  renderCreate();
}
function beginGame() {
  var name = ($('inp-name').value || '沈青玄').trim() || '沈青玄';
  var profile = { name: name, origin: create.origin, spiritRoot: create.root, physique: create.physique, temper: { xiayi: create.temper.xiayi, gongli: create.temper.gongli, henla: create.temper.henla } };
  var resolve = E.newGame(profile);
  screen('game');
  UI.render(resolve);
  AUDIO.play('break');
}
function loadIntoGame(state) {
  if (!state) { toast('存档不存在或已损坏'); return; }
  E.state = state;
  var resolve = E.enterScene(state.scene);
  screen('game');
  UI.render(resolve);
  AUDIO.play('click');
}
UI.loadIntoGame = loadIntoGame;

/* ================= 初始化 ================= */
UI.init = function () {
  // 开始界面
  $('btn-new').addEventListener('click', function () { AUDIO.play('click'); startNewGame(); });
  $('btn-continue').addEventListener('click', function () {
    AUDIO.play('click');
    if (SAVE.hasAuto()) loadIntoGame(SAVE.loadState('auto'));
    else toast('暂无自动存档');
  });
  $('btn-load').addEventListener('click', function () {
    AUDIO.play('click');
    if (!E.state) E.state = E.newState({ name: '沈青玄', origin: 'noble', spiritRoot: 'lei', physique: 'fan', temper: { xiayi: 2, gongli: 2, henla: 2 } });
    renderSave();
    var p = $('panel-save');
    p.classList.remove('hidden'); show('panel-backdrop');
    UI.currentPanel = 'save';
  });
  $('btn-import').addEventListener('click', function () {
    AUDIO.play('click');
    openModal('<h3>导入存档码</h3><textarea class="export-box" id="imp-code" placeholder="粘贴 WDCW2. 开头的存档码"></textarea><div class="m-btns"><button class="btn" id="imp-go">导入</button><button class="btn" data-close="1">取消</button></div>');
    $('imp-go').addEventListener('click', function () {
      var r = SAVE.importCode($('imp-code').value.trim());
      if (r.ok) { toast('导入成功！'); closeModal(); loadIntoGame(r.state); }
      else toast(r.msg);
    });
    $('modal-body').querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', closeModal); });
  });
  // 创建
  $('btn-start').addEventListener('click', beginGame);
  $('btn-root-rand').addEventListener('click', function () {
    var keys = Object.keys(E.SPIRIT_ROOTS).filter(function (k) { return k !== 'an'; });
    create.root = keys[Math.floor(Math.random() * keys.length)];
    renderCreate(); AUDIO.play('click');
  });
  $('btn-body-rand').addEventListener('click', function () {
    var keys = Object.keys(E.PHYSIQUES);
    create.physique = keys[Math.floor(Math.random() * keys.length)];
    renderCreate(); AUDIO.play('click');
  });
  // 顶栏
  document.querySelectorAll('.tb-btn').forEach(function (b) {
    b.addEventListener('click', function () { openPanel(b.dataset.panel); });
  });
  $('panel-backdrop').addEventListener('click', closePanel);
  // 战斗收起
  $('cb-close').addEventListener('click', function () { $('combat-panel').classList.add('hidden'); });
  // 点击正文加速打字
  $('scene-text').addEventListener('click', completeTyping);
  // 计时
  setInterval(function () { if (E.state && document.body.dataset.screen !== 'start') { E.state.playSeconds = (E.state.playSeconds || 0) + 1; } }, 1000);
  // 提示
  $('start-hint').textContent = SAVE.hasAuto() ? '检测到自动存档，可点击「继续上次」' : '';
  AUDIO.unlock();
};
g.GameUI = UI;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ============================================================
   问道苍梧 · 启动
   ============================================================ */
(function (g) {
'use strict';
function boot() {
  g.GameUI.init();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})(typeof window !== 'undefined' ? window : globalThis);

</script>

if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
